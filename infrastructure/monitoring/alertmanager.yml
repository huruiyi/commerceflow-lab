global:
  resolve_timeout: 1m

route:
  receiver: local-webhook
  group_by: [alertname, job, severity]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - receiver: local-webhook
      matchers: [severity="critical"]
      repeat_interval: 15m

receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://alert-webhook:8080/api/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [job]
