rule_files:
  - /etc/prometheus/rules/commerceflow-alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'commerceflow_catalog_event_delivery_pending{job="catalog-service"}'
        values: '1 1 1 1 1 0 0 0 0'
      - series: 'commerceflow_catalog_event_delivery_oldest_seconds{job="catalog-service"}'
        values: '119 120 180 240 300 0 0 0 0'
      - series: 'commerceflow_catalog_event_delivery_dead{job="catalog-service"}'
        values: '0 0 0 1 1 1 1 0 0'
      - series: 'commerceflow_catalog_event_delivery_metrics_refresh_success{job="catalog-service"}'
        values: '1 1 1 0 0 1 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: CommerceFlowCatalogEventDeliveryBacklog
        exp_alerts: []
      - eval_time: 2m
        alertname: CommerceFlowCatalogEventDeliveryBacklog
        exp_alerts:
          - exp_labels:
              job: catalog-service
              severity: warning
            exp_annotations:
              summary: Catalog event delivery backlog is aging
              description: The oldest pending delivery is at least two minutes old and the condition has persisted for one minute.
      - eval_time: 4m
        alertname: CommerceFlowCatalogEventDeliveryBacklog
        exp_alerts: []
      - eval_time: 4m
        alertname: CommerceFlowCatalogEventDeliveryDead
        exp_alerts: []
      - eval_time: 4m
        alertname: CommerceFlowCatalogEventDeliveryMetricsRefreshFailed
        exp_alerts:
          - exp_labels:
              job: catalog-service
              severity: warning
            exp_annotations:
              summary: Catalog event delivery metrics are stale
              description: The sending service could not refresh its Outbox metrics for one minute.
      - eval_time: 6m
        alertname: CommerceFlowCatalogEventDeliveryDead
        exp_alerts:
          - exp_labels:
              job: catalog-service
              severity: warning
            exp_annotations:
              summary: Catalog event delivery requires intervention
              description: The sending Outbox has contained a DEAD delivery for one minute.
      - eval_time: 7m
        alertname: CommerceFlowCatalogEventDeliveryDead
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'commerceflow_notification_delivery_pending{job="commerce-service"}'
        values: '1 1 1 1 1 0 0 0 0'
      - series: 'commerceflow_notification_delivery_oldest_seconds{job="commerce-service"}'
        values: '119 120 180 240 300 0 0 0 0'
      - series: 'commerceflow_notification_delivery_dead{job="commerce-service"}'
        values: '0 0 0 1 1 1 1 0 0'
      - series: 'commerceflow_notification_delivery_metrics_refresh_success{job="commerce-service"}'
        values: '1 1 1 0 0 1 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: CommerceFlowNotificationDeliveryBacklog
        exp_alerts: []
      - eval_time: 2m
        alertname: CommerceFlowNotificationDeliveryBacklog
        exp_alerts:
          - exp_labels:
              job: commerce-service
              severity: warning
            exp_annotations:
              summary: Notification command delivery backlog is aging
              description: The oldest pending delivery is at least two minutes old and the condition has persisted for one minute.
      - eval_time: 4m
        alertname: CommerceFlowNotificationDeliveryBacklog
        exp_alerts: []
      - eval_time: 4m
        alertname: CommerceFlowNotificationDeliveryDead
        exp_alerts: []
      - eval_time: 4m
        alertname: CommerceFlowNotificationDeliveryMetricsRefreshFailed
        exp_alerts:
          - exp_labels:
              job: commerce-service
              severity: warning
            exp_annotations:
              summary: Notification command delivery metrics are stale
              description: The sending service could not refresh its Outbox metrics for one minute.
      - eval_time: 6m
        alertname: CommerceFlowNotificationDeliveryDead
        exp_alerts:
          - exp_labels:
              job: commerce-service
              severity: warning
            exp_annotations:
              summary: Notification command delivery requires intervention
              description: The sending Outbox has contained a DEAD delivery for one minute.
      - eval_time: 7m
        alertname: CommerceFlowNotificationDeliveryDead
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'commerceflow_notification_consumer_lag{job="notification-service"}'
        values: '0 2 2 2 2 0 0 0'
      - series: 'commerceflow_notification_consumer_metrics_refresh_success{job="notification-service"}'
        values: '1 1 1 0 0 1 1 1'
      - series: 'commerceflow_notification_consumer_dead_letters_total{job="notification-service"}'
        values: '0 0 0 0 0 0 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: CommerceFlowNotificationConsumerLag
        exp_alerts: []
      - eval_time: 2m
        alertname: CommerceFlowNotificationConsumerLag
        exp_alerts:
          - exp_labels:
              job: notification-service
              severity: warning
            exp_annotations:
              summary: Notification Kafka consumer is behind
              description: Unconsumed notification command offsets have remained for one minute.
      - eval_time: 4m
        alertname: CommerceFlowNotificationConsumerLag
        exp_alerts: []
      - eval_time: 4m
        alertname: CommerceFlowNotificationConsumerMetricsRefreshFailed
        exp_alerts:
          - exp_labels:
              job: notification-service
              severity: warning
            exp_annotations:
              summary: Notification Kafka consumer lag metrics are stale
              description: The notification service could not refresh broker-side group offsets for one minute.
      - eval_time: 6m
        alertname: CommerceFlowNotificationConsumerDeadLetter
        exp_alerts:
          - exp_labels:
              job: notification-service
              severity: warning
            exp_annotations:
              summary: Notification consumer published a dead letter
              description: A notification command was confirmed on the dead-letter topic in the last two minutes.
      - eval_time: 7m
        alertname: CommerceFlowNotificationConsumerDeadLetter
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'commerceflow_order_shipment_intents_pending{job="order-service"}'
        values: '1 1 1 1 1 1 0 0 0'
      - series: 'commerceflow_order_shipment_intents_oldest_seconds{job="order-service"}'
        values: '119 119 120 180 240 300 0 0 0'
      - series: 'commerceflow_order_cancellation_recovery_required{job="order-service"}'
        values: '0 0 0 0 1 1 1 1 0'
      - series: 'commerceflow_order_metrics_refresh_success{job="order-service"}'
        values: '1 1 1 1 0 0 1 1 1'
      - series: 'commerceflow_order_cancellation_recovery_required{job="commerce-service"}'
        values: '1x8'
      - series: 'commerceflow_order_metrics_refresh_success{job="commerce-service"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 1m
        alertname: CommerceFlowOrderShipmentIntentStalled
        exp_alerts: []
      - eval_time: 2m
        alertname: CommerceFlowOrderShipmentIntentStalled
        exp_alerts: []
      - eval_time: 3m
        alertname: CommerceFlowOrderShipmentIntentStalled
        exp_alerts:
          - exp_labels:
              job: order-service
              severity: warning
            exp_annotations:
              summary: Order shipment intent is stalled
              description: A confirmed order with a shipment intent has had no update for at least two minutes, sustained for one minute.
      - eval_time: 5m
        alertname: CommerceFlowOrderShipmentIntentStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: CommerceFlowOrderCancellationRecoveryRequired
        exp_alerts: []
      - eval_time: 5m
        alertname: CommerceFlowOrderMetricsRefreshFailed
        exp_alerts:
          - exp_labels:
              job: order-service
              severity: warning
            exp_annotations:
              summary: Order database metrics are stale
              description: The order service could not refresh its backlog metrics for one minute.
      - eval_time: 7m
        alertname: CommerceFlowOrderCancellationRecoveryRequired
        exp_alerts:
          - exp_labels:
              job: order-service
              severity: warning
            exp_annotations:
              summary: Order cancellation protocol requires recovery
              description: An order cancellation process has required reconciliation, compensation or manual review for one minute.
      - eval_time: 8m
        alertname: CommerceFlowOrderCancellationRecoveryRequired
        exp_alerts: []
      - eval_time: 8m
        alertname: CommerceFlowOrderMetricsRefreshFailed
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{job="commerce-service",instance="commerce-service:8080"}'
        values: '0x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: CommerceFlowServiceDown
        exp_alerts:
          - exp_labels:
              alertname: CommerceFlowServiceDown
              instance: commerce-service:8080
              job: commerce-service
              severity: critical
            exp_annotations:
              summary: commerce-service is unavailable
              description: Prometheus has failed to scrape commerce-service:8080 for more than one minute.
  - interval: 1m
    input_series:
      - series: 'commerceflow_inventory_outbound_publish_failures_total{job="inventory-service"}'
        values: '0 0 1 1 1'
      - series: 'commerceflow_inventory_outbound_events_pending{job="inventory-service"}'
        values: '0 1 1 1 0'
      - series: 'commerceflow_inventory_outbound_events_oldest_seconds{job="inventory-service"}'
        values: '0 60 120 180 0'
      - series: 'commerceflow_inventory_outbound_metrics_refresh_success{job="inventory-service"}'
        values: '1x4'
    alert_rule_test:
      - eval_time: 1m
        alertname: CommerceFlowInventoryOutboundPublishFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: CommerceFlowInventoryOutboundBacklog
        exp_alerts: []
      - eval_time: 3m
        alertname: CommerceFlowInventoryOutboundPublishFailed
        exp_alerts:
          - exp_labels:
              alertname: CommerceFlowInventoryOutboundPublishFailed
              job: inventory-service
              severity: warning
            exp_annotations:
              summary: Inventory outbound event publication failed
              description: Inventory failed to publish an outbound event or record its acknowledgement within five minutes.
      - eval_time: 3m
        alertname: CommerceFlowInventoryOutboundBacklog
        exp_alerts:
          - exp_labels:
              alertname: CommerceFlowInventoryOutboundBacklog
              job: inventory-service
              severity: warning
            exp_annotations:
              summary: Inventory outbound event backlog is aging
              description: An outbound event has waited at least two minutes and the backlog has persisted for one minute.
      - eval_time: 4m
        alertname: CommerceFlowInventoryOutboundBacklog
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'commerceflow_payment_outbox_pending{job="payment-orchestration-service"}'
        values: '1x7'
      - series: 'commerceflow_payment_command_outbox_pending{job="payment-orchestration-service"}'
        values: '0x7'
      - series: 'commerceflow_payment_process_recovery_required{job="payment-orchestration-service"}'
        values: '1x12'
      - series: 'commerceflow_payment_orphan_open{job="payment-orchestration-service"}'
        values: '1x7'
      - series: 'commerceflow_payment_accepting_traffic{job="payment-orchestration-service"}'
        values: '0x3'
      - series: 'commerceflow_payment_effects_enabled{job="payment-orchestration-service"}'
        values: '1x3'
      - series: 'commerceflow_payment_shadow_enabled{job="payment-orchestration-service"}'
        values: '0x3'
      - series: 'commerceflow_payment_metrics_refresh_success{job="payment-orchestration-service"}'
        values: '0x3'
    alert_rule_test:
      - eval_time: 6m
        alertname: CommerceFlowPaymentOutboxBacklog
        exp_alerts:
          - exp_labels:
              alertname: CommerceFlowPaymentOutboxBacklog
              job: payment-orchestration-service
              severity: warning
            exp_annotations:
              summary: Payment Outbox backlog detected
              description: Payment result or command Outbox rows have remained pending for five minutes.
      - eval_time: 11m
        alertname: CommerceFlowPaymentReconciliationBacklog
        exp_alerts:
          - exp_labels:
              alertname: CommerceFlowPaymentReconciliationBacklog
              job: payment-orchestration-service
              severity: warning
            exp_annotations:
              summary: Payment process recovery backlog detected
              description: At least one payment process has required reconciliation or compensation for ten minutes.
      - eval_time: 6m
        alertname: CommerceFlowPaymentOrphanOpen
        exp_alerts:
          - exp_labels:
              alertname: CommerceFlowPaymentOrphanOpen
              job: payment-orchestration-service
              severity: critical
            exp_annotations:
              summary: Payment shadow orphan requires intervention
              description: Payment shadow orphan quarantine contains an OPEN row for five minutes.
      - eval_time: 2m
        alertname: CommerceFlowPaymentCutoverModeDrift
        exp_alerts:
          - exp_labels:
              alertname: CommerceFlowPaymentCutoverModeDrift
              job: payment-orchestration-service
              severity: critical
            exp_annotations:
              summary: Payment CUTOVER mode has drifted
              description: Payment traffic and effects must stay enabled while shadow replication remains disabled.
      - eval_time: 2m
        alertname: CommerceFlowPaymentMetricsRefreshFailed
        exp_alerts:
          - exp_labels:
              alertname: CommerceFlowPaymentMetricsRefreshFailed
              job: payment-orchestration-service
              severity: warning
            exp_annotations:
              summary: Payment runtime metrics are stale
              description: The payment service could not refresh its database-backed runtime metrics.
  - interval: 1m
    input_series:
      - series: 'commerceflow_payment_reconciliation_open{job="payment-orchestration-service"}'
        values: '4x11 0x2'
      - series: 'commerceflow_payment_process_recovery_required{job="payment-orchestration-service"}'
        values: '0x14'
      - series: 'commerceflow_payment_metrics_refresh_success{job="payment-orchestration-service"}'
        values: '1x14'
    alert_rule_test:
      - eval_time: 9m
        alertname: CommerceFlowPaymentReconciliationIssueOpen
        exp_alerts: []
      - eval_time: 11m
        alertname: CommerceFlowPaymentReconciliationIssueOpen
        exp_alerts:
          - exp_labels:
              alertname: CommerceFlowPaymentReconciliationIssueOpen
              job: payment-orchestration-service
              severity: warning
            exp_annotations:
              summary: Payment reconciliation ledger has open issues
              description: The payment reconciliation ledger has had OPEN issues for ten minutes.
      - eval_time: 11m
        alertname: CommerceFlowPaymentReconciliationBacklog
        exp_alerts: []
      - eval_time: 12m
        alertname: CommerceFlowPaymentReconciliationIssueOpen
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'commerceflow_payment_reconciliation_open{job="payment-orchestration-service"}'
        values: '0x12'
      - series: 'commerceflow_payment_process_recovery_required{job="payment-orchestration-service"}'
        values: '1x12'
      - series: 'commerceflow_payment_metrics_refresh_success{job="payment-orchestration-service"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 11m
        alertname: CommerceFlowPaymentReconciliationIssueOpen
        exp_alerts: []
      - eval_time: 11m
        alertname: CommerceFlowPaymentReconciliationBacklog
        exp_alerts:
          - exp_labels:
              alertname: CommerceFlowPaymentReconciliationBacklog
              job: payment-orchestration-service
              severity: warning
            exp_annotations:
              summary: Payment process recovery backlog detected
              description: At least one payment process has required reconciliation or compensation for ten minutes.
  - interval: 1m
    input_series:
      - series: 'commerceflow_payment_reconciliation_open{job="payment-orchestration-service"}'
        values: '4x12'
      - series: 'commerceflow_payment_metrics_refresh_success{job="payment-orchestration-service"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 11m
        alertname: CommerceFlowPaymentReconciliationIssueOpen
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'commerceflow_payment_refund_processing{job="payment-orchestration-service"}'
        values: '1x12'
      - series: 'commerceflow_logistics_callback_outbox{job="logistics-simulator-service",status="dead"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 11m
        alertname: CommerceFlowRefundBacklog
        exp_alerts:
          - exp_labels:
              alertname: CommerceFlowRefundBacklog
              job: payment-orchestration-service
              severity: warning
            exp_annotations:
              summary: Refund reconciliation backlog detected
              description: At least one refund has remained in processing for ten minutes.
      - eval_time: 6m
        alertname: CommerceFlowLogisticsCallbackDeadLetter
        exp_alerts:
          - exp_labels:
              alertname: CommerceFlowLogisticsCallbackDeadLetter
              job: logistics-simulator-service
              status: dead
              severity: critical
            exp_annotations:
              summary: Logistics callback dead letter requires intervention
              description: The logistics simulator has callback outbox rows in DEAD state for five minutes.
  - interval: 1m
    input_series:
      - series: 'commerceflow_inventory_command_delivery_pending{job="commerce-service"}'
        values: '1 1 1 1 1 1 0 0 0'
      - series: 'commerceflow_inventory_command_delivery_oldest_seconds{job="commerce-service"}'
        values: '119 119 120 180 240 300 0 0 0'
      - series: 'commerceflow_inventory_command_delivery_reconciliation_required{job="commerce-service"}'
        values: '0 0 0 0 1 1 1 1 0'
      - series: 'commerceflow_inventory_command_delivery_metrics_refresh_success{job="commerce-service"}'
        values: '1 1 1 1 0 0 1 1 1'
      - series: 'commerceflow_inventory_command_delivery_pending{job="inventory-service"}'
        values: '1x8'
      - series: 'commerceflow_inventory_command_delivery_oldest_seconds{job="inventory-service"}'
        values: '300x8'
      - series: 'commerceflow_inventory_command_delivery_reconciliation_required{job="inventory-service"}'
        values: '1x8'
      - series: 'commerceflow_inventory_command_delivery_metrics_refresh_success{job="inventory-service"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 1m
        alertname: CommerceFlowInventoryCommandDeliveryBacklog
        exp_alerts: []
      - eval_time: 2m
        alertname: CommerceFlowInventoryCommandDeliveryBacklog
        exp_alerts: []
      - eval_time: 3m
        alertname: CommerceFlowInventoryCommandDeliveryBacklog
        exp_alerts:
          - exp_labels:
              job: commerce-service
              severity: warning
            exp_annotations:
              summary: Inventory command delivery backlog is aging
              description: An inventory command has waited at least two minutes since creation and the backlog has persisted for one minute.
      - eval_time: 5m
        alertname: CommerceFlowInventoryCommandDeliveryBacklog
        exp_alerts: []
      - eval_time: 5m
        alertname: CommerceFlowInventoryCommandReconciliationRequired
        exp_alerts: []
      - eval_time: 5m
        alertname: CommerceFlowInventoryCommandDeliveryMetricsRefreshFailed
        exp_alerts:
          - exp_labels:
              job: commerce-service
              severity: warning
            exp_annotations:
              summary: Inventory command delivery metrics are stale
              description: Commerce could not refresh its inventory command delivery metrics for one minute.
      - eval_time: 7m
        alertname: CommerceFlowInventoryCommandReconciliationRequired
        exp_alerts:
          - exp_labels:
              job: commerce-service
              severity: warning
            exp_annotations:
              summary: Inventory commands require manual reconciliation
              description: The commerce delivery ledger has contained commands requiring manual reconciliation for one minute.
      - eval_time: 8m
        alertname: CommerceFlowInventoryCommandReconciliationRequired
        exp_alerts: []
      - eval_time: 8m
        alertname: CommerceFlowInventoryCommandDeliveryMetricsRefreshFailed
        exp_alerts: []
