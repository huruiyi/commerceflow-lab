global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: commerce-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [commerce-service:8080]
  - job_name: payment-simulator-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [payment-simulator-service:8080]
  - job_name: payment-orchestration-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [payment-orchestration-service:8080]
  - job_name: logistics-simulator-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [logistics-simulator-service:8080]
  - job_name: invoice-simulator-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [invoice-simulator-service:8080]
  - job_name: messaging-simulator-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [messaging-simulator-service:8080]
  - job_name: fulfillment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [fulfillment-service:8080]
  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [inventory-service:8080]
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [order-service:8080]
  - job_name: catalog-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [catalog-service:8080]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [notification-service:8080]
