global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: commerce-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [commerce-service:8080]
  - job_name: payment-simulator-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [payment-simulator-service:8080]
  - job_name: logistics-simulator-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [logistics-simulator-service:8080]
