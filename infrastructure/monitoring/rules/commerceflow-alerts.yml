groups:
  - name: commerceflow-availability
    rules:
      - alert: CommerceFlowWatchdog
        expr: vector(1)
        for: 20s
        labels:
          instance: commerceflow-alerting-pipeline
          job: alerting-pipeline
          severity: none
          service: observability
        annotations:
          summary: CommerceFlow alerting pipeline heartbeat
          description: This always-firing alert verifies Prometheus to Alertmanager to webhook delivery.
      - alert: CommerceFlowServiceDown
        expr: |
          up{job=~"commerce-service|order-service|payment-simulator-service|payment-orchestration-service|logistics-simulator-service|inventory-service|catalog-service|notification-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is unavailable"
          description: "Prometheus has failed to scrape {{ $labels.instance }} for more than one minute."
      - alert: CommerceFlowHighServerErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          clamp_min(sum by (job) (rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} has a high HTTP 5xx ratio"
          description: More than 5% of measured HTTP requests have returned a server error for five minutes.
      - alert: CommerceFlowJvmHeapPressure
        expr: |
          sum by (job) (jvm_memory_used_bytes{area="heap"})
            /
          clamp_min(sum by (job) (jvm_memory_max_bytes{area="heap"}), 1) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} JVM heap pressure is high"
          description: JVM heap usage has remained above 90% for ten minutes.

  - name: commerceflow-business-reliability
    rules:
      - alert: CommerceFlowScheduledTaskFailures
        expr: increase(commerceflow_scheduled_tasks_failed_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Scheduled task execution failed
          description: At least one scheduled task failed during the last five minutes.
      - alert: CommerceFlowMqPublishFailures
        expr: |
          increase(commerceflow_scheduled_tasks_rabbitmq_publish_failed_total[5m]) > 0
          or
          increase(commerceflow_scheduled_tasks_rocketmq_publish_failed_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Scheduled task MQ publishing failed
          description: RabbitMQ or RocketMQ task publication failed during the last five minutes.
      - alert: CommerceFlowRefundBacklog
        expr: commerceflow_payment_refund_processing > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Refund reconciliation backlog detected
          description: At least one refund has remained in processing for ten minutes.
      - alert: CommerceFlowPaymentReconciliationBacklog
        expr: commerceflow_payment_process_recovery_required > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Payment process recovery backlog detected
          description: At least one payment process has required reconciliation or compensation for ten minutes.
      - alert: CommerceFlowPaymentReconciliationIssueOpen
        expr: commerceflow_payment_reconciliation_open > 0 and commerceflow_payment_metrics_refresh_success == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Payment reconciliation ledger has open issues
          description: The payment reconciliation ledger has had OPEN issues for ten minutes.
      - alert: CommerceFlowPaymentOutboxBacklog
        expr: commerceflow_payment_outbox_pending > 0 or commerceflow_payment_command_outbox_pending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Payment Outbox backlog detected
          description: Payment result or command Outbox rows have remained pending for five minutes.
      - alert: CommerceFlowPaymentOrphanOpen
        expr: commerceflow_payment_orphan_open > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Payment shadow orphan requires intervention
          description: Payment shadow orphan quarantine contains an OPEN row for five minutes.
      - alert: CommerceFlowPaymentCutoverModeDrift
        expr: commerceflow_payment_accepting_traffic != 1 or commerceflow_payment_effects_enabled != 1 or commerceflow_payment_shadow_enabled != 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Payment CUTOVER mode has drifted
          description: Payment traffic and effects must stay enabled while shadow replication remains disabled.
      - alert: CommerceFlowPaymentMetricsRefreshFailed
        expr: commerceflow_payment_metrics_refresh_success != 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Payment runtime metrics are stale
          description: The payment service could not refresh its database-backed runtime metrics.

  - name: commerceflow-catalog-and-notification
    rules:
      - alert: CommerceFlowCatalogEventDeliveryBacklog
        expr: |
          commerceflow_catalog_event_delivery_pending{job="catalog-service"} > 0
            and commerceflow_catalog_event_delivery_oldest_seconds{job="catalog-service"} >= 120
            and commerceflow_catalog_event_delivery_metrics_refresh_success{job="catalog-service"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Catalog event delivery backlog is aging
          description: The oldest pending delivery is at least two minutes old and the condition has persisted for one minute.
      - alert: CommerceFlowCatalogEventDeliveryDead
        expr: |
          commerceflow_catalog_event_delivery_dead{job="catalog-service"} > 0
            and commerceflow_catalog_event_delivery_metrics_refresh_success{job="catalog-service"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Catalog event delivery requires intervention
          description: The sending Outbox has contained a DEAD delivery for one minute.
      - alert: CommerceFlowCatalogEventDeliveryMetricsRefreshFailed
        expr: commerceflow_catalog_event_delivery_metrics_refresh_success{job="catalog-service"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Catalog event delivery metrics are stale
          description: The sending service could not refresh its Outbox metrics for one minute.
      - alert: CommerceFlowNotificationDeliveryBacklog
        expr: |
          commerceflow_notification_delivery_pending{job="commerce-service"} > 0
            and commerceflow_notification_delivery_oldest_seconds{job="commerce-service"} >= 120
            and commerceflow_notification_delivery_metrics_refresh_success{job="commerce-service"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Notification command delivery backlog is aging
          description: The oldest pending delivery is at least two minutes old and the condition has persisted for one minute.
      - alert: CommerceFlowNotificationDeliveryDead
        expr: |
          commerceflow_notification_delivery_dead{job="commerce-service"} > 0
            and commerceflow_notification_delivery_metrics_refresh_success{job="commerce-service"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Notification command delivery requires intervention
          description: The sending Outbox has contained a DEAD delivery for one minute.
      - alert: CommerceFlowNotificationDeliveryMetricsRefreshFailed
        expr: commerceflow_notification_delivery_metrics_refresh_success{job="commerce-service"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Notification command delivery metrics are stale
          description: The sending service could not refresh its Outbox metrics for one minute.
      - alert: CommerceFlowNotificationConsumerLag
        expr: |
          commerceflow_notification_consumer_lag{job="notification-service"} > 0
            and commerceflow_notification_consumer_metrics_refresh_success{job="notification-service"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Notification Kafka consumer is behind
          description: Unconsumed notification command offsets have remained for one minute.
      - alert: CommerceFlowNotificationConsumerDeadLetter
        expr: increase(commerceflow_notification_consumer_dead_letters_total{job="notification-service"}[2m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Notification consumer published a dead letter
          description: A notification command was confirmed on the dead-letter topic in the last two minutes.
      - alert: CommerceFlowNotificationConsumerMetricsRefreshFailed
        expr: commerceflow_notification_consumer_metrics_refresh_success{job="notification-service"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Notification Kafka consumer lag metrics are stale
          description: The notification service could not refresh broker-side group offsets for one minute.

  - name: commerceflow-order
    rules:
      - alert: CommerceFlowOrderShipmentIntentStalled
        expr: |
          commerceflow_order_shipment_intents_pending{job="order-service"} > 0
            and commerceflow_order_shipment_intents_oldest_seconds{job="order-service"} >= 120
            and commerceflow_order_metrics_refresh_success{job="order-service"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Order shipment intent is stalled
          description: A confirmed order with a shipment intent has had no update for at least two minutes, sustained for one minute.
      - alert: CommerceFlowOrderCancellationRecoveryRequired
        expr: |
          commerceflow_order_cancellation_recovery_required{job="order-service"} > 0
            and commerceflow_order_metrics_refresh_success{job="order-service"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Order cancellation protocol requires recovery
          description: An order cancellation process has required reconciliation, compensation or manual review for one minute.
      - alert: CommerceFlowOrderMetricsRefreshFailed
        expr: commerceflow_order_metrics_refresh_success{job="order-service"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Order database metrics are stale
          description: The order service could not refresh its backlog metrics for one minute.

  - name: commerceflow-inventory-command-delivery
    rules:
      - alert: CommerceFlowInventoryCommandReconciliationRequired
        expr: |
          commerceflow_inventory_command_delivery_reconciliation_required{job="commerce-service"} > 0
            and commerceflow_inventory_command_delivery_metrics_refresh_success{job="commerce-service"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Inventory commands require manual reconciliation
          description: The commerce delivery ledger has contained commands requiring manual reconciliation for one minute.
      - alert: CommerceFlowInventoryCommandDeliveryBacklog
        expr: |
          commerceflow_inventory_command_delivery_pending{job="commerce-service"} > 0
            and commerceflow_inventory_command_delivery_oldest_seconds{job="commerce-service"} >= 120
            and commerceflow_inventory_command_delivery_metrics_refresh_success{job="commerce-service"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Inventory command delivery backlog is aging
          description: An inventory command has waited at least two minutes since creation and the backlog has persisted for one minute.
      - alert: CommerceFlowInventoryCommandDeliveryMetricsRefreshFailed
        expr: commerceflow_inventory_command_delivery_metrics_refresh_success{job="commerce-service"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Inventory command delivery metrics are stale
          description: Commerce could not refresh its inventory command delivery metrics for one minute.

  - name: commerceflow-inventory-outbound
    rules:
      - alert: CommerceFlowInventoryOutboundPublishFailed
        expr: increase(commerceflow_inventory_outbound_publish_failures_total{job="inventory-service"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Inventory outbound event publication failed
          description: Inventory failed to publish an outbound event or record its acknowledgement within five minutes.
      - alert: CommerceFlowInventoryOutboundBacklog
        expr: |
          commerceflow_inventory_outbound_events_pending{job="inventory-service"} > 0
            and commerceflow_inventory_outbound_events_oldest_seconds{job="inventory-service"} >= 120
            and commerceflow_inventory_outbound_metrics_refresh_success{job="inventory-service"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Inventory outbound event backlog is aging
          description: An outbound event has waited at least two minutes and the backlog has persisted for one minute.

  - name: commerceflow-fulfillment
    rules:
      - alert: CommerceFlowFulfillmentUnavailable
        expr: up{job="fulfillment-service"} == 0 and on() commerceflow_fulfillment_remote_enabled{job="commerce-service"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Fulfillment service is unavailable
          description: Commerce routes fulfillment remotely and Prometheus cannot scrape the fulfillment service.
      - alert: CommerceFlowFulfillmentModeDrift
        expr: |
          (
            (up{job="fulfillment-service"} == 1 unless on(job,instance)
              commerceflow_fulfillment_execution_enabled{job="fulfillment-service"} == 1)
            and on() commerceflow_fulfillment_remote_enabled{job="commerce-service"} == 1
          )
          or
          (
            commerceflow_fulfillment_execution_enabled{job="fulfillment-service"} == 1
            and on() commerceflow_fulfillment_remote_enabled{job="commerce-service"} == 0
          )
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Commerce and fulfillment modes disagree
          description: The configured Commerce route and the independent fulfillment execution mode disagree.
      - alert: CommerceFlowFulfillmentReviewRequired
        expr: commerceflow_fulfillment_jobs_review_required{job="fulfillment-service"} > 0 and on(job,instance) commerceflow_fulfillment_execution_enabled == 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: Fulfillment needs manual review
          description: At least one independent fulfillment job has required manual review for three minutes.
      - alert: CommerceFlowFulfillmentJobsOverdue
        expr: commerceflow_fulfillment_jobs_oldest_due_seconds{job="fulfillment-service"} > 120 and on(job,instance) commerceflow_fulfillment_execution_enabled == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Fulfillment jobs remain overdue
          description: The oldest due job has been more than 120 seconds overdue for two minutes.
      - alert: CommerceFlowFulfillmentExpiredLease
        expr: commerceflow_fulfillment_jobs_leases_expired{job="fulfillment-service"} > 0 and on(job,instance) commerceflow_fulfillment_execution_enabled == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Fulfillment has an expired lease
          description: A pending fulfillment job has retained an expired execution lease for two minutes.
      - alert: CommerceFlowFulfillmentQuarantine
        expr: commerceflow_fulfillment_quarantined{job="fulfillment-service"} > 0 and on(job,instance) commerceflow_fulfillment_execution_enabled == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Independent fulfillment contains quarantined records
          description: The execution database has contained quarantined records for two minutes.
      - alert: CommerceFlowFulfillmentMetricsStale
        expr: |
          (
            commerceflow_fulfillment_metrics_refresh_success{job="fulfillment-service"} != 1
            or time() - commerceflow_fulfillment_metrics_last_success_seconds{job="fulfillment-service"} > 90
            or (up{job="fulfillment-service"} == 1 unless on(job,instance)
              commerceflow_fulfillment_metrics_last_success_seconds{job="fulfillment-service"})
          ) and on(job,instance) commerceflow_fulfillment_execution_enabled == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Fulfillment database metrics are stale
          description: Fulfillment execution metrics are missing, failed to refresh or have not refreshed for over 90 seconds.
      - alert: CommerceFlowLogisticsReconciliationFailure
        expr: increase(commerceflow_logistics_reconciliation_total{result="failed"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: Logistics reconciliation failed
          description: The commerce service recorded a logistics reconciliation failure.
      - alert: CommerceFlowLogisticsCallbackDeadLetter
        expr: commerceflow_logistics_callback_outbox{status="dead"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Logistics callback dead letter requires intervention
          description: The logistics simulator has callback outbox rows in DEAD state for five minutes.
