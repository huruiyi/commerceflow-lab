services:
  warehouse-simulator-db-postgresql:
    container_name: fairy-commerceflow-warehouse-simulator-db-postgresql
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: warehouse_platform
      POSTGRES_PASSWORD: ${WAREHOUSE_PG_ADMIN_PASSWORD:?Set the warehouse PostgreSQL admin password}
    volumes:
      - warehouse-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "warehouse_platform"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  warehouse-postgresql-roles:
    image: postgres:17.11-alpine
    environment:
      PGPASSWORD: ${WAREHOUSE_PG_ADMIN_PASSWORD:?Set the warehouse PostgreSQL admin password}
      WAREHOUSE_PG_MIGRATOR_PASSWORD: ${WAREHOUSE_PG_MIGRATOR_PASSWORD:?Set the warehouse migration password}
      WAREHOUSE_PG_RUNTIME_PASSWORD: ${WAREHOUSE_PG_RUNTIME_PASSWORD:?Set the warehouse runtime password}
    volumes:
      - ./infrastructure/warehouse/postgresql-roles.sql:/roles.sql:ro
    command: ["psql", "-Xq", "-h", "warehouse-simulator-db-postgresql", "-U", "postgres", "-d", "warehouse_platform", "-f", "/roles.sql"]
    depends_on:
      warehouse-simulator-db-postgresql:
        condition: service_healthy

  warehouse-postgresql-migrator:
    image: redgate/flyway:12.4.0
    environment:
      FLYWAY_URL: jdbc:postgresql://warehouse-simulator-db-postgresql:5432/warehouse_platform
      FLYWAY_SCHEMAS: warehouse_platform
      FLYWAY_USER: warehouse_migrator
      FLYWAY_PASSWORD: ${WAREHOUSE_PG_MIGRATOR_PASSWORD:?Set the warehouse migration password}
    volumes:
      - ./simulators/warehouse-platform/service/src/main/resources/db/postgresql:/flyway/sql:ro
      - ./infrastructure/warehouse/postgresql-after-migrate.sql:/flyway/callbacks/afterMigrate.sql:ro
    command: ["-locations=filesystem:/flyway/sql,filesystem:/flyway/callbacks", "migrate"]
    depends_on:
      warehouse-postgresql-roles:
        condition: service_completed_successfully

  warehouse-simulator-service:
    image: ${WAREHOUSE_PG_IMAGE:?Set the verified warehouse candidate image}
    environment:
      WAREHOUSE_DATABASE_URL: jdbc:postgresql://warehouse-simulator-db-postgresql:5432/warehouse_platform?currentSchema=warehouse_platform
      WAREHOUSE_DATABASE_USERNAME: warehouse_runtime
      WAREHOUSE_DATABASE_PASSWORD: ${WAREHOUSE_PG_RUNTIME_PASSWORD:?Set the warehouse runtime password}
      SPRING_PROFILES_ACTIVE: postgresql
      SPRING_FLYWAY_ENABLED: "false"
    depends_on: !override
      warehouse-postgresql-migrator:
        condition: service_completed_successfully

volumes:
  warehouse-postgresql-data:
