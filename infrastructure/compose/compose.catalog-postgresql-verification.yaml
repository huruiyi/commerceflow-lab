services:
  original:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: catalog
      MYSQL_USER: catalog
      MYSQL_PASSWORD: catalog-isolated-runtime
      MYSQL_ROOT_PASSWORD: catalog-isolated-mysql
    volumes:
      - original-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h127.0.0.1 -uroot catalog -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 45

  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_PASSWORD: catalog-isolated-postgresql
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "catalog"]
      interval: 2s
      timeout: 3s
      retries: 45

  rollback:
    extends: original
    volumes:
      - rollback-data:/var/lib/mysql

  migrator:
    image: redgate/flyway:12.4.0
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/catalog
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: catalog-isolated-postgresql
    volumes:
      - ./services/catalog-service/src/main/resources/db/postgresql:/flyway/sql:ro
    command: ["-target=1", "migrate"]

networks:
  default:
    internal: true

volumes:
  original-data:
  postgres-data:
  rollback-data:
