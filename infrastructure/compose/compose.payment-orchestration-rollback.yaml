services:
  payment-db-rollback:
    container_name: fairy-commerceflow-payment-db-rollback
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: payments
      MYSQL_USER: payments
      MYSQL_PASSWORD: ${PAYMENT_ORCHESTRATION_ROLLBACK_PASSWORD:?Set the payment orchestration rollback application password}
      MYSQL_ROOT_PASSWORD: ${PAYMENT_ORCHESTRATION_ROLLBACK_ROOT_PASSWORD:?Set the payment orchestration rollback admin password}
    volumes:
      - payment-rollback-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -upayments payments -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 45
    restart: unless-stopped

  payment-orchestration-service:
    build: !reset null
    image: ${PAYMENT_ORCHESTRATION_ROLLBACK_IMAGE:?Set the original payment orchestration image}
    pull_policy: never
    environment:
      DATABASE_URL: jdbc:mysql://payment-db-rollback:3306/payments?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: payments
      DATABASE_PASSWORD: ${PAYMENT_ORCHESTRATION_ROLLBACK_PASSWORD:?Set the payment orchestration rollback application password}
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      payment-db: !reset null
      payment-db-rollback:
        condition: service_healthy

volumes:
  payment-rollback-data:
