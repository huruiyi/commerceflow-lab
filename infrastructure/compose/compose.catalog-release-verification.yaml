services:
  catalog-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: catalog
      MYSQL_USER: catalog
      MYSQL_PASSWORD: catalog-isolated-runtime
      MYSQL_ROOT_PASSWORD: catalog-isolated-mysql
    volumes:
      - catalog-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h127.0.0.1 -uroot catalog -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 45

  catalog-service:
    image: ${CATALOG_ROLLBACK_IMAGE:?Set the original catalog image}
    environment:
      DATABASE_URL: jdbc:mysql://catalog-db:3306/catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: catalog
      DATABASE_PASSWORD: catalog-isolated-runtime
      CATALOG_INTERNAL_SECRET: catalog-runtime-verification
      INVENTORY_SERVICE_INTERNAL_URL: http://inventory:8080
      CATALOG_EVENT_DELIVERY_ENABLED: ${CATALOG_WINDOW_WORKERS:-true}
      COMMERCEFLOW_CATALOG_SEARCH_INDEXING_ENABLED: ${CATALOG_WINDOW_WORKERS:-true}
      COMMERCEFLOW_CATALOG_SEARCH_ELASTICSEARCH_ENABLED: ${CATALOG_WINDOW_WORKERS:-true}
      COMMERCEFLOW_CATALOG_SEARCH_ELASTICSEARCH_URL: http://elastic:9200
    networks:
      default:
        aliases: [catalog]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  catalog-db-data:
