services:
  invoice-db-rollback:
    container_name: fairy-commerceflow-invoice-db-rollback
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: invoice_platform
      MYSQL_USER: invoice
      MYSQL_PASSWORD: ${INVOICE_ROLLBACK_PASSWORD:?Set the rollback MySQL runtime password}
      MYSQL_ROOT_PASSWORD: ${INVOICE_ROLLBACK_ROOT_PASSWORD:?Set the rollback MySQL admin password}
    volumes:
      - invoice-rollback-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -uinvoice invoice_platform -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  invoice-simulator-service:
    image: ${INVOICE_ROLLBACK_IMAGE:?Set the original invoice image}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://invoice-db-rollback:3306/invoice_platform?allowPublicKeyRetrieval=true&sslMode=DISABLED&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: invoice
      SPRING_DATASOURCE_PASSWORD: ${INVOICE_ROLLBACK_PASSWORD:?Set the rollback MySQL runtime password}
      SPRING_PROFILES_ACTIVE: default
    depends_on: !override
      invoice-db-rollback:
        condition: service_healthy

volumes:
  invoice-rollback-data:
