services:
  catalog-db-rollback:
    container_name: fairy-commerceflow-catalog-db-rollback
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: catalog
      MYSQL_USER: catalog
      MYSQL_PASSWORD: ${CATALOG_ROLLBACK_PASSWORD:?Set the rollback MySQL runtime password}
      MYSQL_ROOT_PASSWORD: ${CATALOG_ROLLBACK_ROOT_PASSWORD:?Set the rollback MySQL admin password}
    volumes:
      - catalog-rollback-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -ucatalog catalog -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  catalog-service:
    image: ${CATALOG_ROLLBACK_IMAGE:?Set the original catalog image}
    environment:
      DATABASE_URL: jdbc:mysql://catalog-db-rollback:3306/catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: catalog
      DATABASE_PASSWORD: ${CATALOG_ROLLBACK_PASSWORD:?Set the rollback MySQL runtime password}
      SPRING_PROFILES_ACTIVE: default
    depends_on: !override
      catalog-db-rollback:
        condition: service_healthy

volumes:
  catalog-rollback-data:
