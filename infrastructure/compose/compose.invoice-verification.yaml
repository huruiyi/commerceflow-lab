services:
  invoice-db-postgresql:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: invoice_platform
      POSTGRES_PASSWORD: invoice-verification-root
      POSTGRES_RUNTIME_USER: invoice_runtime
      POSTGRES_RUNTIME_PASSWORD: invoice-verification-password
      POSTGRES_RUNTIME_SCHEMA: invoice_platform
    volumes:
      - invoice-postgresql-data:/var/lib/postgresql/data
      - ../../infrastructure/postgresql/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "invoice_platform"]
      interval: 2s
      timeout: 3s
      retries: 45

  invoice-simulator-service:
    image: ${INVOICE_VERIFICATION_IMAGE:-commerceflow-invoice-isolated:local}
    build:
      context: ../../simulators/invoice-platform/service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://invoice-db-postgresql:5432/invoice_platform?currentSchema=invoice_platform
      SPRING_DATASOURCE_USERNAME: invoice_runtime
      SPRING_PROFILES_ACTIVE: postgresql
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_DEFAULT_SCHEMA: invoice_platform
      SPRING_DATASOURCE_PASSWORD: invoice-verification-password
      INVOICE_REQUEST_SECRET: invoice-isolated-request-secret-2026
      INVOICE_CALLBACK_SECRET: invoice-isolated-callback-secret-2026
      INVOICE_CALLBACK_URL: http://receipt-fixture:8080/receipts
      COMMERCEFLOW_INVOICE_PROCESSING_DELAY_MS: 6000
      COMMERCEFLOW_INVOICE_CALLBACK_RETRY_MS: 800
    ports:
      - "127.0.0.1::8080"
    depends_on:
      invoice-db-postgresql:
        condition: service_healthy

  receipt-fixture:
    image: python:3.13-alpine
    command: ["python", "-u", "/fixture.py"]
    environment:
      INVOICE_CALLBACK_SECRET: invoice-isolated-callback-secret-2026
    volumes:
      - ../../scripts/invoice/invoice-receipt-fixture.py:/fixture.py:ro
    ports:
      - "127.0.0.1::8080"

volumes:
  invoice-postgresql-data:
