services:
  commerce-service:
    image: fairy-commerceflow-commerce-service:${INVOICE_RELEASE_TAG:?Set INVOICE_RELEASE_TAG}
    environment:
      INVOICE_ENABLED: "true"
      INVOICE_BASE_URL: http://invoice-simulator-service:8080
    env_file:
      - ${COMMERCEFLOW_INVOICE_ENV_DIR:?Set COMMERCEFLOW_INVOICE_ENV_DIR}/signing.env
    depends_on:
      invoice-simulator-service:
        condition: service_healthy

  payment-orchestration-service:
    image: fairy-commerceflow-payment-orchestration-service:${INVOICE_RELEASE_TAG:?Set INVOICE_RELEASE_TAG}

  commerce-portal-angular:
    image: fairy-commerceflow-commerce-portal-angular:${INVOICE_RELEASE_TAG:?Set INVOICE_RELEASE_TAG}

  invoice-db:
    container_name: fairy-commerceflow-invoice-db
    image: mysql:8.4
    env_file:
      - ${COMMERCEFLOW_INVOICE_ENV_DIR:?Set COMMERCEFLOW_INVOICE_ENV_DIR}/database.env
    environment:
      MYSQL_DATABASE: invoice_platform
      MYSQL_USER: invoice
    volumes:
      - invoice-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -uinvoice invoice_platform -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  invoice-simulator-service:
    container_name: fairy-commerceflow-invoice-simulator-service
    image: fairy-commerceflow-invoice-simulator-service:${INVOICE_RELEASE_TAG:?Set INVOICE_RELEASE_TAG}
    env_file:
      - ${COMMERCEFLOW_INVOICE_ENV_DIR:?Set COMMERCEFLOW_INVOICE_ENV_DIR}/datasource.env
      - ${COMMERCEFLOW_INVOICE_ENV_DIR:?Set COMMERCEFLOW_INVOICE_ENV_DIR}/signing.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://invoice-db:3306/invoice_platform?allowPublicKeyRetrieval=true&sslMode=DISABLED&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: invoice
      INVOICE_CALLBACK_URL: http://commerce-service:8080/internal/v1/invoice-receipts
    depends_on:
      invoice-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  invoice-db-data:
