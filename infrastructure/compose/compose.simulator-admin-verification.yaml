services:
  logistics-simulator-service:
    environment:
      LOGISTICS_ADMIN_TOKEN: demo-logistics-admin-token
      LOGISTICS_CALLBACK_DELIVERY_ENABLED: "true"
      LOGISTICS_CALLBACK_DELIVERY_INITIAL_DELAY: 1s
      LOGISTICS_CALLBACK_DELIVERY_SCAN_INTERVAL: 300ms
      LOGISTICS_CALLBACK_DELIVERY_RETRY_DELAY: 2s
      LOGISTICS_CALLBACK_DELIVERY_MAX_ATTEMPTS: "10"
      LOGISTICS_AUTO_PROGRESS_ENABLED: "false"

  warehouse-simulator-service:
    environment:
      WAREHOUSE_ADMIN_TOKEN: demo-warehouse-admin-token
      FULFILLMENT_WAREHOUSE_SECRET: isolated-warehouse-fulfillment-secret
      WAREHOUSE_RETURN_SECRET: isolated-warehouse-return-secret

  messaging-simulator-service:
    environment:
      MESSAGING_ADMIN_TOKEN: demo-messaging-admin-token
      MESSAGING_FAULTS_ENABLED: "false"

  fulfillment-service:
    environment:
      FULFILLMENT_WAREHOUSE_SECRET: isolated-warehouse-fulfillment-secret

  commerce-service:
    environment:
      INVOICE_ENABLED: "true"
      INVOICE_BASE_URL: http://simulator-fault-fixture:8080
      INVOICE_REQUEST_SECRET: simulator-admin-test-request-signing-secret
      INVOICE_CALLBACK_SECRET: simulator-admin-test-callback-signing-secret
      WAREHOUSE_RETURN_SECRET: isolated-warehouse-return-secret

  payment-simulator-service:
    environment:
      PAYMENT_CALLBACK_URL: http://simulator-fault-fixture:8080/api/payment-notifications/callback

  notification-service-postgresql:
    environment:
      COMMERCEFLOW_OFFSITE_PROVIDER_URL: http://simulator-fault-fixture:8080

  invoice-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: invoice_platform
      MYSQL_USER: invoice
      MYSQL_PASSWORD: simulator-admin-test-invoice
      MYSQL_ROOT_PASSWORD: simulator-admin-test-invoice-root
    volumes:
      - invoice-test-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -uinvoice -p$$MYSQL_PASSWORD invoice_platform -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 45

  invoice-simulator-service:
    build: ./simulators/invoice-platform/service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://invoice-db:3306/invoice_platform
      SPRING_DATASOURCE_USERNAME: invoice
      SPRING_DATASOURCE_PASSWORD: simulator-admin-test-invoice
      INVOICE_REQUEST_SECRET: simulator-admin-test-request-signing-secret
      INVOICE_CALLBACK_SECRET: simulator-admin-test-callback-signing-secret
      INVOICE_CALLBACK_URL: http://simulator-fault-fixture:8080/internal/v1/invoice-receipts
      COMMERCEFLOW_INVOICE_PROCESSING_DELAY_MS: "6000"
      COMMERCEFLOW_INVOICE_CALLBACK_RETRY_MS: "800"
    depends_on:
      invoice-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 4s
      timeout: 3s
      retries: 50

  simulator-fault-fixture:
    image: python:3.13-alpine
    command: ["python", "-u", "/channel-faults.py"]
    volumes:
      - ./scripts/operations/simulator-admin/channel-faults.py:/channel-faults.py:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  invoice-test-data:
