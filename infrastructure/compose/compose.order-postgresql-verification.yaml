services:
  original:
    image: mysql:8.4
    command: ["--innodb-use-native-aio=OFF"]
    environment:
      MYSQL_DATABASE: orders
      MYSQL_USER: orders
      MYSQL_PASSWORD: order-isolated-runtime
      MYSQL_ROOT_PASSWORD: order-isolated-mysql
    volumes:
      - original-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h127.0.0.1 -uroot orders -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 45

  rollback:
    extends:
      file: infrastructure/compose/compose.order-rollback.yaml
      service: order-db-rollback
    container_name: !reset null
    command: ["--innodb-use-native-aio=OFF"]

  order-db-postgresql:
    extends:
      file: infrastructure/compose/compose.order-postgresql.yaml
      service: order-db-postgresql
    container_name: !reset null

  order-postgresql-roles:
    extends:
      file: infrastructure/compose/compose.order-postgresql.yaml
      service: order-postgresql-roles
    volumes: !override
      - ./infrastructure/order/postgresql-roles.sql:/roles.sql:ro

  order-postgresql-migrator:
    extends:
      file: infrastructure/compose/compose.order-postgresql.yaml
      service: order-postgresql-migrator
    volumes: !override
      - ./services/order-service/src/main/resources/db/postgresql:/flyway/sql:ro
      - ./infrastructure/order/postgresql-after-migrate.sql:/flyway/callbacks/afterMigrate.sql:ro

  order:
    image: ${ORDER_VERIFICATION_IMAGE:?Set the isolated order verification image}
    environment:
      DATABASE_URL: ${ORDER_VERIFICATION_DATABASE:?Set the isolated orders JDBC URL}
      DATABASE_USERNAME: ${ORDER_VERIFICATION_USER:?Set the isolated orders account}
      DATABASE_PASSWORD: ${ORDER_VERIFICATION_PASSWORD:?Set the isolated orders password}
      SPRING_PROFILES_ACTIVE: ${ORDER_VERIFICATION_PROFILE:-default}
      SPRING_FLYWAY_ENABLED: ${ORDER_VERIFICATION_FLYWAY:-true}
      ORDER_ACCEPTING_TRAFFIC: "true"
      ORDER_SHADOW_ENABLED: "false"
      ORDER_INTERNAL_SECRET: order-rehearsal-commerce
      PAYMENT_ORDER_INTERNAL_SECRET: order-rehearsal-payment
      FULFILLMENT_ORDER_SECRET: order-rehearsal-fulfillment
    healthcheck: &app-health
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 2s
      timeout: 3s
      retries: 45

  payment-db:
    image: mysql:8.4
    command: ["--innodb-use-native-aio=OFF"]
    environment:
      MYSQL_DATABASE: payments
      MYSQL_USER: payments
      MYSQL_PASSWORD: order-rehearsal-payment-db
      MYSQL_ROOT_PASSWORD: order-rehearsal-payment-root
    volumes:
      - payment-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h127.0.0.1 -uroot payments -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 45

  payment:
    image: ${ORDER_VERIFICATION_PAYMENT_IMAGE:?Set the isolated payment orchestration image}
    environment:
      DATABASE_URL: jdbc:mysql://payment-db:3306/payments?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: payments
      DATABASE_PASSWORD: order-rehearsal-payment-db
      PAYMENT_ACCEPTING_TRAFFIC: "true"
      PAYMENT_EFFECTS_ENABLED: "false"
      PAYMENT_INTERNAL_SECRET: order-rehearsal-payment-api
    healthcheck: *app-health

  inventory-db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_PASSWORD: order-rehearsal-inventory-db
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "inventory"]
      interval: 2s
      timeout: 3s
      retries: 45

  inventory:
    image: ${ORDER_VERIFICATION_INVENTORY_IMAGE:?Set the isolated PostgreSQL inventory image}
    environment:
      DATABASE_URL: jdbc:postgresql://inventory-db:5432/inventory
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: order-rehearsal-inventory-db
      SPRING_PROFILES_ACTIVE: postgresql
      INVENTORY_ACCEPTING_TRAFFIC: "true"
      INVENTORY_INTERNAL_SECRET: order-rehearsal-inventory-api
    healthcheck: *app-health

  verifier:
    image: node:26.13.1-alpine3.24
    command: ["node", "-e", "setInterval(() => {}, 3600000)"]
    volumes:
      - ./scripts/orders:/verification:ro

networks:
  default:
    internal: true

volumes:
  original-data:
  order-rollback-data:
  order-postgresql-data:
  payment-data:
  inventory-data:
