# MySQL learning baseline. Use a separate Compose project and fresh ports.
services:
  notification-service-postgresql:
    profiles: [notification-postgresql]
  notification-db-postgresql:
    profiles: [notification-postgresql]
  notification-db:
    profiles: !reset []
  commerce-service:
    depends_on:
      notification-service-postgresql: !reset null
      notification-service:
        condition: service_healthy
  notification-service:
    container_name: fairy-commerceflow-notification-service
    build:
      context: ./services/notification-service
    environment:
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: ${NOTIFICATION_MYSQL_OFFSET_RESET:-earliest}
      COMMERCEFLOW_NOTIFICATION_WRITE_PAUSE_FILE: /gate/writes.paused
      DATABASE_URL: jdbc:mysql://notification-db:3306/notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: ${NOTIFICATION_DATABASE_USERNAME:-notification}
      DATABASE_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD:-notification-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      NOTIFICATION_DELIVERY_TOPIC: ${NOTIFICATION_DELIVERY_TOPIC:-customer-notification-commands}
      NOTIFICATION_CONSUMER_GROUP: ${NOTIFICATION_CONSUMER_GROUP:-commerceflow-independent-notification-v1}
      COMMERCEFLOW_OFFSITE_COMMERCE_SECRET: ${OFFSITE_COMMERCE_SECRET:-demo-offsite-commerce-secret}
      COMMERCEFLOW_OFFSITE_PAYMENT_SECRET: ${OFFSITE_PAYMENT_SECRET:-demo-offsite-payment-secret}
      COMMERCEFLOW_OFFSITE_PROVIDER_SECRET: ${MESSAGING_SENDER_SECRET:-demo-messaging-sender-secret}
      COMMERCEFLOW_OFFSITE_CUSTOMER_SMS: ${OFFSITE_CUSTOMER_SMS-+12025550101}
      COMMERCEFLOW_OFFSITE_CUSTOMER_EMAIL: ${OFFSITE_CUSTOMER_EMAIL-customer@commerceflow.test}
      COMMERCEFLOW_OFFSITE_MERCHANT_SMS: ${OFFSITE_MERCHANT_SMS-+12025550102}
      COMMERCEFLOW_OFFSITE_MERCHANT_EMAIL: ${OFFSITE_MERCHANT_EMAIL-merchant@commerceflow.test}
      NOTIFICATION_INTERNAL_SECRET: ${NOTIFICATION_INTERNAL_SECRET:-demo-notification-internal-secret}
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "${NOTIFICATION_HOST_PORT:-18086}:8080"
    volumes:
      - notification-maintenance:/gate:ro
    depends_on:
      notification-db:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
