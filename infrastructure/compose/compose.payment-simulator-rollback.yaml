services:
  payment-simulator-db-rollback:
    container_name: fairy-commerceflow-payment-simulator-db-rollback
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: payment_platform
      MYSQL_USER: payment
      MYSQL_PASSWORD: ${PAYMENT_SIMULATOR_ROLLBACK_PASSWORD:?Set the payment simulator rollback application password}
      MYSQL_ROOT_PASSWORD: ${PAYMENT_SIMULATOR_ROLLBACK_ROOT_PASSWORD:?Set the payment simulator rollback admin password}
    volumes:
      - payment-simulator-rollback-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -upayment payment_platform -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 45
    restart: unless-stopped

  payment-simulator-service:
    build: !reset null
    image: ${PAYMENT_SIMULATOR_ROLLBACK_IMAGE:?Set the original payment simulator image}
    pull_policy: never
    environment:
      PAYMENT_DATABASE_URL: jdbc:mysql://payment-simulator-db-rollback:3306/payment_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PAYMENT_DATABASE_USERNAME: payment
      PAYMENT_DATABASE_PASSWORD: ${PAYMENT_SIMULATOR_ROLLBACK_PASSWORD:?Set the payment simulator rollback application password}
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      payment-simulator-db: !reset null
      payment-simulator-db-rollback:
        condition: service_healthy

volumes:
  payment-simulator-rollback-data:
