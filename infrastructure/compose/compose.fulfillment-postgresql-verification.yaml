services:
  original:
    image: mysql:8.4
    command: ["--innodb-use-native-aio=OFF"]
    environment:
      MYSQL_DATABASE: fulfillment
      MYSQL_USER: fulfillment
      MYSQL_PASSWORD: fulfillment-isolated-runtime
      MYSQL_ROOT_PASSWORD: fulfillment-isolated-mysql
    volumes:
      - original-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h127.0.0.1 -uroot fulfillment -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 45

  rollback:
    extends: original
    volumes:
      - rollback-data:/var/lib/mysql

  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: fulfillment
      POSTGRES_PASSWORD: fulfillment-isolated-postgresql
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "fulfillment"]
      interval: 2s
      timeout: 3s
      retries: 45

  migrator:
    image: redgate/flyway:12.4.0
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/fulfillment
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: fulfillment-isolated-postgresql
    volumes:
      - ./services/fulfillment-service/src/main/resources/db/postgresql:/flyway/sql:ro
    command: ["-target=1", "migrate"]

  fulfillment:
    image: ${FULFILLMENT_VERIFICATION_IMAGE:?Set the fulfillment verification image}
    environment:
      FULFILLMENT_DATABASE_URL: ${FULFILLMENT_VERIFICATION_DATABASE:?Set the isolated database URL}
      FULFILLMENT_DATABASE_USERNAME: ${FULFILLMENT_VERIFICATION_USER:?Set the isolated database account}
      FULFILLMENT_DATABASE_PASSWORD: ${FULFILLMENT_VERIFICATION_PASSWORD:?Set the isolated database password}
      SPRING_PROFILES_ACTIVE: ${FULFILLMENT_VERIFICATION_PROFILE:-default}
      FULFILLMENT_RUNTIME_MODE: EXECUTION
      FULFILLMENT_REQUIRE_PROMOTED_MODE: "true"
      FULFILLMENT_INTERNAL_SECRET: fulfillment-isolated-api
      FULFILLMENT_ORDER_ENDPOINT: http://fixture:8080
      FULFILLMENT_ORDER_SECRET: fulfillment-isolated-order
      FULFILLMENT_LOGISTICS_ENDPOINT: http://fixture:8080
      FULFILLMENT_LOGISTICS_SECRET: fulfillment-isolated-logistics
      FULFILLMENT_INVENTORY_ENDPOINT: http://fixture:8080
      FULFILLMENT_INVENTORY_SECRET: fulfillment-isolated-inventory
      FULFILLMENT_WAREHOUSE_ENDPOINT: http://fixture:8080
      FULFILLMENT_WAREHOUSE_SECRET: fulfillment-isolated-warehouse
      COMMERCEFLOW_FULFILLMENT_EXECUTION_DELAY: 300ms
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 2s
      timeout: 3s
      retries: 45

  fixture:
    image: node:26.13.1-alpine3.24
    command: ["node", "/fixture/fulfillment-postgresql-fixture.mjs"]
    volumes:
      - ./scripts/fulfillment:/fixture:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/state').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  default:
    internal: true

volumes:
  original-data:
  rollback-data:
  postgres-data:
