services:
  inventory-db-rollback:
    container_name: fairy-commerceflow-inventory-db-rollback
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: ${INVENTORY_ROLLBACK_PASSWORD:?Set the inventory rollback application password}
      MYSQL_ROOT_PASSWORD: ${INVENTORY_ROLLBACK_ROOT_PASSWORD:?Set the inventory rollback admin password}
    volumes:
      - inventory-rollback-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -uinventory inventory -e 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 45
    restart: unless-stopped

  inventory-service:
    build: !reset null
    image: ${INVENTORY_ROLLBACK_IMAGE:?Set the original inventory image}
    pull_policy: never
    environment:
      DATABASE_URL: jdbc:mysql://inventory-db-rollback:3306/inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: inventory
      DATABASE_PASSWORD: ${INVENTORY_ROLLBACK_PASSWORD:?Set the inventory rollback application password}
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      inventory-db: !reset null
      inventory-db-rollback:
        condition: service_healthy

volumes:
  inventory-rollback-data:
