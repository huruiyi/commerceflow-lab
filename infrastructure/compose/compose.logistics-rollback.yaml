services:
  logistics-simulator-db-rollback:
    container_name: fairy-commerceflow-logistics-simulator-db-rollback
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: logistics_platform
      MYSQL_USER: logistics
      MYSQL_PASSWORD: ${LOGISTICS_ROLLBACK_PASSWORD:?Set the rollback MySQL runtime password}
      MYSQL_ROOT_PASSWORD: ${LOGISTICS_ROLLBACK_ROOT_PASSWORD:?Set the rollback MySQL admin password}
    volumes:
      - logistics-rollback-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  logistics-simulator-service:
    image: ${LOGISTICS_ROLLBACK_IMAGE:?Set the original logistics image}
    environment:
      LOGISTICS_DATABASE_USERNAME: logistics
      LOGISTICS_DATABASE_PASSWORD: ${LOGISTICS_ROLLBACK_PASSWORD:?Set the rollback MySQL runtime password}
      SPRING_PROFILES_ACTIVE: default
      LOGISTICS_DATABASE_URL: jdbc:mysql://logistics-simulator-db-rollback:3306/logistics_platform?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    depends_on: !override
      logistics-simulator-db-rollback:
        condition: service_healthy

volumes:
  logistics-rollback-data:
