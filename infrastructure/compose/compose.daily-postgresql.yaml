# Existing release databases use their original named volumes and credentials.
services:
  commerce-db-postgresql:
    environment:
      POSTGRES_PASSWORD: ${COMMERCE_POSTGRES_ADMIN_PASSWORD:?Set COMMERCE_POSTGRES_ADMIN_PASSWORD for the existing PostgreSQL deployment}

  commerce-service:
    environment:
      DATABASE_PASSWORD: ${COMMERCE_POSTGRES_RUNTIME_PASSWORD:?Set COMMERCE_POSTGRES_RUNTIME_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"
      INVOICE_REQUEST_SECRET: ${INVOICE_REQUEST_SECRET:?Set INVOICE_REQUEST_SECRET for the existing PostgreSQL deployment}
      INVOICE_CALLBACK_SECRET: ${INVOICE_CALLBACK_SECRET:?Set INVOICE_CALLBACK_SECRET for the existing PostgreSQL deployment}

  catalog-db-postgresql:
    environment:
      POSTGRES_PASSWORD: ${CATALOG_PG_ADMIN_PASSWORD:?Set CATALOG_PG_ADMIN_PASSWORD for the existing PostgreSQL deployment}

  catalog-service:
    environment:
      DATABASE_PASSWORD: ${CATALOG_PG_RUNTIME_PASSWORD:?Set CATALOG_PG_RUNTIME_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"

  order-db-postgresql:
    environment:
      POSTGRES_PASSWORD: ${ORDER_PG_ADMIN_PASSWORD:?Set ORDER_PG_ADMIN_PASSWORD for the existing PostgreSQL deployment}

  order-service:
    environment:
      DATABASE_PASSWORD: ${ORDER_PG_RUNTIME_PASSWORD:?Set ORDER_PG_RUNTIME_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"

  inventory-db-postgresql:
    environment:
      POSTGRES_PASSWORD: ${INVENTORY_PG_ADMIN_PASSWORD:?Set INVENTORY_PG_ADMIN_PASSWORD for the existing PostgreSQL deployment}

  inventory-service:
    environment:
      DATABASE_PASSWORD: ${INVENTORY_PG_RUNTIME_PASSWORD:?Set INVENTORY_PG_RUNTIME_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"

  fulfillment-db-postgresql:
    environment:
      POSTGRES_PASSWORD: ${FULFILLMENT_PG_ADMIN_PASSWORD:?Set FULFILLMENT_PG_ADMIN_PASSWORD for the existing PostgreSQL deployment}

  fulfillment-service:
    environment:
      FULFILLMENT_DATABASE_PASSWORD: ${FULFILLMENT_PG_RUNTIME_PASSWORD:?Set FULFILLMENT_PG_RUNTIME_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"

  payment-db-postgresql:
    environment:
      POSTGRES_PASSWORD: ${PAYMENT_ORCHESTRATION_PG_ADMIN_PASSWORD:?Set PAYMENT_ORCHESTRATION_PG_ADMIN_PASSWORD for the existing PostgreSQL deployment}

  payment-orchestration-service:
    environment:
      DATABASE_PASSWORD: ${PAYMENT_ORCHESTRATION_PG_RUNTIME_PASSWORD:?Set PAYMENT_ORCHESTRATION_PG_RUNTIME_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"

  payment-simulator-db-postgresql:
    environment:
      POSTGRES_PASSWORD: ${PAYMENT_SIMULATOR_PG_ADMIN_PASSWORD:?Set PAYMENT_SIMULATOR_PG_ADMIN_PASSWORD for the existing PostgreSQL deployment}

  payment-simulator-service:
    environment:
      PAYMENT_DATABASE_PASSWORD: ${PAYMENT_SIMULATOR_PG_RUNTIME_PASSWORD:?Set PAYMENT_SIMULATOR_PG_RUNTIME_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"

  warehouse-simulator-db-postgresql:
    environment:
      POSTGRES_PASSWORD: ${WAREHOUSE_PG_ADMIN_PASSWORD:?Set WAREHOUSE_PG_ADMIN_PASSWORD for the existing PostgreSQL deployment}

  warehouse-simulator-service:
    environment:
      WAREHOUSE_DATABASE_PASSWORD: ${WAREHOUSE_PG_RUNTIME_PASSWORD:?Set WAREHOUSE_PG_RUNTIME_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"

  logistics-simulator-db-postgresql:
    environment:
      POSTGRES_PASSWORD: ${LOGISTICS_PG_ADMIN_PASSWORD:?Set LOGISTICS_PG_ADMIN_PASSWORD for the existing PostgreSQL deployment}

  logistics-simulator-service:
    environment:
      LOGISTICS_DATABASE_PASSWORD: ${LOGISTICS_PG_RUNTIME_PASSWORD:?Set LOGISTICS_PG_RUNTIME_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"

  invoice-db-postgresql:
    environment:
      POSTGRES_PASSWORD: ${INVOICE_PG_ADMIN_PASSWORD:?Set INVOICE_PG_ADMIN_PASSWORD for the existing PostgreSQL deployment}

  invoice-simulator-service:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${INVOICE_PG_RUNTIME_PASSWORD:?Set INVOICE_PG_RUNTIME_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"
      INVOICE_REQUEST_SECRET: ${INVOICE_REQUEST_SECRET:?Set INVOICE_REQUEST_SECRET for the existing PostgreSQL deployment}
      INVOICE_CALLBACK_SECRET: ${INVOICE_CALLBACK_SECRET:?Set INVOICE_CALLBACK_SECRET for the existing PostgreSQL deployment}

  messaging-simulator-db-postgresql:
    environment:
      POSTGRES_PASSWORD: ${MESSAGING_PG_ADMIN_PASSWORD:?Set MESSAGING_PG_ADMIN_PASSWORD for the existing PostgreSQL deployment}

  messaging-simulator-service:
    environment:
      MESSAGING_DATABASE_PASSWORD: ${MESSAGING_PG_RUNTIME_PASSWORD:?Set MESSAGING_PG_RUNTIME_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"

  notification-db-postgresql:
    environment:
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRESQL_ADMIN_PASSWORD:?Set NOTIFICATION_POSTGRESQL_ADMIN_PASSWORD for the existing PostgreSQL deployment}
      NOTIFICATION_DATABASE_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD:?Set NOTIFICATION_DATABASE_PASSWORD for the existing PostgreSQL deployment}
      NOTIFICATION_POSTGRESQL_FLYWAY_ENABLED: "false"

  notification-service-postgresql:
    environment:
      DATABASE_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD:?Set NOTIFICATION_DATABASE_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"

  reference-data-db:
    environment:
      POSTGRES_PASSWORD: ${REFERENCE_DATA_DB_PASSWORD:?Set REFERENCE_DATA_DB_PASSWORD for the existing PostgreSQL deployment}

  reference-data-service:
    environment:
      DATABASE_PASSWORD: ${REFERENCE_DATA_DB_PASSWORD:?Set REFERENCE_DATA_DB_PASSWORD for the existing PostgreSQL deployment}
      SPRING_FLYWAY_ENABLED: "false"

volumes:
  catalog-postgresql-data:
    external: true
    name: fairy-commerceflow_catalog-postgresql-data
  commerce-postgresql-data:
    external: true
    name: fairy-commerceflow_commerce-postgresql-data
  fulfillment-postgresql-data:
    external: true
    name: fairy-commerceflow_fulfillment-postgresql-data
  inventory-postgresql-data:
    external: true
    name: fairy-commerceflow_inventory-postgresql-data
  invoice-postgresql-data:
    external: true
    name: fairy-commerceflow_invoice-postgresql-data
  logistics-postgresql-data:
    external: true
    name: fairy-commerceflow_logistics-postgresql-data
  messaging-postgresql-data:
    external: true
    name: fairy-commerceflow_messaging-postgresql-data
  notification-postgresql-data:
    external: true
    name: fairy-commerceflow_notification-postgresql-data
  order-postgresql-data:
    external: true
    name: fairy-commerceflow_order-postgresql-data
  payment-postgresql-data:
    external: true
    name: fairy-commerceflow_payment-postgresql-data
  payment-simulator-postgresql-data:
    external: true
    name: fairy-commerceflow_payment-simulator-postgresql-data
  reference-data-postgresql-data:
    external: true
    name: fairy-commerceflow_reference-data-postgresql-data
  warehouse-postgresql-data:
    external: true
    name: fairy-commerceflow_warehouse-postgresql-data
