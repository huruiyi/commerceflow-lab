<section class="border rounded p-2 h-100" [attr.aria-label]="title | t">
  <h5 class="h6">{{ title | t }}</h5>
  <ng-content></ng-content>
  <ng-container *ngIf="parcel as current">
    <p class="mb-1 mt-2 text-break" aria-live="polite">
      {{ current.carrier }} · {{ current.trackingNumber }} · {{ current.status | t }}
    </p>
    <ul *ngIf="current.events.length" class="list-unstyled mb-1">
      <li *ngFor="let event of current.events">
        <strong>{{ event.status | t }}</strong> · {{ event.occurredAt | trdate }} · {{ event.location }}
        <small class="d-block">{{ event.description }}</small>
      </li>
    </ul>
  </ng-container>
  <p *ngIf="parcel === null" class="mb-1 mt-2">{{ 'returnTrackingUnavailable' | t }}</p>
</section>
