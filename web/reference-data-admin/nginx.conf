server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 102m;

  location = /healthz {
    return 200 'OK';
  }

  location ~ ^/api/auth/(csrf|login|me|logout)$ {
    proxy_pass http://commerce-service:8080;
    proxy_set_header Host $http_host;
  }

  location /api/ {
    proxy_pass http://reference-data-service:8080;
    proxy_read_timeout 240s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
