spring:
  application:
    name: education-backend
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/education_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:education}
    password: ${DATABASE_PASSWORD:education-password}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  session:
    store-type: redis
    redis:
      namespace: education:session
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

security:
  remember-me:
    key: ${REMEMBER_ME_KEY:education-demo-remember-me-key-change-in-production}
    validity-seconds: ${REMEMBER_ME_VALIDITY_SECONDS:1209600}
