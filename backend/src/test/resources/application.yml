spring:
  datasource:
    url: jdbc:h2:mem:education;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  data:
    redis:
      repositories:
        enabled: false
  session:
    store-type: none

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

security:
  remember-me:
    key: education-test-remember-me-key
    validity-seconds: 1209600

education:
  outbox:
    initial-delay: 3600000
  reconciliation:
    initial-delay: 3600000
