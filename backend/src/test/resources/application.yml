spring:
  datasource:
    url: jdbc:h2:mem:education;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      repositories:
        enabled: false
  session:
    store-type: none

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

security:
  remember-me:
    key: education-test-remember-me-key
    validity-seconds: 1209600
