<nav class="navbar navbar-expand-lg bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" [routerLink]="['/dashboard']">{{'brand'|t}}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" [attr.aria-label]="'toggleNavigation'|t">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" role="button" [routerLink]="['/dashboard']" routerLinkActive="active" >{{'products'|t}}</a>
          </li>
          <li class="nav-item" *ngIf="bilgiler.role === 'CUSTOMER'">
            <a class="nav-link" aria-current="page" role="button" [routerLink]="['/cart']" routerLinkActive="active" >{{'cart'|t}}</a>
          </li>
          <li class="nav-item" *ngIf="bilgiler.role === 'CUSTOMER'">
            <a class="nav-link" role="button" [routerLink]="['/addresses']" routerLinkActive="active">{{'addresses'|t}}</a>
          </li>
          <li class="nav-item" *ngIf="bilgiler.role === 'CUSTOMER'">
            <a class="nav-link" role="button" [routerLink]="['/orders']" routerLinkActive="active">{{'orders'|t}}</a>
          </li>
          <li class="nav-item" *ngIf="bilgiler.role === 'ADMIN'">
            <a class="nav-link" aria-current="page" role="button" [routerLink]="['/users']" routerLinkActive="active" >{{'users'|t}}</a>
          </li>
          <li class="nav-item" *ngIf="bilgiler.role === 'MERCHANT'"><a class="nav-link" [routerLink]="['/merchant/orders']" routerLinkActive="active">{{'fulfillment'|t}}</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              {{'account'|t}}
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" (click)="logout()" role="button" routerLinkActive="router-link-active" >{{'logout'|t}}</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link disabled">{{ bilgiler.firstName + " " + bilgiler.lastName }}</a>
          </li>
        </ul>
        <div class="d-flex align-items-center">
          <button class="btn btn-outline-secondary me-2" type="button" (click)="i18n.switch()">{{'language'|t}}</button>
          <form *ngIf="isProductPage" class="d-flex" role="search" (ngSubmit)="search()">
            <input class="form-control me-2" type="search" name="productSearch" [(ngModel)]="searchText" [placeholder]="'searchProducts'|t" [attr.aria-label]="'searchProducts'|t">
            <button class="btn btn-outline-success" type="submit">{{'search'|t}}</button>
          </form>
        </div>
      </div>
    </div>
  </nav>
