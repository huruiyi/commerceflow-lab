<h2>{{ 'shippingAddresses'|t }}</h2>
<div *ngIf="message" class="alert alert-success">{{ message }}</div>
<form #addressForm="ngForm" (ngSubmit)="save()" class="row g-2 mb-4">
  <div class="col-md-4">
    <label class="form-label">{{ 'label'|t }}</label>
    <input class="form-control" name="label" [(ngModel)]="draft.label" required maxlength="40">
  </div>
  <div class="col-md-4">
    <label class="form-label">{{ 'recipient'|t }}</label>
    <input class="form-control" name="recipient" [(ngModel)]="draft.recipientName" required maxlength="100">
  </div>
  <div class="col-md-4">
    <label class="form-label">{{ 'phone'|t }}</label>
    <input class="form-control" name="phone" [(ngModel)]="draft.phone" required maxlength="40">
  </div>
  <div class="col-md-2">
    <label class="form-label">{{ 'countryCode'|t }}</label>
    <input class="form-control" name="country" [(ngModel)]="draft.countryCode" required pattern="[A-Za-z]{2}" maxlength="2">
  </div>
  <div class="col-md-3">
    <label class="form-label">{{ 'province'|t }}</label>
    <input class="form-control" name="state" [(ngModel)]="draft.stateProvince" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">{{ 'city'|t }}</label>
    <input class="form-control" name="city" [(ngModel)]="draft.city" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">{{ 'district'|t }}</label>
    <input class="form-control" name="district" [(ngModel)]="draft.district" required>
  </div>
  <div class="col-md-8">
    <label class="form-label">{{ 'addressLine'|t }}</label>
    <input class="form-control" name="line1" [(ngModel)]="draft.addressLine1" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">{{ 'postalCode'|t }}</label>
    <input class="form-control" name="postal" [(ngModel)]="draft.postalCode" required>
  </div>
  <div class="col-12">
    <label class="form-label">{{ 'addressLine2'|t }}</label>
    <input class="form-control" name="line2" [(ngModel)]="draft.addressLine2">
  </div>
  <div class="col-12 form-check ms-2">
    <input class="form-check-input" type="checkbox" name="default" [(ngModel)]="draft.isDefault" id="defaultAddress">
    <label class="form-check-label" for="defaultAddress">{{ 'defaultAddress'|t }}</label>
  </div>
  <div class="col-12">
    <button class="btn btn-primary" [disabled]="addressForm.invalid">{{ (editingId ? 'update' : 'addAddress')|t }}</button>
    <button *ngIf="editingId" type="button" class="btn btn-secondary" (click)="cancel()">{{ 'cancel'|t }}</button>
  </div>
</form>
<div class="row g-3">
  <div class="col-md-6" *ngFor="let a of addresses">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="d-flex align-items-center flex-wrap gap-2">
          <span>{{ a.label }}</span>
          <span *ngIf="a.isDefault" class="badge bg-primary">{{ 'default'|t }}</span>
          <span *ngIf="selectedAddressId===a.id" class="badge bg-success">{{ 'selected'|t }}</span>
        </h5>
        <p>{{ a.recipientName }} · {{ a.phone }}
          <br>
          {{ a.addressLine1 }} {{ a.addressLine2 }}
          <br>
          {{ a.district }}, {{ a.city }}, {{ a.stateProvince }}, {{ a.countryCode }} {{ a.postalCode }}
        </p>
        <button class="btn btn-sm btn-outline-primary me-1" (click)="edit(a)">{{ 'edit'|t }}</button>
        <button class="btn btn-sm btn-outline-secondary me-1" (click)="makeDefault(a.id)" [disabled]="a.isDefault">{{ 'setDefault'|t }}</button>
        <button class="btn btn-sm btn-outline-success me-1" (click)="select(a.id)">{{ 'useForCheckout'|t }}</button>
        <button class="btn btn-sm btn-outline-danger" (click)="remove(a.id)">{{ 'delete'|t }}</button>
      </div>
    </div>
  </div>
</div>
<div *ngIf="addresses.length===0" class="alert alert-info">{{ 'noAddresses'|t }}</div>
