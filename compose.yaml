name: fairy-commerceflow

x-business-postgresql: &business-postgresql
  image: postgres:17.11-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 30


services:
  messaging-simulator-service:
    container_name: fairy-commerceflow-messaging-simulator-service
    build:
      context: ./simulators/messaging-platform/service
    environment:
      MESSAGING_DATABASE_URL: jdbc:postgresql://messaging-simulator-db-postgresql:5432/messaging_platform?currentSchema=messaging_platform
      MESSAGING_DATABASE_USERNAME: messaging_runtime
      MESSAGING_DATABASE_PASSWORD: ${MESSAGING_PG_RUNTIME_PASSWORD:-local-messaging-pg-runtime-password}
      MESSAGING_ADMIN_TOKEN: ${MESSAGING_ADMIN_TOKEN:-demo-messaging-admin-token}
      MESSAGING_SENDER_SECRET: ${MESSAGING_SENDER_SECRET:-demo-messaging-sender-secret}
      MESSAGING_FAULTS_ENABLED: "${MESSAGING_FAULTS_ENABLED:-false}"
      SPRING_PROFILES_ACTIVE: postgresql
      SPRING_FLYWAY_ENABLED: "false"
    depends_on:
      messaging-simulator-db-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  messaging-simulator-web:
    container_name: fairy-commerceflow-messaging-simulator-web
    build:
      context: ./simulators/messaging-platform/web
      additional_contexts:
        simulator-admin: ./web/packages/simulator-admin
    ports:
      - "127.0.0.1:18119:80"
    depends_on:
      messaging-simulator-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  warehouse-simulator-service:
    container_name: fairy-commerceflow-warehouse-simulator-service
    build:
      context: ./simulators/warehouse-platform/service
    environment:
      WAREHOUSE_DATABASE_URL: jdbc:postgresql://warehouse-simulator-db-postgresql:5432/warehouse_platform?currentSchema=warehouse_platform
      WAREHOUSE_DATABASE_USERNAME: warehouse_runtime
      WAREHOUSE_DATABASE_PASSWORD: ${WAREHOUSE_PG_RUNTIME_PASSWORD:-local-warehouse-pg-runtime-password}
      WAREHOUSE_RETURN_SECRET: ${WAREHOUSE_RETURN_SECRET:-demo-warehouse-return-secret}
      WAREHOUSE_ADMIN_TOKEN: ${WAREHOUSE_ADMIN_TOKEN:-demo-warehouse-admin-token}
      FULFILLMENT_WAREHOUSE_SECRET: ${FULFILLMENT_WAREHOUSE_SECRET:-demo-fulfillment-warehouse-secret}
      SPRING_PROFILES_ACTIVE: postgresql
      SPRING_FLYWAY_ENABLED: "false"
    depends_on:
      warehouse-simulator-db-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  warehouse-simulator-web:
    container_name: fairy-commerceflow-warehouse-simulator-web
    build:
      context: ./simulators/warehouse-platform/web
      additional_contexts:
        simulator-admin: ./web/packages/simulator-admin
    ports:
      - "127.0.0.1:18118:80"
    depends_on:
      warehouse-simulator-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  fulfillment-service:
    container_name: fairy-commerceflow-fulfillment-service
    build:
      context: ./services/fulfillment-service
    environment:
      FULFILLMENT_RUNTIME_MODE: EXECUTION
      FULFILLMENT_REQUIRE_PROMOTED_MODE: "true"
      FULFILLMENT_DATABASE_URL: jdbc:postgresql://fulfillment-db-postgresql:5432/fulfillment
      FULFILLMENT_DATABASE_USERNAME: fulfillment_runtime
      FULFILLMENT_DATABASE_PASSWORD: ${FULFILLMENT_PG_RUNTIME_PASSWORD:-local-fulfillment-pg-runtime-password}
      FULFILLMENT_INTERNAL_SECRET: ${FULFILLMENT_INTERNAL_SECRET:-demo-fulfillment-internal-secret}
      FULFILLMENT_RECOVERY_ENABLED: "true"
      FULFILLMENT_ADMIN_SECRET: ${FULFILLMENT_ADMIN_SECRET:-demo-fulfillment-admin-secret}
      FULFILLMENT_ORDER_ENDPOINT: http://order-service:8080
      FULFILLMENT_ORDER_SECRET: ${FULFILLMENT_ORDER_SECRET:-demo-fulfillment-order-secret}
      FULFILLMENT_LOGISTICS_ENDPOINT: http://commerce-service:8080
      FULFILLMENT_LOGISTICS_SECRET: ${FULFILLMENT_LOGISTICS_SECRET:-demo-fulfillment-logistics-secret}
      FULFILLMENT_WAREHOUSE_ENDPOINT: http://warehouse-simulator-service:8080
      FULFILLMENT_WAREHOUSE_SECRET: ${FULFILLMENT_WAREHOUSE_SECRET:-demo-fulfillment-warehouse-secret}
      FULFILLMENT_INVENTORY_ENDPOINT: http://inventory-service:8080
      FULFILLMENT_INVENTORY_SECRET: ${FULFILLMENT_INVENTORY_SECRET:-demo-fulfillment-inventory-secret}
      SPRING_PROFILES_ACTIVE: postgresql
      SPRING_FLYWAY_ENABLED: "false"
    ports:
      - "127.0.0.1:18091:8080"
    depends_on:
      warehouse-simulator-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      fulfillment-db-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  commerce-redis:
    container_name: fairy-commerceflow-commerce-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - commerce-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka-broker:
    container_name: fairy-commerceflow-kafka-broker
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-broker-persistent-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  kafka-console:
    container_name: fairy-commerceflow-kafka-console
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: commerceflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
    ports:
      - "14202:8080"
    depends_on:
      kafka-broker:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq-broker:
    container_name: fairy-commerceflow-rabbitmq-broker
    image: rabbitmq:4.1-management
    profiles: [rabbitmq]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-commerceflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-commerceflow-password}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-broker-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  rocketmq-storage-init:
    container_name: fairy-commerceflow-rocketmq-storage-init
    image: apache/rocketmq:5.4.0
    profiles: [rocketmq]
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /home/rocketmq/logs/namesrv/rocketmqlogs
        /home/rocketmq/logs/broker/rocketmqlogs /home/rocketmq/store &&
        chown -R 3000:3000 /home/rocketmq/logs /home/rocketmq/store
    volumes:
      - rocketmq-nameserver-logs:/home/rocketmq/logs/namesrv
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs/broker
    restart: "no"

  rocketmq-nameserver:
    container_name: fairy-commerceflow-rocketmq-nameserver
    image: apache/rocketmq:5.4.0
    profiles: [rocketmq]
    command: sh mqnamesrv
    volumes:
      - rocketmq-nameserver-logs:/home/rocketmq/logs
    depends_on:
      rocketmq-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep NamesrvStartup >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  rocketmq-broker:
    container_name: fairy-commerceflow-rocketmq-broker
    image: apache/rocketmq:5.4.0
    profiles: [rocketmq]
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
    command: sh mqbroker -n rocketmq-nameserver:9876 --enable-proxy
    ports:
      - "18084:8081"
    volumes:
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    depends_on:
      rocketmq-nameserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-nameserver:9876 2>/dev/null | grep DefaultCluster >/dev/null"]
      interval: 5s
      timeout: 8s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  rocketmq-topic-init:
    container_name: fairy-commerceflow-rocketmq-topic-init
    image: apache/rocketmq:5.4.0
    profiles: [rocketmq]
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
      ROCKETMQ_TOPIC: ${SCHEDULING_ROCKETMQ_TOPIC:-commerceflow-scheduled-task}
      ROCKETMQ_CONSUMER_GROUP: ${SCHEDULING_ROCKETMQ_CONSUMER_GROUP:-commerceflow-scheduled-task-consumer}
      ROCKETMQ_CONSUMER_RETRY_MAX_TIMES: ${ROCKETMQ_CONSUMER_RETRY_MAX_TIMES:-2}
    command:
      - sh
      - -c
      - >-
        sh mqadmin updateTopic -n rocketmq-nameserver:9876 -c DefaultCluster
        -t $${ROCKETMQ_TOPIC:-commerceflow-scheduled-task} -a +message.type=DELAY
        && sh mqadmin updateSubGroup -n rocketmq-nameserver:9876 -c DefaultCluster
        -g $${ROCKETMQ_CONSUMER_GROUP:-commerceflow-scheduled-task-consumer}
        -r $${ROCKETMQ_CONSUMER_RETRY_MAX_TIMES:-2}
        -p '{"type":"CUSTOMIZED","customizedRetryPolicy":{"next":[1000,2000]}}'
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    restart: "no"

  prometheus:
    container_name: fairy-commerceflow-prometheus
    image: prom/prometheus:v3.7.3
    profiles: [observability]
    ports: ["19090:9090"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/rules:/etc/prometheus/rules:ro
      - ./infrastructure/monitoring/tests:/etc/prometheus/tests:ro
    depends_on:
      commerce-service: {condition: service_healthy}
      payment-simulator-service: {condition: service_healthy}
      logistics-simulator-service: {condition: service_healthy}
      alertmanager: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tempo:
    container_name: fairy-commerceflow-tempo
    image: grafana/tempo:3.1.1
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "13200:3200"
      - "14318:4318"
    volumes:
      - ./infrastructure/monitoring/tempo.yml:/etc/tempo.yml:ro
    tmpfs:
      - /tmp
    restart: unless-stopped

  alertmanager:
    container_name: fairy-commerceflow-alertmanager
    image: prom/alertmanager:v0.29.0
    profiles: [observability]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    ports: ["19093:9093"]
    volumes:
      - ./infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    tmpfs: [/alertmanager]
    depends_on:
      alert-webhook: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  alert-webhook:
    container_name: fairy-commerceflow-alert-webhook
    image: python:3.14.0-alpine3.22
    profiles: [observability]
    command: ["python", "/app/receiver.py"]
    environment:
      ALERT_WEBHOOK_MAX_EVENTS: ${ALERT_WEBHOOK_MAX_EVENTS:-100}
    ports: ["18085:8080"]
    volumes:
      - ./infrastructure/monitoring/alert-webhook/receiver.py:/app/receiver.py:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  grafana:
    container_name: fairy-commerceflow-grafana
    image: grafana/grafana:12.2.1
    profiles: [observability]
    ports: ["13000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: commerceflow-grafana
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus: {condition: service_healthy}
      tempo: {condition: service_started}
    restart: unless-stopped

  payment-simulator-redis:
    container_name: fairy-commerceflow-payment-simulator-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - payment-simulator-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  payment-simulator-service:
    container_name: fairy-commerceflow-payment-simulator-service
    build:
      context: ./simulators/payment-platform/service
    environment:
      PAYMENT_DATABASE_URL: jdbc:postgresql://payment-simulator-db-postgresql:5432/payment_platform
      PAYMENT_DATABASE_USERNAME: payment_simulator_runtime
      PAYMENT_DATABASE_PASSWORD: ${PAYMENT_SIMULATOR_PG_RUNTIME_PASSWORD:-local-payment-simulator-pg-runtime-password}
      PAYMENT_CREDENTIAL_MASTER_KEY: ${PAYMENT_CREDENTIAL_MASTER_KEY:-bG9jYWwtZGVtby1rZXktMTIzNDU2Nzg5MC1hYmNkZWY=}
      PAYMENT_CHECKOUT_BASE_URL: http://localhost:14201
      REDIS_HOST: payment-simulator-redis
      REDIS_PORT: 6379
      PAYMENT_CALLBACK_URL: http://payment-orchestration-service:8080/api/payment-notifications/callback
      REFUND_CALLBACK_URL: http://payment-orchestration-service:8080/api/refund-notifications/callback
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-demo-platform-callback-secret}
      PAYOUT_CALLBACK_SECRET: ${PAYOUT_CALLBACK_SECRET:-demo-payout-callback-secret}
      PAYOUT_PLATFORM_APP_SECRET: ${PAYOUT_PLATFORM_APP_SECRET:-demo-merchant-payout-secret}
      PAYOUT_CALLBACK_URL: http://commerce-service:8080/api/payout-notifications
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_PROFILES_ACTIVE: postgresql
      SPRING_FLYWAY_ENABLED: "false"
    ports:
      - "18082:8080"
    depends_on:
      payment-simulator-redis:
        condition: service_healthy
      payment-simulator-db-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  payment-simulator-web:
    container_name: fairy-commerceflow-payment-simulator-web
    build:
      context: ./simulators/payment-platform/web
      additional_contexts:
        simulator-admin: ./web/packages/simulator-admin
    ports:
      - "14201:80"
    depends_on:
      payment-simulator-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  logistics-simulator-service:
    container_name: fairy-commerceflow-logistics-simulator-service
    build:
      context: ./simulators/logistics-platform/service
    environment:
      LOGISTICS_DATABASE_URL: jdbc:postgresql://logistics-simulator-db-postgresql:5432/logistics_platform?currentSchema=logistics_platform
      LOGISTICS_DATABASE_USERNAME: logistics_runtime
      LOGISTICS_DATABASE_PASSWORD: ${LOGISTICS_PG_RUNTIME_PASSWORD:-local-logistics-pg-runtime-password}
      LOGISTICS_ADMIN_TOKEN: ${LOGISTICS_ADMIN_TOKEN-demo-logistics-admin-token}
      LOGISTICS_APP_ID: ${LOGISTICS_APP_ID:-commerceflow-storefront}
      LOGISTICS_REQUEST_SECRET: ${LOGISTICS_REQUEST_SECRET:-demo-logistics-request-secret}
      LOGISTICS_CALLBACK_SECRET: ${LOGISTICS_CALLBACK_SECRET:-demo-logistics-callback-secret}
      LOGISTICS_CALLBACK_URL: http://commerce-service:8080/api/logistics-notifications/callback
      LOGISTICS_CALLBACK_DELIVERY_ENABLED: ${LOGISTICS_CALLBACK_DELIVERY_ENABLED:-true}
      LOGISTICS_CALLBACK_DELIVERY_INITIAL_DELAY: ${LOGISTICS_CALLBACK_DELIVERY_INITIAL_DELAY:-2s}
      LOGISTICS_CALLBACK_DELIVERY_SCAN_INTERVAL: ${LOGISTICS_CALLBACK_DELIVERY_SCAN_INTERVAL:-1s}
      LOGISTICS_CALLBACK_DELIVERY_RETRY_DELAY: ${LOGISTICS_CALLBACK_DELIVERY_RETRY_DELAY:-2s}
      LOGISTICS_CALLBACK_DELIVERY_CLAIM_LEASE: ${LOGISTICS_CALLBACK_DELIVERY_CLAIM_LEASE:-30s}
      LOGISTICS_CALLBACK_DELIVERY_CONNECT_TIMEOUT: ${LOGISTICS_CALLBACK_DELIVERY_CONNECT_TIMEOUT:-2s}
      LOGISTICS_CALLBACK_DELIVERY_READ_TIMEOUT: ${LOGISTICS_CALLBACK_DELIVERY_READ_TIMEOUT:-3s}
      LOGISTICS_CALLBACK_DELIVERY_BATCH_SIZE: ${LOGISTICS_CALLBACK_DELIVERY_BATCH_SIZE:-50}
      LOGISTICS_CALLBACK_DELIVERY_MAX_ATTEMPTS: ${LOGISTICS_CALLBACK_DELIVERY_MAX_ATTEMPTS:-10}
      LOGISTICS_AUTO_PROGRESS_ENABLED: ${LOGISTICS_AUTO_PROGRESS_ENABLED:-false}
      LOGISTICS_AUTO_PROGRESS_INITIAL_DELAY: ${LOGISTICS_AUTO_PROGRESS_INITIAL_DELAY:-10s}
      LOGISTICS_AUTO_PROGRESS_SCAN_INTERVAL: ${LOGISTICS_AUTO_PROGRESS_SCAN_INTERVAL:-5s}
      LOGISTICS_AUTO_PROGRESS_STEP_INTERVAL: ${LOGISTICS_AUTO_PROGRESS_STEP_INTERVAL:-5m}
      LOGISTICS_AUTO_PROGRESS_BATCH_SIZE: ${LOGISTICS_AUTO_PROGRESS_BATCH_SIZE:-100}
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_PROFILES_ACTIVE: postgresql
      SPRING_FLYWAY_ENABLED: "false"
    ports:
      - "18083:8080"
    depends_on:
      logistics-simulator-db-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  logistics-simulator-web:
    container_name: fairy-commerceflow-logistics-simulator-web
    build:
      context: ./simulators/logistics-platform/web
      additional_contexts:
        simulator-admin: ./web/packages/simulator-admin
    ports:
      - "127.0.0.1:18117:80"
    depends_on:
      logistics-simulator-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  commerce-service:
    container_name: fairy-commerceflow-commerce-service
    build:
      context: ./services/commerce-service
    volumes:
      - notification-maintenance:/gate:ro
    environment:
      COMMERCEFLOW_OFFSITE_DISPATCH_PAUSE_FILE: /gate/offsite.paused
      FULFILLMENT_SERVICE_BASE_URL: http://fulfillment-service:8080
      FULFILLMENT_INTERNAL_SECRET: ${FULFILLMENT_INTERNAL_SECRET:-demo-fulfillment-internal-secret}
      FULFILLMENT_ADMIN_SECRET: ${FULFILLMENT_ADMIN_SECRET:-demo-fulfillment-admin-secret}
      FULFILLMENT_LOGISTICS_BRIDGE_ENABLED: "true"
      FULFILLMENT_LOGISTICS_SECRET: ${FULFILLMENT_LOGISTICS_SECRET:-demo-fulfillment-logistics-secret}
      DATABASE_URL: jdbc:postgresql://commerce-db-postgresql:5432/commerceflow?currentSchema=commerceflow
      DATABASE_USERNAME: commerce_runtime
      DATABASE_PASSWORD: ${COMMERCE_POSTGRES_RUNTIME_PASSWORD:-local-commerce-postgres-runtime-password}
      SPRING_FLYWAY_ENABLED: "false"
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:-commerceflow-demo-remember-me-key-change-in-production}
      REDIS_HOST: commerce-redis
      REDIS_PORT: 6379
      PAYMENT_WRITE_FROZEN: ${PAYMENT_WRITE_FROZEN:-false}
