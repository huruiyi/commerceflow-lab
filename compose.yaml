name: fairy-commerceflow
services:
  commerce-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: commerceflow
      MYSQL_USER: ${DATABASE_USERNAME:-commerceflow}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-commerceflow-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - commerce-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  commerce-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - commerce-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka-broker:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-broker-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  kafka-console:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: commerceflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
    ports:
      - "14202:8080"
    depends_on:
      kafka-broker:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq-broker:
    image: rabbitmq:4.1-management
    profiles: [rabbitmq]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-commerceflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-commerceflow-password}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-broker-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  rocketmq-storage-init:
    image: apache/rocketmq:5.4.0
    profiles: [rocketmq]
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /home/rocketmq/logs/namesrv/rocketmqlogs
        /home/rocketmq/logs/broker/rocketmqlogs /home/rocketmq/store &&
        chown -R 3000:3000 /home/rocketmq/logs /home/rocketmq/store
    volumes:
      - rocketmq-nameserver-logs:/home/rocketmq/logs/namesrv
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs/broker
    restart: "no"

  rocketmq-nameserver:
    image: apache/rocketmq:5.4.0
    profiles: [rocketmq]
    command: sh mqnamesrv
    volumes:
      - rocketmq-nameserver-logs:/home/rocketmq/logs
    depends_on:
      rocketmq-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep NamesrvStartup >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.4.0
    profiles: [rocketmq]
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
    command: sh mqbroker -n rocketmq-nameserver:9876 --enable-proxy
    ports:
      - "18084:8081"
    volumes:
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    depends_on:
      rocketmq-nameserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-nameserver:9876 2>/dev/null | grep DefaultCluster >/dev/null"]
      interval: 5s
      timeout: 8s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  rocketmq-topic-init:
    image: apache/rocketmq:5.4.0
    profiles: [rocketmq]
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
      ROCKETMQ_TOPIC: ${SCHEDULING_ROCKETMQ_TOPIC:-commerceflow-scheduled-task}
      ROCKETMQ_CONSUMER_GROUP: ${SCHEDULING_ROCKETMQ_CONSUMER_GROUP:-commerceflow-scheduled-task-consumer}
      ROCKETMQ_CONSUMER_RETRY_MAX_TIMES: ${ROCKETMQ_CONSUMER_RETRY_MAX_TIMES:-2}
    command:
      - sh
      - -c
      - >-
        sh mqadmin updateTopic -n rocketmq-nameserver:9876 -c DefaultCluster
        -t $${ROCKETMQ_TOPIC:-commerceflow-scheduled-task} -a +message.type=DELAY
        && sh mqadmin updateSubGroup -n rocketmq-nameserver:9876 -c DefaultCluster
        -g $${ROCKETMQ_CONSUMER_GROUP:-commerceflow-scheduled-task-consumer}
        -r $${ROCKETMQ_CONSUMER_RETRY_MAX_TIMES:-2}
        -p '{"type":"CUSTOMIZED","customizedRetryPolicy":{"next":[1000,2000]}}'
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [observability]
    ports: ["19090:9090"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/rules:/etc/prometheus/rules:ro
      - ./infrastructure/monitoring/tests:/etc/prometheus/tests:ro
    depends_on:
      commerce-service: {condition: service_healthy}
      payment-simulator-service: {condition: service_healthy}
      logistics-simulator-service: {condition: service_healthy}
      alertmanager: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.29.0
    profiles: [observability]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    ports: ["19093:9093"]
    volumes:
      - ./infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    tmpfs: [/alertmanager]
    depends_on:
      alert-webhook: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  alert-webhook:
    image: python:3.14.0-alpine3.22
    profiles: [observability]
    command: ["python", "/app/receiver.py"]
    environment:
      ALERT_WEBHOOK_MAX_EVENTS: ${ALERT_WEBHOOK_MAX_EVENTS:-100}
    ports: ["18085:8080"]
    volumes:
      - ./infrastructure/monitoring/alert-webhook/receiver.py:/app/receiver.py:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.1
    profiles: [observability]
    ports: ["13000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: commerceflow-grafana
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus: {condition: service_healthy}
    restart: unless-stopped

  payment-simulator-db:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: payment_platform
      MYSQL_USER: ${PAYMENT_DATABASE_USERNAME:-payment}
      MYSQL_PASSWORD: ${PAYMENT_DATABASE_PASSWORD:-payment-password}
      MYSQL_ROOT_PASSWORD: ${PAYMENT_MYSQL_ROOT_PASSWORD:-local-payment-root-password}
    ports:
      - "13307:3306"
    volumes:
      - payment-simulator-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  payment-simulator-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - payment-simulator-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  payment-simulator-service:
    build:
      context: ./simulators/payment-platform/service
    environment:
      PAYMENT_DATABASE_URL: jdbc:mysql://payment-simulator-db:3306/payment_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PAYMENT_DATABASE_USERNAME: ${PAYMENT_DATABASE_USERNAME:-payment}
      PAYMENT_DATABASE_PASSWORD: ${PAYMENT_DATABASE_PASSWORD:-payment-password}
      PAYMENT_CREDENTIAL_MASTER_KEY: ${PAYMENT_CREDENTIAL_MASTER_KEY:-bG9jYWwtZGVtby1rZXktMTIzNDU2Nzg5MC1hYmNkZWY=}
      PAYMENT_CHECKOUT_BASE_URL: http://localhost:14201
      REDIS_HOST: payment-simulator-redis
      REDIS_PORT: 6379
      PAYMENT_CALLBACK_URL: http://commerce-service:8080/api/payment-notifications/callback
      REFUND_CALLBACK_URL: http://commerce-service:8080/api/refund-notifications/callback
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-demo-platform-callback-secret}
    ports:
      - "18082:8080"
    depends_on:
      payment-simulator-db:
        condition: service_healthy
      payment-simulator-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  payment-simulator-web:
    build:
      context: ./simulators/payment-platform/web
    ports:
      - "14201:80"
    depends_on:
      payment-simulator-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  logistics-simulator-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: logistics_platform
      MYSQL_USER: ${LOGISTICS_DATABASE_USERNAME:-logistics}
      MYSQL_PASSWORD: ${LOGISTICS_DATABASE_PASSWORD:-logistics-password}
      MYSQL_ROOT_PASSWORD: ${LOGISTICS_MYSQL_ROOT_PASSWORD:-local-logistics-root-password}
    ports:
      - "13308:3306"
    volumes:
      - logistics-simulator-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  logistics-simulator-service:
    build:
      context: ./simulators/logistics-platform/service
    environment:
      LOGISTICS_DATABASE_URL: jdbc:mysql://logistics-simulator-db:3306/logistics_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      LOGISTICS_DATABASE_USERNAME: ${LOGISTICS_DATABASE_USERNAME:-logistics}
      LOGISTICS_DATABASE_PASSWORD: ${LOGISTICS_DATABASE_PASSWORD:-logistics-password}
      LOGISTICS_APP_ID: ${LOGISTICS_APP_ID:-commerceflow-storefront}
      LOGISTICS_REQUEST_SECRET: ${LOGISTICS_REQUEST_SECRET:-demo-logistics-request-secret}
      LOGISTICS_CALLBACK_SECRET: ${LOGISTICS_CALLBACK_SECRET:-demo-logistics-callback-secret}
      LOGISTICS_CALLBACK_URL: http://commerce-service:8080/api/logistics-notifications/callback
      LOGISTICS_CALLBACK_DELIVERY_ENABLED: ${LOGISTICS_CALLBACK_DELIVERY_ENABLED:-true}
      LOGISTICS_CALLBACK_DELIVERY_INITIAL_DELAY: ${LOGISTICS_CALLBACK_DELIVERY_INITIAL_DELAY:-2s}
      LOGISTICS_CALLBACK_DELIVERY_SCAN_INTERVAL: ${LOGISTICS_CALLBACK_DELIVERY_SCAN_INTERVAL:-1s}
      LOGISTICS_CALLBACK_DELIVERY_RETRY_DELAY: ${LOGISTICS_CALLBACK_DELIVERY_RETRY_DELAY:-2s}
      LOGISTICS_CALLBACK_DELIVERY_CLAIM_LEASE: ${LOGISTICS_CALLBACK_DELIVERY_CLAIM_LEASE:-30s}
      LOGISTICS_CALLBACK_DELIVERY_CONNECT_TIMEOUT: ${LOGISTICS_CALLBACK_DELIVERY_CONNECT_TIMEOUT:-2s}
      LOGISTICS_CALLBACK_DELIVERY_READ_TIMEOUT: ${LOGISTICS_CALLBACK_DELIVERY_READ_TIMEOUT:-3s}
      LOGISTICS_CALLBACK_DELIVERY_BATCH_SIZE: ${LOGISTICS_CALLBACK_DELIVERY_BATCH_SIZE:-50}
      LOGISTICS_CALLBACK_DELIVERY_MAX_ATTEMPTS: ${LOGISTICS_CALLBACK_DELIVERY_MAX_ATTEMPTS:-10}
      LOGISTICS_AUTO_PROGRESS_ENABLED: ${LOGISTICS_AUTO_PROGRESS_ENABLED:-false}
      LOGISTICS_AUTO_PROGRESS_INITIAL_DELAY: ${LOGISTICS_AUTO_PROGRESS_INITIAL_DELAY:-10s}
      LOGISTICS_AUTO_PROGRESS_SCAN_INTERVAL: ${LOGISTICS_AUTO_PROGRESS_SCAN_INTERVAL:-5s}
      LOGISTICS_AUTO_PROGRESS_STEP_INTERVAL: ${LOGISTICS_AUTO_PROGRESS_STEP_INTERVAL:-5m}
      LOGISTICS_AUTO_PROGRESS_BATCH_SIZE: ${LOGISTICS_AUTO_PROGRESS_BATCH_SIZE:-100}
    ports:
      - "18083:8080"
    depends_on:
      logistics-simulator-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  commerce-service:
    build:
      context: ./services/commerce-service
    environment:
      DATABASE_URL: jdbc:mysql://commerce-db:3306/commerceflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sessionVariables=innodb_lock_wait_timeout=${DATABASE_LOCK_WAIT_TIMEOUT_SECONDS:-5}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-commerceflow}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-commerceflow-password}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:-commerceflow-demo-remember-me-key-change-in-production}
      REDIS_HOST: commerce-redis
      REDIS_PORT: 6379
      PAYMENT_PLATFORM_BASE_URL: http://payment-simulator-service:8080
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-demo-platform-callback-secret}
      PAYMENT_CANCELLATION_CRASH_LAB_ENABLED: ${PAYMENT_CANCELLATION_CRASH_LAB_ENABLED:-false}
      PAYMENT_CANCELLATION_CRASH_LAB_ORDER_ID: ${PAYMENT_CANCELLATION_CRASH_LAB_ORDER_ID:-1}
      PAYMENT_CANCELLATION_CRASH_LAB_PHASE: ${PAYMENT_CANCELLATION_CRASH_LAB_PHASE:-AFTER_CANCELLATION_BEGIN}
      PAYMENT_CANCELLATION_CRASH_LAB_PAUSE: ${PAYMENT_CANCELLATION_CRASH_LAB_PAUSE:-5m}
      LOGISTICS_PLATFORM_BASE_URL: http://logistics-simulator-service:8080
      LOGISTICS_APP_ID: ${LOGISTICS_APP_ID:-commerceflow-storefront}
      LOGISTICS_REQUEST_SECRET: ${LOGISTICS_REQUEST_SECRET:-demo-logistics-request-secret}
      LOGISTICS_CALLBACK_SECRET: ${LOGISTICS_CALLBACK_SECRET:-demo-logistics-callback-secret}
      LOGISTICS_CALLBACK_URL: http://commerce-service:8080/api/logistics-notifications/callback
      LOGISTICS_RECONCILIATION_ENABLED: ${LOGISTICS_RECONCILIATION_ENABLED:-true}
      LOGISTICS_RECONCILIATION_INITIAL_DELAY: ${LOGISTICS_RECONCILIATION_INITIAL_DELAY:-30s}
      LOGISTICS_RECONCILIATION_SCAN_INTERVAL: ${LOGISTICS_RECONCILIATION_SCAN_INTERVAL:-1m}
      LOGISTICS_RECONCILIATION_STALE_AFTER: ${LOGISTICS_RECONCILIATION_STALE_AFTER:-5m}
      LOGISTICS_RECONCILIATION_BATCH_SIZE: ${LOGISTICS_RECONCILIATION_BATCH_SIZE:-100}
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      KAFKA_PRODUCER_MAX_BLOCK_MS: ${KAFKA_PRODUCER_MAX_BLOCK_MS:-5000}
      KAFKA_PRODUCER_REQUEST_TIMEOUT_MS: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:-3000}
      KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:-5000}
      NOTIFICATION_DELIVERY_MODE: ${NOTIFICATION_DELIVERY_MODE:-IN_PROCESS}
      NOTIFICATION_DELIVERY_TOPIC: ${NOTIFICATION_DELIVERY_TOPIC:-customer-notification-commands}
      NOTIFICATION_DELIVERY_MAX_ATTEMPTS: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:-5}
      NOTIFICATION_DELIVERY_RETRY_DELAY: ${NOTIFICATION_DELIVERY_RETRY_DELAY:-5s}
      NOTIFICATION_FALLBACK_TO_IN_PROCESS: ${NOTIFICATION_FALLBACK_TO_IN_PROCESS:-false}
      NOTIFICATION_PUBLISH_INITIAL_DELAY: ${NOTIFICATION_PUBLISH_INITIAL_DELAY:-2s}
      NOTIFICATION_PUBLISH_DELAY: ${NOTIFICATION_PUBLISH_DELAY:-1s}
      SCHEDULING_POOL_SIZE: ${SCHEDULING_POOL_SIZE:-4}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq-broker}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-commerceflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-commerceflow-password}
      RABBITMQ_CONNECTION_TIMEOUT: ${RABBITMQ_CONNECTION_TIMEOUT:-3s}
      RABBITMQ_REQUESTED_HEARTBEAT: ${RABBITMQ_REQUESTED_HEARTBEAT:-30s}
      SCHEDULING_RABBITMQ_ENABLED: ${SCHEDULING_RABBITMQ_ENABLED:-false}
      SCHEDULING_RABBITMQ_PUBLISH_INITIAL_DELAY: ${SCHEDULING_RABBITMQ_PUBLISH_INITIAL_DELAY:-2s}
      SCHEDULING_RABBITMQ_PUBLISH_FIXED_DELAY: ${SCHEDULING_RABBITMQ_PUBLISH_FIXED_DELAY:-1s}
      SCHEDULING_RABBITMQ_PUBLISH_BATCH_SIZE: ${SCHEDULING_RABBITMQ_PUBLISH_BATCH_SIZE:-100}
      SCHEDULING_RABBITMQ_CONFIRM_TIMEOUT: ${SCHEDULING_RABBITMQ_CONFIRM_TIMEOUT:-5s}
      SCHEDULING_RABBITMQ_DELAY_EXCHANGE: ${SCHEDULING_RABBITMQ_DELAY_EXCHANGE:-commerceflow.scheduled-task.delay}
      SCHEDULING_RABBITMQ_READY_EXCHANGE: ${SCHEDULING_RABBITMQ_READY_EXCHANGE:-commerceflow.scheduled-task.ready}
      SCHEDULING_RABBITMQ_DEAD_EXCHANGE: ${SCHEDULING_RABBITMQ_DEAD_EXCHANGE:-commerceflow.scheduled-task.dead}
      SCHEDULING_RABBITMQ_READY_QUEUE: ${SCHEDULING_RABBITMQ_READY_QUEUE:-commerceflow.scheduled-task.ready}
      SCHEDULING_RABBITMQ_DEAD_QUEUE: ${SCHEDULING_RABBITMQ_DEAD_QUEUE:-commerceflow.scheduled-task.dead}
      SCHEDULING_RABBITMQ_READY_ROUTING_KEY: ${SCHEDULING_RABBITMQ_READY_ROUTING_KEY:-scheduled-task.ready}
      SCHEDULING_RABBITMQ_DEAD_ROUTING_KEY: ${SCHEDULING_RABBITMQ_DEAD_ROUTING_KEY:-scheduled-task.dead}
      SCHEDULING_RABBITMQ_DELAY_BUCKETS: ${SCHEDULING_RABBITMQ_DELAY_BUCKETS:-1s,5s,30s,5m,30m,2h,1d}
      SCHEDULING_ROCKETMQ_ENABLED: ${SCHEDULING_ROCKETMQ_ENABLED:-false}
      SCHEDULING_ROCKETMQ_ENDPOINTS: ${SCHEDULING_ROCKETMQ_ENDPOINTS:-rocketmq-broker:8081}
      SCHEDULING_ROCKETMQ_TOPIC: ${SCHEDULING_ROCKETMQ_TOPIC:-commerceflow-scheduled-task}
      SCHEDULING_ROCKETMQ_CONSUMER_GROUP: ${SCHEDULING_ROCKETMQ_CONSUMER_GROUP:-commerceflow-scheduled-task-consumer}
      SCHEDULING_ROCKETMQ_TAG: ${SCHEDULING_ROCKETMQ_TAG:-SCHEDULED_TASK}
      SCHEDULING_ROCKETMQ_REQUEST_TIMEOUT: ${SCHEDULING_ROCKETMQ_REQUEST_TIMEOUT:-5s}
      SCHEDULING_ROCKETMQ_PUBLISH_INITIAL_DELAY: ${SCHEDULING_ROCKETMQ_PUBLISH_INITIAL_DELAY:-2s}
      SCHEDULING_ROCKETMQ_PUBLISH_FIXED_DELAY: ${SCHEDULING_ROCKETMQ_PUBLISH_FIXED_DELAY:-1s}
      SCHEDULING_ROCKETMQ_PUBLISH_BATCH_SIZE: ${SCHEDULING_ROCKETMQ_PUBLISH_BATCH_SIZE:-100}
      SCHEDULING_MQ_CRASH_LAB_ENABLED: ${SCHEDULING_MQ_CRASH_LAB_ENABLED:-false}
      SCHEDULING_MQ_CRASH_LAB_TASK_ID: ${SCHEDULING_MQ_CRASH_LAB_TASK_ID:-1}
      SCHEDULING_MQ_CRASH_LAB_PAUSE: ${SCHEDULING_MQ_CRASH_LAB_PAUSE:-5m}
      SCHEDULING_DATABASE_INITIAL_DELAY: ${SCHEDULING_DATABASE_INITIAL_DELAY:-10s}
      SCHEDULING_DATABASE_FIXED_DELAY: ${SCHEDULING_DATABASE_FIXED_DELAY:-15s}
      SCHEDULING_DATABASE_BATCH_SIZE: ${SCHEDULING_DATABASE_BATCH_SIZE:-100}
      SCHEDULING_LEASE_RECOVERY_INITIAL_DELAY: ${SCHEDULING_LEASE_RECOVERY_INITIAL_DELAY:-30s}
      SCHEDULING_LEASE_RECOVERY_FIXED_DELAY: ${SCHEDULING_LEASE_RECOVERY_FIXED_DELAY:-30s}
      SCHEDULING_LEASE_RECOVERY_BATCH_SIZE: ${SCHEDULING_LEASE_RECOVERY_BATCH_SIZE:-100}
      SCHEDULING_RECONCILIATION_INITIAL_DELAY: ${SCHEDULING_RECONCILIATION_INITIAL_DELAY:-30s}
      SCHEDULING_RECONCILIATION_FIXED_DELAY: ${SCHEDULING_RECONCILIATION_FIXED_DELAY:-5m}
      SCHEDULING_RECONCILIATION_BATCH_SIZE: ${SCHEDULING_RECONCILIATION_BATCH_SIZE:-100}
      ORDER_PAYMENT_TIMEOUT: ${ORDER_PAYMENT_TIMEOUT:-30m}
    ports:
      - "18081:8080"
    depends_on:
      commerce-db:
        condition: service_healthy
      commerce-redis:
        condition: service_healthy
      payment-simulator-service:
        condition: service_healthy
      logistics-simulator-service:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  commerce-portal-angular:
    build:
      context: ./web/commerce-portal/angular
    ports:
      - "14200:80"
    depends_on:
      commerce-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  commerce-db-data:
  commerce-redis-data:
  payment-simulator-db-data:
  payment-simulator-redis-data:
  logistics-simulator-db-data:
  kafka-broker-data:
  rabbitmq-broker-data:
  rocketmq-nameserver-logs:
  rocketmq-broker-store:
  rocketmq-broker-logs:
