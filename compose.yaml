  fulfillment-db-postgresql:
    <<: *business-postgresql
    container_name: fairy-commerceflow-fulfillment-db-postgresql
    environment:
      POSTGRES_DB: fulfillment
      POSTGRES_PASSWORD: ${FULFILLMENT_PG_ADMIN_PASSWORD:-local-fulfillment-pg-admin-password}
    volumes:
      - fulfillment-postgresql-data:/var/lib/postgresql/data

  payment-db-postgresql:
    <<: *business-postgresql
    container_name: fairy-commerceflow-payment-db-postgresql
    environment:
      POSTGRES_DB: payments
      POSTGRES_PASSWORD: ${PAYMENT_ORCHESTRATION_PG_ADMIN_PASSWORD:-local-payment-orchestration-pg-admin-password}
    volumes:
      - payment-postgresql-data:/var/lib/postgresql/data

  payment-simulator-db-postgresql:
    <<: *business-postgresql
    container_name: fairy-commerceflow-payment-simulator-db-postgresql
    environment:
      POSTGRES_DB: payment_platform
      POSTGRES_PASSWORD: ${PAYMENT_SIMULATOR_PG_ADMIN_PASSWORD:-local-payment-simulator-pg-admin-password}
    volumes:
      - payment-simulator-postgresql-data:/var/lib/postgresql/data

  warehouse-simulator-db-postgresql:
    <<: *business-postgresql
    container_name: fairy-commerceflow-warehouse-simulator-db-postgresql
    environment:
      POSTGRES_DB: warehouse_platform
      POSTGRES_PASSWORD: ${WAREHOUSE_PG_ADMIN_PASSWORD:-local-warehouse-pg-admin-password}
    volumes:
      - warehouse-postgresql-data:/var/lib/postgresql/data

  logistics-simulator-db-postgresql:
    <<: *business-postgresql
    container_name: fairy-commerceflow-logistics-simulator-db-postgresql
    environment:
      POSTGRES_DB: logistics_platform
      POSTGRES_PASSWORD: ${LOGISTICS_PG_ADMIN_PASSWORD:-local-logistics-pg-admin-password}
    volumes:
      - logistics-postgresql-data:/var/lib/postgresql/data

  invoice-db-postgresql:
    <<: *business-postgresql
    container_name: fairy-commerceflow-invoice-db-postgresql
    environment:
      POSTGRES_DB: invoice_platform
      POSTGRES_PASSWORD: ${INVOICE_PG_ADMIN_PASSWORD:-local-invoice-pg-admin-password}
    volumes:
      - invoice-postgresql-data:/var/lib/postgresql/data

  invoice-simulator-service:
    container_name: fairy-commerceflow-invoice-simulator-service
    build:
      context: ./simulators/invoice-platform/service
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://invoice-db-postgresql:5432/invoice_platform?currentSchema=invoice_platform
      SPRING_DATASOURCE_USERNAME: invoice_runtime
      SPRING_DATASOURCE_PASSWORD: ${INVOICE_PG_RUNTIME_PASSWORD:-local-invoice-pg-runtime-password}
      SPRING_PROFILES_ACTIVE: postgresql
      SPRING_FLYWAY_ENABLED: "false"
      INVOICE_CALLBACK_URL: http://commerce-service:8080/internal/v1/invoice-receipts
      INVOICE_REQUEST_SECRET: ${INVOICE_REQUEST_SECRET:-local-invoice-request-secret-for-testing}
      INVOICE_CALLBACK_SECRET: ${INVOICE_CALLBACK_SECRET:-local-invoice-callback-secret-for-testing}
    depends_on:
      invoice-db-postgresql:
        condition: service_healthy

  messaging-simulator-db-postgresql:
    <<: *business-postgresql
    container_name: fairy-commerceflow-messaging-simulator-db-postgresql
    environment:
      POSTGRES_DB: messaging_platform
      POSTGRES_PASSWORD: ${MESSAGING_PG_ADMIN_PASSWORD:-local-messaging-pg-admin-password}
    volumes:
      - messaging-postgresql-data:/var/lib/postgresql/data

