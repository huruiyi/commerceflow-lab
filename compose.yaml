        condition: service_healthy
    restart: "no"

  catalog-demo-init:
    container_name: fairy-commerceflow-catalog-demo-init
    image: mysql:8.4
    profiles: ["demo-data"]
    entrypoint: ["sh", "/demo/init-demo-data.sh"]
    environment:
      CATALOG_USERNAME: ${CATALOG_DATABASE_USERNAME:-catalog}
      CATALOG_PASSWORD: ${CATALOG_DATABASE_PASSWORD:-catalog-password}
      INVENTORY_USERNAME: ${INVENTORY_DATABASE_USERNAME:-inventory}
      INVENTORY_PASSWORD: ${INVENTORY_DATABASE_PASSWORD:-inventory-password}
      DEMO_MERCHANT_ID: ${DEMO_MERCHANT_ID:-5}
    volumes:
      - ./infrastructure/demo:/demo:ro
    depends_on:
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    restart: "no"

  inventory-service:
    container_name: fairy-commerceflow-inventory-service
    build:
      context: ./services/inventory-service
    environment:
      DATABASE_URL: jdbc:mysql://inventory-db:3306/inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: ${INVENTORY_DATABASE_USERNAME:-inventory}
      DATABASE_PASSWORD: ${INVENTORY_DATABASE_PASSWORD:-inventory-password}
      INVENTORY_ACCEPTING_TRAFFIC: ${INVENTORY_ACCEPTING_TRAFFIC:-true}
      INVENTORY_RESULT_DELAY_LAB: ${INVENTORY_RESULT_DELAY_LAB:-0s}
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092
      FULFILLMENT_INVENTORY_SECRET: ${FULFILLMENT_INVENTORY_SECRET:-demo-fulfillment-inventory-secret}
      INVENTORY_INTERNAL_SECRET: ${INVENTORY_INTERNAL_SECRET:-demo-inventory-internal-secret}
      PAYMENT_INVENTORY_INTERNAL_SECRET: ${PAYMENT_INVENTORY_INTERNAL_SECRET:-demo-payment-inventory-internal-secret}
      CATALOG_INTERNAL_SECRET: ${CATALOG_INTERNAL_SECRET:-demo-catalog-internal-secret}
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "18088:8080"
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  order-service:
    container_name: fairy-commerceflow-order-service
    build:
      context: ./services/order-service
    environment:
      FULFILLMENT_ORDER_SECRET: ${FULFILLMENT_ORDER_SECRET:-demo-fulfillment-order-secret}
      DATABASE_URL: jdbc:mysql://order-db:3306/orders?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: ${ORDER_DATABASE_USERNAME:-orders}
      DATABASE_PASSWORD: ${ORDER_DATABASE_PASSWORD:-orders-password}
      ORDER_ACCEPTING_TRAFFIC: ${ORDER_ACCEPTING_TRAFFIC:-true}
      ORDER_SHADOW_ENABLED: "false"
      ORDER_INTERNAL_SECRET: ${ORDER_INTERNAL_SECRET:-demo-order-internal-secret}
      PAYMENT_ORDER_INTERNAL_SECRET: ${PAYMENT_ORDER_INTERNAL_SECRET:-demo-payment-order-internal-secret}
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "18089:8080"
    depends_on:
      order-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  payment-orchestration-service:
    container_name: fairy-commerceflow-payment-orchestration-service
    build:
      context: ./services/payment-orchestration-service
    environment:
      DATABASE_URL: jdbc:mysql://payment-db:3306/payments?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: ${PAYMENT_ORCHESTRATION_DATABASE_USERNAME:-payments}
      DATABASE_PASSWORD: ${PAYMENT_ORCHESTRATION_DATABASE_PASSWORD:-payments-password}
      PAYMENT_ACCEPTING_TRAFFIC: ${PAYMENT_ACCEPTING_TRAFFIC:-true}
      PAYMENT_EFFECTS_ENABLED: ${PAYMENT_EFFECTS_ENABLED:-true}
      PAYMENT_EFFECTS_BATCH_SIZE: ${PAYMENT_EFFECTS_BATCH_SIZE:-20}
      PAYMENT_SHADOW_ENABLED: "false"
      PAYMENT_INTERNAL_SECRET: ${PAYMENT_INTERNAL_SECRET:-demo-payment-internal-secret}
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-demo-platform-callback-secret}
      PAYMENT_PLATFORM_BASE_URL: http://payment-simulator-service:8080
      ORDER_SERVICE_BASE_URL: ${ORDER_SERVICE_BASE_URL:-http://order-service:8080}
      PAYMENT_ORDER_INTERNAL_SECRET: ${PAYMENT_ORDER_INTERNAL_SECRET:-demo-payment-order-internal-secret}
      INVENTORY_SERVICE_BASE_URL: ${INVENTORY_SERVICE_BASE_URL:-http://inventory-service:8080}
      PAYMENT_INVENTORY_INTERNAL_SECRET: ${PAYMENT_INVENTORY_INTERNAL_SECRET:-demo-payment-inventory-internal-secret}
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    ports:
      - "18090:8080"
    depends_on:
      payment-db:
        condition: service_healthy
      payment-simulator-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  payment-demo-init:
    image: mysql:8.4
    profiles: ["demo-data"]
    entrypoint:
      - sh
      - -ec
      - 'MYSQL_PWD="$$PAYMENT_PASSWORD" exec mysql -h payment-db -u "$$PAYMENT_USERNAME" --default-character-set=utf8mb4 payments < /demo/init-payment.sql'
    environment:
      PAYMENT_USERNAME: ${PAYMENT_ORCHESTRATION_DATABASE_USERNAME:-payments}
      PAYMENT_PASSWORD: ${PAYMENT_ORCHESTRATION_DATABASE_PASSWORD:-payments-password}
    volumes:
      - ./infrastructure/demo/init-payment.sql:/demo/init-payment.sql:ro
    depends_on:
      payment-orchestration-service:
        condition: service_healthy
    restart: "no"

  inventory-data-migrator:
    container_name: fairy-commerceflow-inventory-data-migrator
    image: mysql:8.4
    profiles: ["inventory-migration"]
    entrypoint: ["sh", "/migration/migrate-inventory-data.sh"]
    environment:
      SOURCE_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      TARGET_ROOT_PASSWORD: ${INVENTORY_MYSQL_ROOT_PASSWORD:-local-inventory-root-password}
    volumes:
      - ./infrastructure/inventory/migrate-inventory-data.sh:/migration/migrate-inventory-data.sh:ro
    depends_on:
      commerce-db:
        condition: service_healthy
      inventory-db:
        condition: service_healthy
    restart: "no"

  legacy-shadow-access-revoker:
    container_name: fairy-commerceflow-legacy-shadow-access-revoker
    image: mysql:8.4
    profiles: ["migration-access"]
    entrypoint: ["sh", "/access/revoke-shadow-access.sh"]
    environment:
      COMMERCE_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      ORDER_ROOT_PASSWORD: ${ORDER_MYSQL_ROOT_PASSWORD:-local-order-root-password}
    volumes:
      - ./infrastructure/commerce/revoke-shadow-access.sh:/access/revoke-shadow-access.sh:ro
    depends_on:
      commerce-db:
        condition: service_healthy
      order-db:
        condition: service_healthy
    restart: "no"

  commerce-portal-angular:
    container_name: fairy-commerceflow-commerce-portal-angular
    build:
      context: ./web/commerce-portal/angular
    ports:
      - "14200:80"
    depends_on:
      commerce-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  commerce-db-data:
  notification-db-data:
  catalog-db-data:
  inventory-db-data:
  order-db-data:
  payment-db-data:
  fulfillment-db-data:
  commerce-redis-data:
  payment-simulator-db-data:
  payment-simulator-redis-data:
  logistics-simulator-db-data:
  warehouse-simulator-db-data:
  messaging-simulator-db-data:
  kafka-broker-data:
  rabbitmq-broker-data:
  rocketmq-nameserver-logs:
  rocketmq-broker-store:
  rocketmq-broker-logs:
