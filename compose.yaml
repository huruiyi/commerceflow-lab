name: commerceflow
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: commerceflow
      MYSQL_USER: ${DATABASE_USERNAME:-commerceflow}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-commerceflow-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: commerceflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "14202:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [observability]
    ports: ["19090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.1
    profiles: [observability]
    ports: ["13000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: commerceflow-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    restart: unless-stopped

  payment-mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: payment_platform
      MYSQL_USER: ${PAYMENT_DATABASE_USERNAME:-payment}
      MYSQL_PASSWORD: ${PAYMENT_DATABASE_PASSWORD:-payment-password}
      MYSQL_ROOT_PASSWORD: ${PAYMENT_MYSQL_ROOT_PASSWORD:-local-payment-root-password}
    ports:
      - "13307:3306"
    volumes:
      - payment-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mock-payment-service:
    build:
      context: ./mock-payment-service
    environment:
      PAYMENT_DATABASE_URL: jdbc:mysql://payment-mysql:3306/payment_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PAYMENT_DATABASE_USERNAME: ${PAYMENT_DATABASE_USERNAME:-payment}
      PAYMENT_DATABASE_PASSWORD: ${PAYMENT_DATABASE_PASSWORD:-payment-password}
      PAYMENT_CREDENTIAL_MASTER_KEY: ${PAYMENT_CREDENTIAL_MASTER_KEY:-bG9jYWwtZGVtby1rZXktMTIzNDU2Nzg5MC1hYmNkZWY=}
      PAYMENT_CHECKOUT_BASE_URL: http://localhost:14201
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_CALLBACK_URL: http://backend:8080/api/payment-notifications/callback
      REFUND_CALLBACK_URL: http://backend:8080/api/refund-notifications/callback
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-demo-platform-callback-secret}
    ports:
      - "18082:8080"
    depends_on:
      payment-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  payment-ui:
    build:
      context: ./mock-payment-ui
    ports:
      - "14201:80"
    depends_on:
      mock-payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  logistics-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: logistics_platform
      MYSQL_USER: ${LOGISTICS_DATABASE_USERNAME:-logistics}
      MYSQL_PASSWORD: ${LOGISTICS_DATABASE_PASSWORD:-logistics-password}
      MYSQL_ROOT_PASSWORD: ${LOGISTICS_MYSQL_ROOT_PASSWORD:-local-logistics-root-password}
    ports:
      - "13308:3306"
    volumes:
      - logistics-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mock-logistics-service:
    build:
      context: ./mock-logistics-service
    environment:
      LOGISTICS_DATABASE_URL: jdbc:mysql://logistics-mysql:3306/logistics_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      LOGISTICS_DATABASE_USERNAME: ${LOGISTICS_DATABASE_USERNAME:-logistics}
      LOGISTICS_DATABASE_PASSWORD: ${LOGISTICS_DATABASE_PASSWORD:-logistics-password}
      LOGISTICS_APP_ID: ${LOGISTICS_APP_ID:-commerceflow-storefront}
      LOGISTICS_REQUEST_SECRET: ${LOGISTICS_REQUEST_SECRET:-demo-logistics-request-secret}
      LOGISTICS_CALLBACK_SECRET: ${LOGISTICS_CALLBACK_SECRET:-demo-logistics-callback-secret}
      LOGISTICS_CALLBACK_URL: http://backend:8080/api/logistics-notifications/callback
      LOGISTICS_CALLBACK_DELIVERY_ENABLED: ${LOGISTICS_CALLBACK_DELIVERY_ENABLED:-true}
      LOGISTICS_CALLBACK_DELIVERY_INITIAL_DELAY: ${LOGISTICS_CALLBACK_DELIVERY_INITIAL_DELAY:-2s}
      LOGISTICS_CALLBACK_DELIVERY_SCAN_INTERVAL: ${LOGISTICS_CALLBACK_DELIVERY_SCAN_INTERVAL:-1s}
      LOGISTICS_CALLBACK_DELIVERY_RETRY_DELAY: ${LOGISTICS_CALLBACK_DELIVERY_RETRY_DELAY:-2s}
      LOGISTICS_CALLBACK_DELIVERY_CLAIM_LEASE: ${LOGISTICS_CALLBACK_DELIVERY_CLAIM_LEASE:-30s}
      LOGISTICS_CALLBACK_DELIVERY_CONNECT_TIMEOUT: ${LOGISTICS_CALLBACK_DELIVERY_CONNECT_TIMEOUT:-2s}
      LOGISTICS_CALLBACK_DELIVERY_READ_TIMEOUT: ${LOGISTICS_CALLBACK_DELIVERY_READ_TIMEOUT:-3s}
      LOGISTICS_CALLBACK_DELIVERY_BATCH_SIZE: ${LOGISTICS_CALLBACK_DELIVERY_BATCH_SIZE:-50}
      LOGISTICS_CALLBACK_DELIVERY_MAX_ATTEMPTS: ${LOGISTICS_CALLBACK_DELIVERY_MAX_ATTEMPTS:-10}
      LOGISTICS_AUTO_PROGRESS_ENABLED: ${LOGISTICS_AUTO_PROGRESS_ENABLED:-false}
      LOGISTICS_AUTO_PROGRESS_INITIAL_DELAY: ${LOGISTICS_AUTO_PROGRESS_INITIAL_DELAY:-10s}
      LOGISTICS_AUTO_PROGRESS_SCAN_INTERVAL: ${LOGISTICS_AUTO_PROGRESS_SCAN_INTERVAL:-5s}
      LOGISTICS_AUTO_PROGRESS_STEP_INTERVAL: ${LOGISTICS_AUTO_PROGRESS_STEP_INTERVAL:-5m}
      LOGISTICS_AUTO_PROGRESS_BATCH_SIZE: ${LOGISTICS_AUTO_PROGRESS_BATCH_SIZE:-100}
    ports:
      - "18083:8080"
    depends_on:
      logistics-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/commerceflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: ${DATABASE_USERNAME:-commerceflow}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-commerceflow-password}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:-commerceflow-demo-remember-me-key-change-in-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_PLATFORM_BASE_URL: http://mock-payment-service:8080
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-demo-platform-callback-secret}
      LOGISTICS_PLATFORM_BASE_URL: http://mock-logistics-service:8080
      LOGISTICS_APP_ID: ${LOGISTICS_APP_ID:-commerceflow-storefront}
      LOGISTICS_REQUEST_SECRET: ${LOGISTICS_REQUEST_SECRET:-demo-logistics-request-secret}
      LOGISTICS_CALLBACK_SECRET: ${LOGISTICS_CALLBACK_SECRET:-demo-logistics-callback-secret}
      LOGISTICS_CALLBACK_URL: http://backend:8080/api/logistics-notifications/callback
      LOGISTICS_RECONCILIATION_ENABLED: ${LOGISTICS_RECONCILIATION_ENABLED:-true}
      LOGISTICS_RECONCILIATION_INITIAL_DELAY: ${LOGISTICS_RECONCILIATION_INITIAL_DELAY:-30s}
      LOGISTICS_RECONCILIATION_SCAN_INTERVAL: ${LOGISTICS_RECONCILIATION_SCAN_INTERVAL:-1m}
      LOGISTICS_RECONCILIATION_STALE_AFTER: ${LOGISTICS_RECONCILIATION_STALE_AFTER:-5m}
      LOGISTICS_RECONCILIATION_BATCH_SIZE: ${LOGISTICS_RECONCILIATION_BATCH_SIZE:-100}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "18081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-payment-service:
        condition: service_healthy
      mock-logistics-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "14200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  payment-mysql-data:
  logistics-mysql-data:
  kafka-data:
