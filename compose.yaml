name: fairy-commerceflow
services:
  commerce-db:
    container_name: fairy-commerceflow-commerce-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: commerceflow
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - commerce-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  commerce-schema-migrator:
    container_name: fairy-commerceflow-commerce-schema-migrator
    image: redgate/flyway:12.4.0
    command:
      - -url=jdbc:mysql://commerce-db:3306/commerceflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - -user=root
      - -password=${MYSQL_ROOT_PASSWORD:-local-root-password}
      - -connectRetries=60
      - migrate
    volumes:
      - ./services/commerce-service/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      commerce-db:
        condition: service_healthy
    restart: "no"

  commerce-source-access-freezer:
    container_name: fairy-commerceflow-commerce-source-access-freezer
    image: mysql:8.4
    entrypoint: ["sh", "/access/freeze-source-access.sh"]
    environment:
      SOURCE_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      RUNTIME_DATABASE_USERNAME: ${COMMERCE_RUNTIME_DATABASE_USERNAME:-commerce_runtime}
      RUNTIME_DATABASE_PASSWORD: ${COMMERCE_RUNTIME_DATABASE_PASSWORD:-commerce-runtime-password}
      FULFILLMENT_SOURCE_OWNER: FULFILLMENT
    volumes:
      - ./infrastructure/commerce/freeze-source-access.sh:/access/freeze-source-access.sh:ro
    depends_on:
      commerce-schema-migrator:
        condition: service_completed_successfully
    restart: "no"

  verification-db-access:
    container_name: fairy-commerceflow-verification-db-access
    image: mysql:8.4
    profiles: ["verification-access"]
    entrypoint: ["sh", "/access/verification-db-access.sh"]
    command: ["--readers"]
    environment:
      COMMERCE_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      ORDER_ROOT_PASSWORD: ${ORDER_MYSQL_ROOT_PASSWORD:-local-order-root-password}
      PAYMENT_ROOT_PASSWORD: ${PAYMENT_ORCHESTRATION_MYSQL_ROOT_PASSWORD:-local-payments-root-password}
      COMMERCE_AUDIT_PASSWORD: ${COMMERCE_AUDIT_PASSWORD:-local-commerce-audit}
      COMMERCE_LEGACY_AUDIT_PASSWORD: ${COMMERCE_LEGACY_AUDIT_PASSWORD:-local-legacy-audit}
      COMMERCE_TASK_FIXTURE_PASSWORD: ${COMMERCE_TASK_FIXTURE_PASSWORD:-local-task-fixture}
      COMMERCE_RECOVERY_FIXTURE_PASSWORD: ${COMMERCE_RECOVERY_FIXTURE_PASSWORD:-local-recovery-fixture}
      COMMERCE_LEGACY_LOCK_PASSWORD: ${COMMERCE_LEGACY_LOCK_PASSWORD:-local-legacy-lock}
      ORDER_AUDIT_PASSWORD: ${ORDER_AUDIT_PASSWORD:-local-order-audit}
      PAYMENT_AUDIT_PASSWORD: ${PAYMENT_AUDIT_PASSWORD:-local-payment-audit}
      VERIFICATION_PROJECT: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./infrastructure/commerce/verification-db-access.sh:/access/verification-db-access.sh:ro
    restart: "no"

  notification-db:
    container_name: fairy-commerceflow-notification-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: notification
      MYSQL_USER: ${NOTIFICATION_DATABASE_USERNAME:-notification}
      MYSQL_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD:-notification-password}
      MYSQL_ROOT_PASSWORD: ${NOTIFICATION_MYSQL_ROOT_PASSWORD:-local-notification-root-password}
    volumes:
      - notification-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  catalog-db:
    container_name: fairy-commerceflow-catalog-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: catalog
      MYSQL_USER: ${CATALOG_DATABASE_USERNAME:-catalog}
      MYSQL_PASSWORD: ${CATALOG_DATABASE_PASSWORD:-catalog-password}
      MYSQL_ROOT_PASSWORD: ${CATALOG_MYSQL_ROOT_PASSWORD:-local-catalog-root-password}
    volumes:
      - catalog-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  inventory-db:
    container_name: fairy-commerceflow-inventory-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: ${INVENTORY_DATABASE_USERNAME:-inventory}
      MYSQL_PASSWORD: ${INVENTORY_DATABASE_PASSWORD:-inventory-password}
      MYSQL_ROOT_PASSWORD: ${INVENTORY_MYSQL_ROOT_PASSWORD:-local-inventory-root-password}
    volumes:
      - inventory-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  order-db:
    container_name: fairy-commerceflow-order-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: orders
      MYSQL_USER: ${ORDER_DATABASE_USERNAME:-orders}
      MYSQL_PASSWORD: ${ORDER_DATABASE_PASSWORD:-orders-password}
      MYSQL_ROOT_PASSWORD: ${ORDER_MYSQL_ROOT_PASSWORD:-local-order-root-password}
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  payment-db:
    container_name: fairy-commerceflow-payment-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: payments
      MYSQL_USER: ${PAYMENT_ORCHESTRATION_DATABASE_USERNAME:-payments}
      MYSQL_PASSWORD: ${PAYMENT_ORCHESTRATION_DATABASE_PASSWORD:-payments-password}
      MYSQL_ROOT_PASSWORD: ${PAYMENT_ORCHESTRATION_MYSQL_ROOT_PASSWORD:-local-payments-root-password}
    volumes:
      - payment-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  fulfillment-db:
    container_name: fairy-commerceflow-fulfillment-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fulfillment
      MYSQL_USER: ${FULFILLMENT_DATABASE_USERNAME:-fulfillment}
      MYSQL_PASSWORD: ${FULFILLMENT_DATABASE_PASSWORD:-fulfillment-password}
      MYSQL_ROOT_PASSWORD: ${FULFILLMENT_MYSQL_ROOT_PASSWORD:-local-fulfillment-root-password}
    volumes:
      - fulfillment-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  fulfillment-shadow-access:
    profiles: [fulfillment-shadow]
    container_name: fairy-commerceflow-fulfillment-shadow-access
    image: mysql:8.4
    entrypoint: ["sh", "/access/fulfillment-shadow-access.sh"]
    volumes:
      - ./infrastructure/commerce/fulfillment-shadow-access.sh:/access/fulfillment-shadow-access.sh:ro
    environment:
      SHADOW_PROJECT: ${COMPOSE_PROJECT_NAME}
      COMMERCE_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      ORDER_ROOT_PASSWORD: ${ORDER_MYSQL_ROOT_PASSWORD:-local-order-root-password}
      FULFILLMENT_READER_PASSWORD: ${FULFILLMENT_READER_PASSWORD:-fulfillment-shadow-reader}
    depends_on:
      commerce-schema-migrator:
        condition: service_completed_successfully
      order-service:
        condition: service_healthy
    restart: "no"

  messaging-simulator-db:
    container_name: fairy-commerceflow-messaging-simulator-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: messaging_platform
      MYSQL_USER: ${MESSAGING_DATABASE_USERNAME:-messaging}
      MYSQL_PASSWORD: ${MESSAGING_DATABASE_PASSWORD:-messaging-password}
      MYSQL_ROOT_PASSWORD: ${MESSAGING_MYSQL_ROOT_PASSWORD:-local-messaging-root-password}
    volumes:
      - messaging-simulator-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  messaging-simulator-service:
    container_name: fairy-commerceflow-messaging-simulator-service
    build:
      context: ./simulators/messaging-platform/service
    environment:
      MESSAGING_DATABASE_URL: jdbc:mysql://messaging-simulator-db:3306/messaging_platform?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
      MESSAGING_DATABASE_USERNAME: ${MESSAGING_DATABASE_USERNAME:-messaging}
      MESSAGING_DATABASE_PASSWORD: ${MESSAGING_DATABASE_PASSWORD:-messaging-password}
      MESSAGING_ADMIN_TOKEN: ${MESSAGING_ADMIN_TOKEN:-demo-messaging-admin-token}
      MESSAGING_SENDER_SECRET: ${MESSAGING_SENDER_SECRET:-demo-messaging-sender-secret}
      MESSAGING_FAULTS_ENABLED: "${MESSAGING_FAULTS_ENABLED:-false}"
    depends_on:
      messaging-simulator-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  messaging-simulator-web:
    container_name: fairy-commerceflow-messaging-simulator-web
    build:
      context: ./simulators/messaging-platform/web
      additional_contexts:
        simulator-admin: ./simulators/admin-ui
    ports:
      - "127.0.0.1:18119:80"
    depends_on:
      messaging-simulator-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  warehouse-simulator-db:
    container_name: fairy-commerceflow-warehouse-simulator-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: warehouse_platform
      MYSQL_USER: ${WAREHOUSE_DATABASE_USERNAME:-warehouse}
      MYSQL_PASSWORD: ${WAREHOUSE_DATABASE_PASSWORD:-warehouse-password}
      MYSQL_ROOT_PASSWORD: ${WAREHOUSE_MYSQL_ROOT_PASSWORD:-local-warehouse-root-password}
    volumes:
      - warehouse-simulator-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  warehouse-simulator-service:
    container_name: fairy-commerceflow-warehouse-simulator-service
    build:
      context: ./simulators/warehouse-platform/service
    environment:
      WAREHOUSE_DATABASE_URL: jdbc:mysql://warehouse-simulator-db:3306/warehouse_platform?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
      WAREHOUSE_DATABASE_USERNAME: ${WAREHOUSE_DATABASE_USERNAME:-warehouse}
      WAREHOUSE_DATABASE_PASSWORD: ${WAREHOUSE_DATABASE_PASSWORD:-warehouse-password}
      WAREHOUSE_RETURN_SECRET: ${WAREHOUSE_RETURN_SECRET:-demo-warehouse-return-secret}
      WAREHOUSE_ADMIN_TOKEN: ${WAREHOUSE_ADMIN_TOKEN:-demo-warehouse-admin-token}
      FULFILLMENT_WAREHOUSE_SECRET: ${FULFILLMENT_WAREHOUSE_SECRET:-demo-fulfillment-warehouse-secret}
    depends_on:
      warehouse-simulator-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  warehouse-simulator-web:
    container_name: fairy-commerceflow-warehouse-simulator-web
    build:
      context: ./simulators/warehouse-platform/web
      additional_contexts:
        simulator-admin: ./simulators/admin-ui
    ports:
      - "127.0.0.1:18118:80"
    depends_on:
      warehouse-simulator-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  fulfillment-service:
    container_name: fairy-commerceflow-fulfillment-service
    build:
      context: ./services/fulfillment-service
    environment:
      FULFILLMENT_RUNTIME_MODE: EXECUTION
      FULFILLMENT_REQUIRE_PROMOTED_MODE: "true"
      FULFILLMENT_DATABASE_URL: jdbc:mysql://fulfillment-db:3306/fulfillment?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      FULFILLMENT_DATABASE_USERNAME: ${FULFILLMENT_DATABASE_USERNAME:-fulfillment}
      FULFILLMENT_DATABASE_PASSWORD: ${FULFILLMENT_DATABASE_PASSWORD:-fulfillment-password}
      FULFILLMENT_INTERNAL_SECRET: ${FULFILLMENT_INTERNAL_SECRET:-demo-fulfillment-internal-secret}
      FULFILLMENT_RECOVERY_ENABLED: "true"
      FULFILLMENT_ADMIN_SECRET: ${FULFILLMENT_ADMIN_SECRET:-demo-fulfillment-admin-secret}
      FULFILLMENT_ORDER_ENDPOINT: http://order-service:8080
      FULFILLMENT_ORDER_SECRET: ${FULFILLMENT_ORDER_SECRET:-demo-fulfillment-order-secret}
      FULFILLMENT_LOGISTICS_ENDPOINT: http://commerce-service:8080
      FULFILLMENT_LOGISTICS_SECRET: ${FULFILLMENT_LOGISTICS_SECRET:-demo-fulfillment-logistics-secret}
      FULFILLMENT_WAREHOUSE_ENDPOINT: http://warehouse-simulator-service:8080
      FULFILLMENT_WAREHOUSE_SECRET: ${FULFILLMENT_WAREHOUSE_SECRET:-demo-fulfillment-warehouse-secret}
      FULFILLMENT_INVENTORY_ENDPOINT: http://inventory-service:8080
      FULFILLMENT_INVENTORY_SECRET: ${FULFILLMENT_INVENTORY_SECRET:-demo-fulfillment-inventory-secret}
    ports:
      - "127.0.0.1:18091:8080"
    depends_on:
      fulfillment-db:
        condition: service_healthy
      warehouse-simulator-service:
        condition: service_healthy
      commerce-source-access-freezer:
        condition: service_completed_successfully
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  commerce-redis:
    container_name: fairy-commerceflow-commerce-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - commerce-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka-broker:
    container_name: fairy-commerceflow-kafka-broker
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-broker-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  kafka-console:
    container_name: fairy-commerceflow-kafka-console
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: commerceflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
    ports:
      - "14202:8080"
    depends_on:
      kafka-broker:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq-broker:
    container_name: fairy-commerceflow-rabbitmq-broker
    image: rabbitmq:4.1-management
    profiles: [rabbitmq]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-commerceflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-commerceflow-password}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-broker-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  rocketmq-storage-init:
    container_name: fairy-commerceflow-rocketmq-storage-init
    image: apache/rocketmq:5.4.0
    profiles: [rocketmq]
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /home/rocketmq/logs/namesrv/rocketmqlogs
        /home/rocketmq/logs/broker/rocketmqlogs /home/rocketmq/store &&
        chown -R 3000:3000 /home/rocketmq/logs /home/rocketmq/store
    volumes:
      - rocketmq-nameserver-logs:/home/rocketmq/logs/namesrv
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs/broker
    restart: "no"

  rocketmq-nameserver:
    container_name: fairy-commerceflow-rocketmq-nameserver
    image: apache/rocketmq:5.4.0
    profiles: [rocketmq]
    command: sh mqnamesrv
    volumes:
      - rocketmq-nameserver-logs:/home/rocketmq/logs
    depends_on:
      rocketmq-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -v grep | grep NamesrvStartup >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  rocketmq-broker:
    container_name: fairy-commerceflow-rocketmq-broker
    image: apache/rocketmq:5.4.0
    profiles: [rocketmq]
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
    command: sh mqbroker -n rocketmq-nameserver:9876 --enable-proxy
    ports:
      - "18084:8081"
    volumes:
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    depends_on:
      rocketmq-nameserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-nameserver:9876 2>/dev/null | grep DefaultCluster >/dev/null"]
      interval: 5s
      timeout: 8s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  rocketmq-topic-init:
    container_name: fairy-commerceflow-rocketmq-topic-init
    image: apache/rocketmq:5.4.0
    profiles: [rocketmq]
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
      ROCKETMQ_TOPIC: ${SCHEDULING_ROCKETMQ_TOPIC:-commerceflow-scheduled-task}
      ROCKETMQ_CONSUMER_GROUP: ${SCHEDULING_ROCKETMQ_CONSUMER_GROUP:-commerceflow-scheduled-task-consumer}
      ROCKETMQ_CONSUMER_RETRY_MAX_TIMES: ${ROCKETMQ_CONSUMER_RETRY_MAX_TIMES:-2}
    command:
      - sh
      - -c
      - >-
        sh mqadmin updateTopic -n rocketmq-nameserver:9876 -c DefaultCluster
        -t $${ROCKETMQ_TOPIC:-commerceflow-scheduled-task} -a +message.type=DELAY
        && sh mqadmin updateSubGroup -n rocketmq-nameserver:9876 -c DefaultCluster
        -g $${ROCKETMQ_CONSUMER_GROUP:-commerceflow-scheduled-task-consumer}
        -r $${ROCKETMQ_CONSUMER_RETRY_MAX_TIMES:-2}
        -p '{"type":"CUSTOMIZED","customizedRetryPolicy":{"next":[1000,2000]}}'
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    restart: "no"

  prometheus:
    container_name: fairy-commerceflow-prometheus
    image: prom/prometheus:v3.7.3
    profiles: [observability]
    ports: ["19090:9090"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/rules:/etc/prometheus/rules:ro
      - ./infrastructure/monitoring/tests:/etc/prometheus/tests:ro
    depends_on:
      commerce-service: {condition: service_healthy}
      payment-simulator-service: {condition: service_healthy}
      logistics-simulator-service: {condition: service_healthy}
      alertmanager: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tempo:
    container_name: fairy-commerceflow-tempo
    image: grafana/tempo:3.1.1
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "13200:3200"
      - "14318:4318"
    volumes:
      - ./infrastructure/monitoring/tempo.yml:/etc/tempo.yml:ro
    tmpfs:
      - /tmp
    restart: unless-stopped

  alertmanager:
    container_name: fairy-commerceflow-alertmanager
    image: prom/alertmanager:v0.29.0
    profiles: [observability]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    ports: ["19093:9093"]
    volumes:
      - ./infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    tmpfs: [/alertmanager]
    depends_on:
      alert-webhook: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9093/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  alert-webhook:
    container_name: fairy-commerceflow-alert-webhook
    image: python:3.14.0-alpine3.22
    profiles: [observability]
    command: ["python", "/app/receiver.py"]
    environment:
      ALERT_WEBHOOK_MAX_EVENTS: ${ALERT_WEBHOOK_MAX_EVENTS:-100}
