name: tanerinal-angular-education
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: education_demo
      MYSQL_USER: education
      MYSQL_PASSWORD: education-password
      MYSQL_ROOT_PASSWORD: local-root-password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: education
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "14202:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for topic in payment-events order-events payment-callback-events payment-reconciliation-events merchant-notification-events payment-events-retry-1m payment-events-retry-5m payment-events-dlq;
        do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1;
        done
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [observability]
    ports: ["19090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.1
    profiles: [observability]
    ports: ["13000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: education-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    restart: unless-stopped

  payment-mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: payment_platform
      MYSQL_USER: payment
      MYSQL_PASSWORD: payment-password
      MYSQL_ROOT_PASSWORD: local-payment-root-password
    ports:
      - "13307:3306"
    volumes:
      - payment-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mock-payment-service:
    build:
      context: ./mock-payment-service
    environment:
      PAYMENT_DATABASE_URL: jdbc:mysql://payment-mysql:3306/payment_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      PAYMENT_DATABASE_USERNAME: payment
      PAYMENT_DATABASE_PASSWORD: payment-password
      PAYMENT_CREDENTIAL_MASTER_KEY: bG9jYWwtZGVtby1rZXktMTIzNDU2Nzg5MC1hYmNkZWY=
      PAYMENT_CHECKOUT_BASE_URL: http://localhost:14201
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_CALLBACK_URL: http://backend:8080/api/payment-notifications/callback
      PAYMENT_CALLBACK_SECRET: demo-platform-callback-secret
    ports:
      - "18082:8080"
    depends_on:
      payment-mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  payment-ui:
    build:
      context: ./mock-payment-ui
    ports:
      - "14201:80"
    depends_on:
      mock-payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/education_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: education
      DATABASE_PASSWORD: education-password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_PLATFORM_BASE_URL: http://mock-payment-service:8080
      PAYMENT_CALLBACK_SECRET: demo-platform-callback-secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "18081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-payment-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "14200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  payment-mysql-data:
  kafka-data:
