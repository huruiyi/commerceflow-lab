    volumes:
      - notification-postgresql-data:/var/lib/postgresql/data
      - ./infrastructure/notification/init-postgresql.sh:/docker-entrypoint-initdb.d/10-notification-role.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          query='SELECT 1';
          if [ "$$NOTIFICATION_POSTGRESQL_FLYWAY_ENABLED" != true ]; then
            query='SELECT 1 FROM customer_notifications LIMIT 0';
          fi;
          PGPASSWORD="$$NOTIFICATION_DATABASE_PASSWORD" psql -h 127.0.0.1
          -U "$$NOTIFICATION_DATABASE_USERNAME" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -XAtqc "$$query"
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

