spring:
  application:
    name: order-service
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3310/orders?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:orders}
    password: ${DATABASE_PASSWORD:orders-password}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    call-setters-on-nulls: true

server:
  port: 8080

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: ${TRACING_EXPORT_TIMEOUT:3s}
          transport: http
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

commerceflow:
  internal-api:
    commerce-secret: ${ORDER_INTERNAL_SECRET:demo-order-internal-secret}
    payment-secret: ${PAYMENT_ORDER_INTERNAL_SECRET:demo-payment-order-internal-secret}
  order:
    accepting-traffic: ${ORDER_ACCEPTING_TRAFFIC:false}
    shadow:
      enabled: ${ORDER_SHADOW_ENABLED:true}
      initial-delay: ${ORDER_SHADOW_INITIAL_DELAY:2s}
      fixed-delay: ${ORDER_SHADOW_FIXED_DELAY:2s}
      audit-delay: ${ORDER_SHADOW_AUDIT_DELAY:30s}
      batch-size: ${ORDER_SHADOW_BATCH_SIZE:500}
      source:
        url: ${ORDER_SOURCE_DATABASE_URL:jdbc:mysql://localhost:3306/commerceflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
        username: ${ORDER_SOURCE_DATABASE_USERNAME:commerceflow}
        password: ${ORDER_SOURCE_DATABASE_PASSWORD:commerceflow-password}
