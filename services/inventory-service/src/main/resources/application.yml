spring:
  application:
    name: inventory-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:inventory}
    password: ${DATABASE_PASSWORD:inventory-password}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 2000
        request.timeout.ms: 3000
        delivery.timeout.ms: 6000

server:
  port: 8080

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: ${TRACING_EXPORT_TIMEOUT:3s}
          transport: http
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

commerceflow:
  inventory:
    accepting-traffic: ${INVENTORY_ACCEPTING_TRAFFIC:false}
    result-delay-lab: ${INVENTORY_RESULT_DELAY_LAB:0s}
  internal-api:
    commerce-secret: ${INVENTORY_INTERNAL_SECRET:demo-inventory-internal-secret}
    payment-secret: ${PAYMENT_INVENTORY_INTERNAL_SECRET:demo-payment-inventory-internal-secret}
    catalog-secret: ${CATALOG_INTERNAL_SECRET:demo-catalog-internal-secret}
    fulfillment-secret: ${FULFILLMENT_INVENTORY_SECRET:demo-fulfillment-inventory-secret}
