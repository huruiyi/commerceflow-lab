spring:
  application:
    name: notification-service
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3307/notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:notification}
    password: ${DATABASE_PASSWORD:notification-password}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      observation-enabled: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8080

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: ${TRACING_EXPORT_TIMEOUT:3s}
          transport: http
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

commerceflow:
  internal-api:
    secret: ${NOTIFICATION_INTERNAL_SECRET:demo-notification-internal-secret}
  notification:
    topic: ${NOTIFICATION_DELIVERY_TOPIC:customer-notification-commands}
    consumer-group: ${NOTIFICATION_CONSUMER_GROUP:commerceflow-independent-notification-v1}
