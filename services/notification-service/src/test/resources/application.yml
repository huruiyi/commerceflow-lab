spring:
  datasource:
    url: jdbc:h2:mem:notification-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  kafka:
    listener:
      auto-startup: false

management:
  tracing:
    export:
      otlp:
        enabled: false
