spring:
  application:
    name: commerce-service
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/commerceflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sessionVariables=innodb_lock_wait_timeout=5}
    username: ${DATABASE_USERNAME:commerceflow}
    password: ${DATABASE_PASSWORD:commerceflow-password}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  session:
    store-type: redis
    redis:
      namespace: commerceflow:session
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:3000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:5000}
    consumer:
      auto-offset-reset: earliest
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:commerceflow}
    password: ${RABBITMQ_PASSWORD:commerceflow-password}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:3s}
    requested-heartbeat: ${RABBITMQ_REQUESTED_HEARTBEAT:30s}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 20
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  health:
    rabbit:
      enabled: ${SCHEDULING_RABBITMQ_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

security:
  remember-me:
    key: ${REMEMBER_ME_KEY:commerceflow-demo-remember-me-key-change-in-production}
    validity-seconds: ${REMEMBER_ME_VALIDITY_SECONDS:1209600}

commerceflow:
  notification:
    delivery:
      mode: ${NOTIFICATION_DELIVERY_MODE:IN_PROCESS}
      topic: ${NOTIFICATION_DELIVERY_TOPIC:customer-notification-commands}
      max-attempts: ${NOTIFICATION_DELIVERY_MAX_ATTEMPTS:5}
      retry-delay: ${NOTIFICATION_DELIVERY_RETRY_DELAY:5s}
      fallback-to-in-process: ${NOTIFICATION_FALLBACK_TO_IN_PROCESS:false}
      publish-initial-delay: ${NOTIFICATION_PUBLISH_INITIAL_DELAY:2s}
      publish-delay: ${NOTIFICATION_PUBLISH_DELAY:1s}
  logistics-platform:
    base-url: ${LOGISTICS_PLATFORM_BASE_URL:http://localhost:18083}
    app-id: ${LOGISTICS_APP_ID:commerceflow-storefront}
    request-secret: ${LOGISTICS_REQUEST_SECRET:demo-logistics-request-secret}
    callback-secret: ${LOGISTICS_CALLBACK_SECRET:demo-logistics-callback-secret}
    callback-url: ${LOGISTICS_CALLBACK_URL:http://localhost:18081/api/logistics-notifications/callback}
    reconciliation:
      enabled: ${LOGISTICS_RECONCILIATION_ENABLED:true}
      initial-delay: ${LOGISTICS_RECONCILIATION_INITIAL_DELAY:30s}
      scan-interval: ${LOGISTICS_RECONCILIATION_SCAN_INTERVAL:1m}
      stale-after: ${LOGISTICS_RECONCILIATION_STALE_AFTER:5m}
      batch-size: ${LOGISTICS_RECONCILIATION_BATCH_SIZE:100}
  order-lifecycle:
    payment-timeout: ${ORDER_PAYMENT_TIMEOUT:30m}
    auto-receive-after-delivery: ${ORDER_AUTO_RECEIVE_AFTER_DELIVERY:7d}
    auto-complete-after-receipt: ${ORDER_AUTO_COMPLETE_AFTER_RECEIPT:7d}
  payment-platform:
    base-url: ${PAYMENT_PLATFORM_BASE_URL:http://localhost:18082}
    callback-secret: ${PAYMENT_CALLBACK_SECRET:demo-platform-callback-secret}
  payment-cancellation-crash-lab:
    enabled: ${PAYMENT_CANCELLATION_CRASH_LAB_ENABLED:false}
    order-id: ${PAYMENT_CANCELLATION_CRASH_LAB_ORDER_ID:1}
    phase: ${PAYMENT_CANCELLATION_CRASH_LAB_PHASE:AFTER_CANCELLATION_BEGIN}
    pause: ${PAYMENT_CANCELLATION_CRASH_LAB_PAUSE:5m}
  scheduling:
    enabled: true
    mq-crash-lab:
      enabled: ${SCHEDULING_MQ_CRASH_LAB_ENABLED:false}
      task-id: ${SCHEDULING_MQ_CRASH_LAB_TASK_ID:1}
      pause: ${SCHEDULING_MQ_CRASH_LAB_PAUSE:5m}
    default-policy:
      enabled: false
      primary-trigger: DATABASE
      reconciliation-enabled: true
      grace-period: 2m
      claim-lease: 2m
      max-attempts: 5
      retry-delay: 30s
    task-policies:
      PAYMENT_TIMEOUT: { enabled: true, primary-trigger: DATABASE, reconciliation-enabled: true, grace-period: 2m, claim-lease: 2m, max-attempts: 5, retry-delay: 30s }
      AUTO_RECEIVE: { enabled: true, primary-trigger: DATABASE, reconciliation-enabled: true, grace-period: 5m, claim-lease: 2m, max-attempts: 5, retry-delay: 1m }
      AUTO_COMPLETE: { enabled: true, primary-trigger: DATABASE, reconciliation-enabled: true, grace-period: 5m, claim-lease: 2m, max-attempts: 5, retry-delay: 1m }
      REFUND_RECONCILIATION: { enabled: false, primary-trigger: DATABASE, reconciliation-enabled: true, grace-period: 30s, claim-lease: 2m, max-attempts: 10, retry-delay: 30s }
      PAYMENT_RECONCILIATION: { enabled: false, primary-trigger: DATABASE, reconciliation-enabled: true, grace-period: 30s, claim-lease: 2m, max-attempts: 10, retry-delay: 30s }
      LOGISTICS_RECONCILIATION: { enabled: false, primary-trigger: DATABASE, reconciliation-enabled: true, grace-period: 5m, claim-lease: 2m, max-attempts: 10, retry-delay: 1m }
      NOTIFICATION_RETRY: { enabled: false, primary-trigger: DATABASE, reconciliation-enabled: true, grace-period: 30s, claim-lease: 1m, max-attempts: 10, retry-delay: 30s }
      REVIEW_REMINDER: { enabled: false, primary-trigger: DATABASE, reconciliation-enabled: false, grace-period: 5m, claim-lease: 1m, max-attempts: 3, retry-delay: 5m }
      INVENTORY_RELEASE: { enabled: false, primary-trigger: DATABASE, reconciliation-enabled: true, grace-period: 30s, claim-lease: 1m, max-attempts: 5, retry-delay: 30s }
      AFTER_SALE_DEADLINE: { enabled: false, primary-trigger: DATABASE, reconciliation-enabled: true, grace-period: 5m, claim-lease: 2m, max-attempts: 5, retry-delay: 1m }
    database-scan:
      initial-delay: ${SCHEDULING_DATABASE_INITIAL_DELAY:10s}
      fixed-delay: ${SCHEDULING_DATABASE_FIXED_DELAY:15s}
      batch-size: ${SCHEDULING_DATABASE_BATCH_SIZE:100}
    lease-recovery:
      initial-delay: ${SCHEDULING_LEASE_RECOVERY_INITIAL_DELAY:30s}
      fixed-delay: ${SCHEDULING_LEASE_RECOVERY_FIXED_DELAY:30s}
      batch-size: ${SCHEDULING_LEASE_RECOVERY_BATCH_SIZE:100}
    reconciliation:
      initial-delay: ${SCHEDULING_RECONCILIATION_INITIAL_DELAY:30s}
      fixed-delay: ${SCHEDULING_RECONCILIATION_FIXED_DELAY:5m}
      batch-size: ${SCHEDULING_RECONCILIATION_BATCH_SIZE:100}
    rabbitmq:
      enabled: ${SCHEDULING_RABBITMQ_ENABLED:false}
      publish-initial-delay: ${SCHEDULING_RABBITMQ_PUBLISH_INITIAL_DELAY:2s}
      publish-fixed-delay: ${SCHEDULING_RABBITMQ_PUBLISH_FIXED_DELAY:1s}
      publish-batch-size: ${SCHEDULING_RABBITMQ_PUBLISH_BATCH_SIZE:100}
      publisher-confirm-timeout: ${SCHEDULING_RABBITMQ_CONFIRM_TIMEOUT:5s}
      delay-exchange: ${SCHEDULING_RABBITMQ_DELAY_EXCHANGE:commerceflow.scheduled-task.delay}
      ready-exchange: ${SCHEDULING_RABBITMQ_READY_EXCHANGE:commerceflow.scheduled-task.ready}
      dead-exchange: ${SCHEDULING_RABBITMQ_DEAD_EXCHANGE:commerceflow.scheduled-task.dead}
      ready-queue: ${SCHEDULING_RABBITMQ_READY_QUEUE:commerceflow.scheduled-task.ready}
      dead-queue: ${SCHEDULING_RABBITMQ_DEAD_QUEUE:commerceflow.scheduled-task.dead}
      ready-routing-key: ${SCHEDULING_RABBITMQ_READY_ROUTING_KEY:scheduled-task.ready}
      dead-routing-key: ${SCHEDULING_RABBITMQ_DEAD_ROUTING_KEY:scheduled-task.dead}
      delay-buckets: ${SCHEDULING_RABBITMQ_DELAY_BUCKETS:1s,5s,30s,5m,30m,2h,1d}
    rocketmq:
      enabled: ${SCHEDULING_ROCKETMQ_ENABLED:false}
      endpoints: ${SCHEDULING_ROCKETMQ_ENDPOINTS:localhost:8081}
      topic: ${SCHEDULING_ROCKETMQ_TOPIC:commerceflow-scheduled-task}
      consumer-group: ${SCHEDULING_ROCKETMQ_CONSUMER_GROUP:commerceflow-scheduled-task-consumer}
      tag: ${SCHEDULING_ROCKETMQ_TAG:SCHEDULED_TASK}
      request-timeout: ${SCHEDULING_ROCKETMQ_REQUEST_TIMEOUT:5s}
      publish-initial-delay: ${SCHEDULING_ROCKETMQ_PUBLISH_INITIAL_DELAY:2s}
      publish-fixed-delay: ${SCHEDULING_ROCKETMQ_PUBLISH_FIXED_DELAY:1s}
      publish-batch-size: ${SCHEDULING_ROCKETMQ_PUBLISH_BATCH_SIZE:100}
resilience4j:
  retry:
    instances:
      paymentPlatform: { max-attempts: 3, wait-duration: 250ms }
  circuitbreaker:
    instances:
      paymentPlatform: { sliding-window-size: 10, minimum-number-of-calls: 5, failure-rate-threshold: 50, wait-duration-in-open-state: 15s }
  bulkhead:
    instances:
      paymentPlatform: { max-concurrent-calls: 20, max-wait-duration: 0 }
