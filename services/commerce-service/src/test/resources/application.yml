spring:
  datasource:
    url: jdbc:h2:mem:commerceflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  data:
    redis:
      repositories:
        enabled: false
  session:
    store-type: none

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

security:
  remember-me:
    key: commerceflow-test-remember-me-key
    validity-seconds: 1209600

commerceflow:
  notification:
    delivery:
      mode: IN_PROCESS
      publish-initial-delay: 1h
      publish-delay: 1h
    projection:
      enabled: false
      minimum-matched-events: 1
      required-consecutive-passing-checks: 3
      check-initial-delay: 1h
      check-delay: 1h
  logistics-platform:
    reconciliation:
      enabled: false
      initial-delay: 1h
      scan-interval: 1h
      stale-after: 5m
      batch-size: 100
  order-lifecycle:
    payment-timeout: 30m
    auto-receive-after-delivery: 1s
    auto-complete-after-receipt: 1s
  outbox:
    initial-delay: 3600000
  reconciliation:
    initial-delay: 3600000
  scheduling:
    database-scan:
      initial-delay: 1h
      fixed-delay: 1h
    lease-recovery:
      initial-delay: 1h
      fixed-delay: 1h
    reconciliation:
      initial-delay: 1h
      fixed-delay: 1h
    task-policies:
      PAYMENT_TIMEOUT:
        enabled: true
        primary-trigger: DATABASE
        reconciliation-enabled: true
        grace-period: 0s
        claim-lease: 30s
        max-attempts: 3
        retry-delay: 1s
      AUTO_RECEIVE:
        enabled: true
        primary-trigger: DATABASE
        reconciliation-enabled: true
        grace-period: 0s
        claim-lease: 30s
        max-attempts: 3
        retry-delay: 1s
      AUTO_COMPLETE:
        enabled: true
        primary-trigger: DATABASE
        reconciliation-enabled: true
        grace-period: 0s
        claim-lease: 30s
        max-attempts: 3
        retry-delay: 1s
      REVIEW_REMINDER:
        enabled: true
        primary-trigger: DATABASE
        reconciliation-enabled: true
        grace-period: 0s
        claim-lease: 30s
        max-attempts: 3
        retry-delay: 1s
