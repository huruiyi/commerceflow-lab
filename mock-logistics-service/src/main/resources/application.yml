spring:
  application:
    name: mock-logistics-service
  datasource:
    url: ${LOGISTICS_DATABASE_URL:jdbc:mysql://localhost:13308/logistics_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${LOGISTICS_DATABASE_USERNAME:logistics}
    password: ${LOGISTICS_DATABASE_PASSWORD:logistics-password}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logistics-platform:
  app-id: ${LOGISTICS_APP_ID:commerceflow-storefront}
  request-secret: ${LOGISTICS_REQUEST_SECRET:demo-logistics-request-secret}
  callback-secret: ${LOGISTICS_CALLBACK_SECRET:demo-logistics-callback-secret}
  callback-url: ${LOGISTICS_CALLBACK_URL:http://backend:8080/api/logistics-notifications/callback}
  allowed-skew: ${LOGISTICS_ALLOWED_SKEW:5m}
  callback-delivery:
    enabled: ${LOGISTICS_CALLBACK_DELIVERY_ENABLED:true}
    initial-delay: ${LOGISTICS_CALLBACK_DELIVERY_INITIAL_DELAY:2s}
    scan-interval: ${LOGISTICS_CALLBACK_DELIVERY_SCAN_INTERVAL:1s}
    retry-delay: ${LOGISTICS_CALLBACK_DELIVERY_RETRY_DELAY:2s}
    claim-lease: ${LOGISTICS_CALLBACK_DELIVERY_CLAIM_LEASE:30s}
    connect-timeout: ${LOGISTICS_CALLBACK_DELIVERY_CONNECT_TIMEOUT:2s}
    read-timeout: ${LOGISTICS_CALLBACK_DELIVERY_READ_TIMEOUT:3s}
    batch-size: ${LOGISTICS_CALLBACK_DELIVERY_BATCH_SIZE:50}
    max-attempts: ${LOGISTICS_CALLBACK_DELIVERY_MAX_ATTEMPTS:10}
  automation:
    enabled: ${LOGISTICS_AUTO_PROGRESS_ENABLED:false}
    initial-delay: ${LOGISTICS_AUTO_PROGRESS_INITIAL_DELAY:10s}
    scan-interval: ${LOGISTICS_AUTO_PROGRESS_SCAN_INTERVAL:5s}
    step-interval: ${LOGISTICS_AUTO_PROGRESS_STEP_INTERVAL:5m}
    batch-size: ${LOGISTICS_AUTO_PROGRESS_BATCH_SIZE:100}
