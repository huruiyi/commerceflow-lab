<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>商流实验室 · 门户交互原型</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f7f8f5;
        --paper: #fff;
        --ink: #172723;
        --muted: #52615b;
        --green: #17664d;
        --green-dark: #10533d;
        --green-soft: #e9f2ed;
        --surface-soft: #f7f9f7;
        --line: #dce5df;
        --control-line: #aebeb5;
        --shell: 1320px;
        --gutter: clamp(0.85rem, 2.6vw, 2rem);
        --risk: #a04030;
        --amber: #76531a;
        --light-amber: #f9f0da;
        font:
          16px/1.5 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          "Noto Sans",
          Arial,
          sans-serif;
        color: var(--ink);
        background: var(--canvas);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-size: 0.875rem;
      }
      a {
        color: var(--green);
        text-underline-offset: 3px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      input,
      select,
      textarea {
        min-height: 38px;
        width: 100%;
        padding: 0 12px;
        border: 1px solid var(--control-line);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
      }
      textarea {
        display: block;
        min-height: 6rem;
        padding-block: 0.6rem;
        font: inherit;
        resize: vertical;
      }
      input::placeholder {
        color: #697771;
      }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      button,
      .button {
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover,
      .button:hover {
        background: #edf3ed;
      }
      .primary {
        background: var(--green);
        border-color: var(--green);
        color: white;
        font-weight: 650;
      }
      .primary:hover {
        background: var(--green-dark);
      }
      button:disabled {
        opacity: 0.48;
        cursor: default;
      }
      .link {
        padding: 0;
        border: 0;
        min-height: 32px;
        background: transparent;
        color: var(--green);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .danger {
        color: var(--risk);
      }
      .site-header {
        position: relative;
        z-index: 2;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .header-inner {
        min-height: 58px;
        margin: auto;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 750;
        white-space: nowrap;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border-radius: 8px;
        background: var(--green);
        color: #fff;
      }
      .icon {
        width: 1em;
        height: 1em;
        flex: 0 0 auto;
        fill: currentColor;
        vertical-align: -0.12em;
      }
      .icon-library {
        position: absolute;
      }
      .portal-nav {
        display: flex;
        align-items: center;
        gap: 0.15rem;
        min-width: 0;
        flex: 1;
      }
      .nav-link,
      .nav-tools summary {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        min-height: 34px;
        padding: 0.35rem 0.55rem;
        border-radius: 7px;
        color: var(--muted);
        font-weight: 550;
        text-decoration: none;
      }
      .nav-link:hover,
      .nav-link[aria-current],
      .nav-menu.active > summary {
        background: var(--green-soft);
        color: var(--green);
      }
      .nav-menu {
        position: relative;
      }
      .nav-menu summary {
        cursor: pointer;
        list-style: none;
        white-space: nowrap;
      }
      .nav-menu summary::-webkit-details-marker {
        display: none;
      }
      .nav-popover {
        position: absolute;
        top: calc(100% + 0.45rem);
        right: 0;
        min-width: 12rem;
        max-height: min(65vh, 30rem);
        overflow: auto;
        padding: 0.35rem;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--paper);
        box-shadow: 0 12px 26px rgb(23 39 35 / 12%);
      }
      .nav-popover .nav-link {
        white-space: nowrap;
      }
      .nav-menu-label {
        margin: 0;
        padding: 0.35rem 0.55rem;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .nav-menu-label:not(:first-child) {
        border-top: 1px solid var(--line);
        margin-top: 0.25rem;
      }
      .nav-tools {
        margin-inline-start: auto;
      }
      .nav-tools summary {
        border: 1px solid var(--line);
        border-radius: 9px;
        color: var(--ink);
        background: var(--paper);
        font-weight: 650;
      }
      .role-avatar {
        display: grid;
        place-items: center;
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 0.4rem;
        color: var(--green);
        background: var(--green-soft);
        font-size: 0.75rem;
      }
      .navigation-toggle {
        display: none;
      }
      .header-inner,
      .shell {
        width: min(calc(100% - var(--gutter) * 2), var(--shell));
        margin-inline: auto;
      }
      .operations {
        min-width: 0;
        padding: clamp(1rem, 3vw, 1.6rem) 0 3rem;
      }
      .page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 18px;
      }
      .page-head p {
        margin: 4px 0 0;
        color: var(--muted);
      }
      h1,
      h2,
      h3 {
        margin: 0;
        line-height: 1.27;
        letter-spacing: -0.025em;
      }
      h1 {
        font-size: clamp(1.375rem, 2vw, 1.6875rem);
        font-weight: 680;
      }
      h2 {
        font-size: 17px;
        font-weight: 730;
      }
      h3 {
        font-size: 14px;
        font-weight: 730;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .panel {
        min-width: 0;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 0.75rem;
      }
      .panel-head,
      .pad {
        padding: 16px 18px;
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .panel-head + *:not(.scroll-table) {
        border-top: 1px solid var(--line);
      }
      .subtle {
        color: var(--muted);
      }
      .subtle p,
      p.subtle {
        margin: 4px 0 0;
      }
      .compact {
        font-size: 12px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        vertical-align: middle;
        padding: 3px 8px;
        border-radius: 20px;
        font-size: 12px;
        line-height: 1.25;
        font-weight: 700;
        color: #4d5a54;
        background: #edf0ed;
        white-space: nowrap;
      }
      .badge::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 100%;
        background: currentColor;
      }
      .positive {
        color: var(--green-dark);
        background: var(--green-soft);
      }
      .pending {
        color: var(--amber);
        background: var(--light-amber);
      }
      .negative {
        color: var(--risk);
        background: #f9e9e5;
      }
      .new {
        color: #52615b;
        background: #eef2ee;
      }
      .actions,
      .row-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .row-actions {
        flex-wrap: nowrap;
        gap: 15px;
      }
      .toolbar {
        display: flex;
        align-items: end;
        flex-wrap: wrap;
        gap: 10px;
      }
      .toolbar label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }
      .toolbar label input,
      .toolbar label select {
        font-size: 14px;
        font-weight: 400;
      }
      .toolbar .wide {
        flex: 1 1 245px;
      }
      .catalog-filters {
        display: grid;
        grid-template-columns: minmax(11rem, 1.9fr) minmax(18rem, 2.25fr) auto;
        align-items: end;
        gap: 0.75rem;
        padding: 0.875rem 1rem;
      }
      .filter-controls {
        display: grid;
        grid-template-columns: minmax(7rem, 1fr) minmax(9rem, 1.25fr);
        gap: 0.75rem;
        min-width: 0;
      }
      .results-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 1rem 0 0.75rem;
      }
      .catalog-filters label {
        display: grid;
        gap: 0.25rem;
        min-width: 0;
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 550;
      }
      .search-field {
        position: relative;
      }
      .search-field .icon {
        position: absolute;
        inset: 0.75rem auto auto 0.65rem;
        color: var(--muted);
        pointer-events: none;
      }
      .search-field input {
        padding-inline-start: 2rem;
      }
      .catalog-filters .filter-toggle {
        display: none;
      }
      .price-range,
      .split {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .results-head select {
        width: auto;
        min-height: 34px;
      }
      .results-head p {
        margin: 0;
        color: var(--muted);
      }
      .results-head strong {
        color: var(--ink);
      }
      .active-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: -2px 0 12px;
      }
      .active-filters button {
        min-height: 26px;
        padding: 0 8px;
        border-color: #c6ddd0;
        background: var(--green-soft);
        color: var(--green-dark);
        font-size: 12px;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.875rem;
      }
      .product-card {
        overflow: hidden;
      }
      .product-card > a {
        text-decoration: none;
        color: var(--ink);
        display: block;
      }
      .product-card:hover {
        border-color: #99baab;
      }
      .product-photo {
        position: relative;
        aspect-ratio: 4 / 3;
        background: #eaf0e9;
        color: #526157;
        overflow: hidden;
      }
      .photo-crop {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 100%;
        aspect-ratio: 1;
        background: url("../../web/commerce-portal/angular/src/assets/demo-product-photography.jpg")
          no-repeat;
        background-size: 300% 200%;
      }
      .photo-laptop {
        background-position: 0 0;
      }
      .photo-keyboard {
        background-position: 50% 0;
      }
      .photo-monitor {
        background-position: 100% 0;
      }
      .photo-hub {
        background-position: 0 100%;
      }
      .photo-headphones {
        background-position: 50% 100%;
      }
      .photo-notebook {
        background-position: 100% 100%;
      }
      .product-card .pad {
        padding: 0.85rem 0.95rem 0.95rem;
        display: grid;
        gap: 4px;
      }
      .product-card h2 {
        font-size: 1rem;
        font-weight: 650;
      }
      .product-brief {
        display: -webkit-box;
        margin: 0;
        color: var(--muted);
        font-size: 0.8125rem;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .rating {
        color: var(--muted);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
      }
      .store-intro {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .store-intro p {
        margin: 0;
        color: var(--muted);
      }
      .store-mark {
        display: grid;
        place-items: center;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 0.6rem;
        background: var(--green-soft);
        color: var(--green);
        font-size: 1.2rem;
      }
      .product-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }
      .price {
        color: var(--green);
        font-weight: 680;
        font-size: 1.125rem;
        font-variant-numeric: tabular-nums;
      }
      .breadcrumbs {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        color: var(--muted);
        margin-bottom: 15px;
      }
      .detail {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 36px;
        padding: 22px;
      }
      .gallery .product-photo {
        aspect-ratio: 1.45;
        border-radius: 8px;
      }
      .buy-box {
        align-self: center;
        min-width: 0;
        padding: 4px 8px 4px 0;
      }
      .buy-box h1 {
        margin: 4px 0 10px;
      }
      .buy-box .price {
        margin: 17px 0 12px;
        font-size: 30px;
        line-height: 1;
      }
      .buy-box .description {
        color: var(--muted);
        margin: 0 0 16px;
      }
      .buy-box form {
        margin-top: 16px;
      }
      .buy-box input {
        width: 90px;
      }
      .stock {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .reviews {
        margin-top: 18px;
      }
      .review {
        display: grid;
        grid-template-columns: minmax(115px, 170px) 1fr;
        gap: 15px;
        padding: 13px 18px;
      }
      .review + .review {
        border-top: 1px solid var(--line);
      }
      .review p {
        margin: 4px 0;
      }
      .stars {
        color: #82560a;
        letter-spacing: 2px;
      }
      .pagination {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }
      .pagination button {
        min-height: 32px;
      }
      .split-admin {
        display: grid;
        gap: 15px;
        grid-template-columns: minmax(225px, 0.53fr) minmax(0, 1fr);
        align-items: start;
      }
      .queue-row {
        width: 100%;
        min-height: 59px;
        border: 0;
        border-radius: 0;
        border-top: 1px solid var(--line);
        justify-content: space-between;
        text-align: left;
      }
      .queue-row.selected {
        background: #edf5ee;
        border-left: 3px solid var(--green);
        padding-left: 11px;
      }
      .queue .panel {
        overflow: hidden;
      }
      .datagrid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 0;
      }
      .datagrid dt {
        color: var(--muted);
        font-size: 12px;
      }
      .datagrid dd {
        margin: 4px 0 0;
        font-weight: 680;
      }
      .scroll-table {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th,
      td {
        padding: 10px 14px;
        border-top: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        font-size: 12px;
        color: var(--muted);
        background: #f8faf7;
        text-wrap: nowrap;
      }
      td small {
        display: block;
        color: var(--muted);
        margin-top: 3px;
      }
      .selected-row td {
        background: #f2f7f1;
      }
      .empty {
        display: grid;
        place-content: center;
        text-align: center;
        min-height: 170px;
        padding: 20px;
        color: var(--muted);
      }
      .empty strong {
        color: var(--ink);
      }
      .timeline {
        list-style: none;
        margin: 13px 0 0 4px;
        padding: 0;
      }
      .timeline li {
        position: relative;
        padding: 0 0 14px 16px;
        border-left: 1px solid #cbdace;
      }
      .timeline li:last-child {
        padding-bottom: 0;
      }
      .timeline li::before {
        content: "";
        position: absolute;
        left: -4px;
        top: 5px;
        width: 7px;
        height: 7px;
        border: 1px solid var(--green);
        background: #fff;
        border-radius: 50%;
      }
      .timeline li:first-child::before {
        background: var(--green);
      }
      .timeline time {
        display: block;
        font-size: 12px;
        color: var(--muted);
      }
      .note {
        background: #f0f5ee;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 11px 14px;
        color: var(--muted);
      }
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        max-width: min(400px, calc(100% - 40px));
        background: var(--green-dark);
        color: #fff;
        border-radius: 8px;
        padding: 12px 16px;
        box-shadow: 0 6px 22px #104e3b33;
        z-index: 10;
      }
      .numeric {
        font-size: 0.9375rem;
        font-weight: 600;
        font-variant-numeric: lining-nums tabular-nums;
        overflow-wrap: anywhere;
      }
      .number-copy {
        display: inline-flex;
        align-items: center;
        gap: 0.2rem;
        min-width: 0;
        max-width: 100%;
      }
      .copy-button {
        flex: 0 0 1.7rem;
        min-height: 1.7rem;
        padding: 0;
        border-color: transparent;
        color: var(--green);
        background: transparent;
      }
      .order-copy {
        min-height: 38px;
        padding-inline: 0.65rem;
      }
      .invoice-detail {
        display: grid;
        gap: 0.875rem;
        max-width: 74rem;
        margin: auto;
      }
      .invoice-detail .panel {
        padding: clamp(0.875rem, 2vw, 1.25rem);
      }
      .invoice-detail .badge::before {
        display: none;
      }
      .invoice-detail-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.35rem 0.75rem;
      }
      .invoice-order {
        grid-column: 1 / -1;
      }
      .invoice-back {
        display: inline-flex;
        gap: 0.4rem;
        align-items: center;
        margin-bottom: 0.25rem;
        text-decoration: none;
      }
      .invoice-back:hover {
        text-decoration: underline;
      }
      .field-line {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.1rem 0.55rem;
        margin: 0;
      }
      .field-line dt,
      .invoice-facts dt {
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 550;
      }
      .field-line dd,
      .invoice-facts dd {
        min-width: 0;
        margin: 0;
      }
      .invoice-application-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 0.35rem 0.75rem;
      }
      .invoice-application-head h2,
      .invoice-detail h2 {
        margin-bottom: 0.5rem;
      }
      .invoice-facts {
        display: grid;
        grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr));
        gap: 0.6rem;
        margin: 0.85rem 0 0;
      }
      .invoice-facts > div,
      .red-records > li {
        min-width: 0;
        padding: 0.75rem 0.85rem;
        border: 1px solid var(--line);
        border-radius: 0.55rem;
        background: var(--surface-soft);
      }
      .invoice-facts dd {
        margin-top: 0.25rem;
      }
      .red-records {
        display: grid;
        gap: 0.6rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .red-records .invoice-facts {
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.65fr) minmax(
            0,
            1fr
          );
        margin: 0;
      }
      .red-records .invoice-facts > div {
        padding: 0;
        border: 0;
        background: none;
      }
      .red-amount {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.35rem 0.65rem;
      }
      .order-product-cell {
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }
      .order-thumb {
        flex: 0 0 3rem;
        border: 1px solid var(--line);
        border-radius: 0.45rem;
      }
      .order-value {
        display: grid;
        justify-items: end;
        gap: 0.3rem;
      }
      .order-list-table th:nth-child(3) {
        text-align: right;
      }
      .order-date {
        display: grid;
        justify-items: start;
        gap: 0.1rem;
        text-align: left;
      }
      .order-match {
        margin: 0;
        padding: 0.6rem 1rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }
      .order-expanded td {
        background: var(--surface-soft);
      }
      .store-profile {
        display: grid;
        gap: 1rem;
        max-width: 58rem;
      }
      .store-profile label {
        display: grid;
        gap: 0.4rem;
        font-weight: 550;
      }
      .store-profile .store-intro {
        margin-bottom: 0;
      }
      .store-profile .actions {
        justify-content: flex-end;
      }
      dialog {
        max-width: min(540px, calc(100% - 32px));
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px;
        color: var(--ink);
      }
      dialog::backdrop {
        background: #14262066;
      }
      dialog label {
        display: grid;
        gap: 5px;
        margin: 10px 0;
      }
      dialog footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
      @media (max-width: 1020px) {
        .product-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 940px) {
        .header-inner {
          padding-block: 0.5rem;
          flex-wrap: wrap;
          gap: 8px;
        }
        .nav-tools {
          order: 1;
        }
        .navigation-toggle {
          order: 2;
          display: inline-flex;
          width: 34px;
          min-height: 34px;
          padding: 0;
          font-size: 1rem;
        }
        .portal-nav {
          order: 3;
          flex: 1 0 100%;
          display: none;
          flex-wrap: wrap;
          padding-top: 0.35rem;
          border-top: 1px solid var(--line);
        }
        .portal-nav.is-open {
          display: flex;
        }
        .portal-nav .nav-menu {
          position: static;
        }
        .portal-nav .nav-popover {
          top: 100%;
          right: var(--gutter);
          left: var(--gutter);
        }
      }
      @media (max-width: 760px) {
        .red-records .invoice-facts {
          grid-template-columns: minmax(0, 1fr);
        }
        .catalog-filters {
          grid-template-columns: minmax(0, 1fr);
        }
        .catalog-filters .filter-toggle {
          display: inline-flex;
          justify-self: start;
        }
        .catalog-filters:not(.expanded) .filter-controls {
          display: none;
        }
        .filter-controls {
          grid-template-columns: minmax(0, 1fr);
        }
        .detail,
        .split-admin {
          display: block;
        }
        .product-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0.625rem;
        }
        .product-card .pad {
          padding: 9px;
        }
        .product-meta {
          flex-wrap: wrap;
        }
        .detail {
          padding: 14px;
        }
        .buy-box {
          padding: 14px 0 0;
        }
        .queue {
          margin-bottom: 14px;
        }
        .review {
          grid-template-columns: 1fr;
          gap: 4px;
        }
        .datagrid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 620px) {
        .invoice-facts {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .invoice-facts > :first-child {
          grid-column: 1 / -1;
        }
        .order-list-table thead {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
        }
        .order-list-table,
        .order-list-table tbody {
          display: block;
        }
        .order-list-table tr {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          padding: 0.65rem;
          border-top: 1px solid var(--line);
        }
        .order-list-table td {
          min-width: 0;
          border: 0;
        }
        .order-list-table td:first-child,
        .order-list-table td:last-child {
          grid-column: 1 / -1;
        }
      }
      @media (max-width: 390px) {
        .split {
          grid-template-columns: 1fr;
        }
        th,
        td {
          padding: 8px 10px;
        }
      }
    </style>

      function route() {
        const [candidate, view, id] = location.hash.slice(1).split("/");
        const role = Object.hasOwn(roles, candidate) ? candidate : "visitor";
        return [role, view || homes[role], id];
      }
      function render() {
        const [role, view, id] = route();
        renderNavigation(role, view);
        const buyer = role === "visitor" || role === "customer";
        const adminScreens = {
          stores: storesPage,
          inventory: inventoryPage,
          exchanges: exchangesPage,
          scheduling: schedulingPage,
        };
        let content;
        if (view === "product") content = productPage(role, id);
        else if (
          view === "catalog" ||
          view === "public-store" ||
          (buyer && view === "store")
        )
          content = results(role, view !== "catalog");
        else if (
          view === "orders" &&
          (role === "customer" || role === "merchant")
        )
          content = ordersPage(role);
        else if (view === "invoices" && role !== "visitor")
          content = invoicesPage(role);
        else if (view === "invoice" && role !== "visitor")
          content = invoicePage(role, id);
        else if (view === "store" && role === "merchant")
          content = storeProfile();
        else if (
          view === "settlements" &&
          (role === "merchant" || role === "admin")
        )
          content = settlementsPage(role, role === "admin" ? id : undefined);
        else if (
          view === "statement" &&
          (role === "merchant" || role === "admin")
        )
          content = statementPage(role, id);
        else if (view === "cart" && role === "customer") content = cartPage();
        else if (role === "admin" && Object.hasOwn(adminScreens, view))
          content = adminScreens[view]();
        else if (
          menus[role].some(([key]) => key === view) &&
          Object.hasOwn(simplePages, view)
        )
          content = simplePages[view]();
        else content = buyer ? results(role, false) : empty("请选择工作区页面");
        app.innerHTML =
          '<main id="content" tabindex="-1" class="operations">' +
          content +
          "</main>";
        const sort = app.querySelector('select[name="sort"]');
        if (sort) sort.setAttribute("aria-label", "商品排序");

      function restoreFocus(value, selector) {
        const element = document.querySelector(
          selector || '[data-action="' + value + '"]',
        );
        if (element) element.focus({ preventScroll: true });

      const approvalActions = ["approve", "reject", "disable", "enable"];
      let copiedButton;
      let copyTimer;
      document.addEventListener("click", async (event) => {
        const control = event.target.closest("[data-copy]");
        if (!control) return;
        try {
          await navigator.clipboard.writeText(
            control.dataset.copy.toLowerCase(),
          );
          if (!control.isConnected) return;
          if (copiedButton)
            copiedButton.querySelector("svg").outerHTML = icon("copy");
          clearTimeout(copyTimer);
          copiedButton = control;
          control.querySelector("svg").outerHTML = icon("check2");
          toast("号码已复制");
          copyTimer = setTimeout(() => {
            control.querySelector("svg").outerHTML = icon("copy");
            copiedButton = null;
          }, 1500);
        } catch {
          toast("复制失败，请选中号码手动复制");
        }
      });
      document.addEventListener("click", (event) => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (!action) return;
        event.preventDefault();
        const [role, view] = route();
        if (action === "reviews") {
          document
            .querySelector("#product-reviews")
            .scrollIntoView({ behavior: "smooth" });
          return;
        }
        if (action === "dismiss") return dialog.close();
        if (action === "reset-filters")
          state.filters = { query: "", store: "", min: "", max: "", sort: "" };
        else if (action === "clear-orders") {
          state.orderQuery = "";
          state.orderStatus = "";
          state.expandedOrder = "";
        } else if (action === "statement-report")
          state.settlementReport = !state.settlementReport;
        else if (action.startsWith("expand-order-")) {
          const id = action.slice("expand-order-".length);
          state.expandedOrder = state.expandedOrder === id ? "" : id;
        } else if (action === "toggle-filters")
          state.filtersOpen = !state.filtersOpen;
        else if (action.startsWith("clear-filter-"))
          state.filters[action.slice("clear-filter-".length)] = "";
        else if (action === "review-prev")
          state.reviewPage = Math.max(0, state.reviewPage - 1);
        else if (action === "review-next")
          state.reviewPage = Math.min(1, state.reviewPage + 1);
        else if (action.startsWith("inventory-"))
          state.inventory = Number(action.split("-")[1]);
        else if (action.startsWith("exchange-"))
          state.exchange = Number(action.split("-")[1]);
        else if (action.startsWith("remove-"))
          delete state.cart[action.split("-")[1]];
        else if (action === "refresh") return toast("已刷新示例数据");
        else if (action === "create-store")
          return modal(
            "创建商家账号",
            input("商家姓名", "merchant") +
              input("邮箱", "email", "", "", "email") +

                ["", "数据库对账"],
                ["rabbitmq", "RabbitMQ 延迟队列"],
              ]),
            "保存",
          );
        else if (
          approvalActions.some((prefix) => action.startsWith(prefix + "-"))
        ) {
          state.pendingStoreAction = action;
          const [verb, id] = action.split("-");
          const names = {
            approve: "通过",
            reject: "拒绝",
            disable: "停用",
            enable: "启用",
          };

            names[verb] + "店铺",

              escapeHtml(stores.find((s) => s.id === Number(id)).name) +

              input("处理说明", "reason"),

        } else if (action.startsWith("settlements-")) {
          location.hash = goto(
            "admin",
            "settlements",
            action.slice("settlements-".length),
          );
          return;
        } else {
          const reference = escapeHtml(action.split("-").slice(1).join("-"));
          const names = {
            task: "任务实例",
            invoice: "发票详情",
            order: "订单详情",
            product: "商品信息",
            stock: "库存流水",
            record: "业务凭证",
            retry: "投递请求",
          };
          const title = names[action.split("-")[0]] || "业务详情";
          return modal(
            title,
            "<p>业务编号 <strong>" +
              reference +
              '</strong></p><p class="subtle">示例数据</p>',
            "关闭",
          );
        }
        render();
        if (action.startsWith("clear-filter-")) restoreFocus("reset-filters");
        else if (action === "review-next") restoreFocus("review-prev");
        else if (action === "review-prev") restoreFocus("review-next");
        else if (view) restoreFocus(action);

      document.addEventListener("change", (event) => {
        if (event.target.name === "sort") {

          restoreFocus(null, 'select[name="sort"]');
        }
      });
      document.addEventListener("submit", (event) => {
        const form = event.target;
        const data = Object.fromEntries(new FormData(form));
        const [role] = route();
        if (!form.id) return;
        event.preventDefault();
        switch (form.id) {
          case "catalog-filters":
            if (data.min && data.max && Number(data.min) > Number(data.max))
              return toast("最低价不能高于最高价");
            Object.assign(state.filters, data);
            state.filtersOpen = false;
            break;
          case "store-filter":
            state.storeQuery = data.query;
            state.storeStatus = data.status;
            break;
          case "exchange-filter":
            state.exchangeQuery = data.query.trim();
            break;
          case "invoice-filter":
            state.invoiceQuery = data.query;
            state.invoiceStatus = data.status;
            break;
          case "task-filter":
            state.taskType = data.query;
            state.taskStatus = data.status;
            break;
          case "order-filter":
            state.orderQuery = data.query;
            state.orderStatus = data.status;
            state.expandedOrder = "";
            break;
          case "store-profile":
            if (!data.name.trim()) return toast("请填写店铺名称");
            stores[0].name = data.name.trim();
            state.storeDescription = data.description.trim();
            toast("店铺资料已保存");
            break;
          case "voucher":
            if (
              !data.voucher.trim() ||
              !data.reason.trim() ||
              data.quantity === ""
            )
              return toast("请填写盘点数量、凭证号和处理说明");
            toast("已录入示例凭证 " + data.voucher);
            return;
          case "add-cart": {
            const p = catalog.find((item) => item.id === Number(data.product));
            if (role === "visitor") {
              location.hash = goto("customer", "product", p.id);
              return;
            }
            const total = (state.cart[p.id] || 0) + Number(data.quantity);
            if (total > p.stock) return toast("购物车数量超过可售库存");
            state.cart[p.id] = total;
            return toast("已加入购物车 · " + p.name);
          }
          case "dialog-form": {
            if (state.pendingStoreAction) {
              if (!data.reason?.trim()) return toast("请填写处理说明");
              const [verb, id] = state.pendingStoreAction.split("-");
              const store = stores.find((item) => item.id === Number(id));
              const transitions = {
                approve: ["启用中", "positive"],
                reject: ["已拒绝", "negative"],
                disable: ["已停用", ""],
                enable: ["启用中", "positive"],
              };
              [store.status, store.tone] = transitions[verb];
              store.info = data.reason;
              toast("已更新示例审核状态");
            } else if ("merchant" in data) {
              if (!data.merchant.trim() || !data.email.trim() || !data.password)
                return toast("请完整填写商家账号资料");
              stores.push({
                id: Math.max(...stores.map((s) => s.id)) + 1,
                name: data.merchant,
                status: "待审核",
                tone: "pending",
                info: "账号已创建",
              });
              toast("已添加示例商家");
            } else if (Object.keys(data).length) {
              toast("已记录示例操作");
            }
            dialog.close();
            break;
          }
          default:
            return;
        }
        const activeField = document.activeElement?.name;
        render();
        if (activeField)
          restoreFocus(null, "#" + form.id + ' [name="' + activeField + '"]');

        portalNav.classList.toggle("is-open", open);
        mobileToggle.setAttribute("aria-expanded", String(open));
        mobileToggle.setAttribute("aria-label", open ? "关闭导航" : "打开导航");
      }
      mobileToggle.innerHTML = icon("list");
      document.querySelector(".mark").innerHTML = icon("bag-check");
      mobileToggle.addEventListener("click", () =>
        setMobileNavigation(!portalNav.classList.contains("is-open")),
      );
      document.addEventListener("click", (event) => {
        document.querySelectorAll(".nav-menu[open]").forEach((menu) => {
          if (!menu.contains(event.target)) menu.open = false;
        });
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        const menu = document.querySelector(".nav-menu[open]");
        if (menu) {
          menu.open = false;
          menu.querySelector("summary").focus();
        } else if (portalNav.classList.contains("is-open")) {
          setMobileNavigation(false);
          mobileToggle.focus();
        }
      });
      window.addEventListener("hashchange", () => {
        state.reviewPage = 0;
        state.settlementReport = false;
        state.expandedOrder = "";
        setMobileNavigation(false);
        document
          .querySelectorAll(".nav-menu[open]")
          .forEach((menu) => (menu.open = false));
        document.querySelector("#toast").hidden = true;
        render();
        window.scrollTo(0, 0);
        document.querySelector("main").focus({ preventScroll: true });
      });
      render();
    </script>
  </body>
</html>
