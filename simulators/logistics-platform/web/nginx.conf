server {
    listen 80;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; font-src 'self' data:; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    location = /healthz { return 200 "ok\n"; }
    location /api/admin/logistics/ {
        set $logistics http://logistics-simulator-service:8080;
        proxy_pass $logistics$request_uri;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-store always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
