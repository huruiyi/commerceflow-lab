services:
  fulfillment-return-data:
    container_name: fairy-commerceflow-fulfillment-return-data
    profiles: ["fulfillment-recovery"]
    image: mysql:8.4
    entrypoint: ["sh", "/recovery/return-fulfillment-data.sh"]
    environment:
      COMMERCE_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      FULFILLMENT_ROOT_PASSWORD: ${FULFILLMENT_MYSQL_ROOT_PASSWORD:-local-fulfillment-root-password}
    volumes:
      - ./infrastructure/commerce/return-fulfillment-data.sh:/recovery/return-fulfillment-data.sh:ro
    restart: "no"
