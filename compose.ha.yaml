services:
  kafka-broker:
    environment:
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  kafka-broker-2:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
    volumes: [kafka-broker-2-data:/var/lib/kafka/data]
  kafka-broker-3:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
    volumes: [kafka-broker-3-data:/var/lib/kafka/data]
  commerce-service:
    ports: !reset []
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:9092,kafka-broker-2:9092,kafka-broker-3:9092
      COMMERCEFLOW_KAFKA_TOPIC_REPLICAS: 3
    depends_on:
      kafka-broker: {condition: service_started}
      kafka-broker-2: {condition: service_started}
      kafka-broker-3: {condition: service_started}
    deploy: {replicas: 2}
volumes:
  kafka-broker-2-data:
  kafka-broker-3-data:
