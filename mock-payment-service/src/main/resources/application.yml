spring:
  application:
    name: mock-payment-service
  datasource:
    url: ${PAYMENT_DATABASE_URL:jdbc:mysql://localhost:13307/payment_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${PAYMENT_DATABASE_USERNAME:payment}
    password: ${PAYMENT_DATABASE_PASSWORD:payment-password}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  session:
    store-type: redis
    redis:
      namespace: payment-platform:session
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: PAYMENT_ADMIN_SESSION
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

payment-platform:
  checkout-base-url: ${PAYMENT_CHECKOUT_BASE_URL:http://localhost:14201}
  callback-url: ${PAYMENT_CALLBACK_URL:http://localhost:18081/api/payment-notifications/callback}
  refund-callback-url: ${REFUND_CALLBACK_URL:http://localhost:18081/api/refund-notifications/callback}
  callback-secret: ${PAYMENT_CALLBACK_SECRET:demo-platform-callback-secret}
  credential-master-key: ${PAYMENT_CREDENTIAL_MASTER_KEY:bG9jYWwtZGVtby1rZXktMTIzNDU2Nzg5MC1hYmNkZWY=}
  login:
    max-failures: ${PAYMENT_LOGIN_MAX_FAILURES:5}
    lock-duration: ${PAYMENT_LOGIN_LOCK_DURATION:15m}
    rate-limit-window: ${PAYMENT_LOGIN_RATE_WINDOW:5m}
    rate-limit-attempts: ${PAYMENT_LOGIN_RATE_ATTEMPTS:15}
  signature:
    allowed-skew: ${PAYMENT_SIGNATURE_ALLOWED_SKEW:5m}
    requests-per-minute: ${PAYMENT_SIGNATURE_REQUESTS_PER_MINUTE:120}
